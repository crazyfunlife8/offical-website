<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 極限倒角玻璃版</title>
<!--
  探索沙盒（不上 production）— 軟體開發玻璃卡「CSS 極限倒角版」
  目標：純 CSS 把「厚切邊 + 切邊高光 + 圓潤轉角反光」做到極限（參考 _imgtest/ads-b.png 的玻璃質感）
  代價：背景星雨只能貼著透、不會被玻璃折彎（真折射要 WebGL 版）
  與 service-glass-webgl-real.html 並排比較 → service-glass-final-compare.html
  建立 2026-06-20
-->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Italiana&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  :root{ --deep:#050d2e; --star:#e8f0ff; --cyan:#00c8ff; --blue:23,54,245; --gold:255,199,9;
    --bevel:14; --edge:1; --milk:0.06; --tiltX:6; --tiltY:-6; --glassthick:16; --blur:3; }
  html,body{ height:100%; background:var(--deep); color:var(--star); font-family:"Noto Sans TC",sans-serif; overflow:hidden; }
  body::before{ content:''; position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(120% 90% at 78% -8%, rgba(40,70,160,.30), transparent 52%),
      radial-gradient(90% 80% at 12% 108%, rgba(20,40,120,.22), transparent 56%),
      linear-gradient(160deg, #061036 0%, #050d2e 46%, #03081f 100%); }
  #rain{ position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }

  .stage{ position:relative; z-index:2; height:100%; display:flex; align-items:center; justify-content:center; }
  .badge{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:30;
    font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.22em; color:rgba(0,200,255,.85);
    border:1px solid rgba(0,200,255,.3); border-radius:999px; padding:7px 18px; background:rgba(6,10,20,.6); }

  /* ════ CSS 極限倒角玻璃 ════ */
  .glass{ position:relative; width:min(440px,86vw); aspect-ratio:1/1.16; border-radius:30px;
    transform:perspective(1700px) rotateX(calc(var(--tiltX)*1deg)) rotateY(calc(var(--tiltY)*1deg)); transform-origin:center center;
    /* 透明玻璃本體 */
    background:
      radial-gradient(130% 100% at 18% 4%, rgba(255,255,255, calc(var(--milk)*1.5)), transparent 42%),
      linear-gradient(158deg, rgba(170,195,255, calc(var(--milk)*0.9)), rgba(255,255,255, calc(var(--milk)*0.25)) 50%, rgba(120,150,255, calc(var(--milk)*0.5)));
    backdrop-filter:blur(calc(var(--blur)*1px)) saturate(118%);
    -webkit-backdrop-filter:blur(calc(var(--blur)*1px)) saturate(118%);
    box-shadow:
      /* 落地陰影 + 藍光外暈 */
      0 56px 120px rgba(0,0,0,.6),
      0 0 92px rgba(90,125,255,.20),
      /* 倒角受光：上＋左切邊亮、下＋右切邊折射藍光 */
      inset 0 3px 1px rgba(255,255,255, var(--edge)),
      inset 2px 0 2px rgba(255,255,255, calc(var(--edge)*0.45)),
      inset 0 -3px 8px rgba(120,155,235, calc(var(--edge)*0.7)),
      inset -2px 0 5px rgba(150,185,255, calc(var(--edge)*0.4)),
      inset 0 0 40px rgba(180,205,255,.03); }

  /* 厚切邊倒角環（漸層描在圓角上，光繞一圈）*/
  .glass::before{ content:''; position:absolute; inset:0; border-radius:30px; z-index:6; pointer-events:none;
    padding:calc(var(--bevel)*1px);
    background:
      radial-gradient(circle at 12% 8%,   rgba(255,255,255,.95), transparent 14%),
      radial-gradient(circle at 90% 12%,  rgba(255,255,255,.7),  transparent 12%),
      radial-gradient(circle at 88% 92%,  rgba(190,215,255,.8),  transparent 14%),
      radial-gradient(circle at 10% 90%,  rgba(160,195,255,.55), transparent 13%),
      linear-gradient(135deg, rgba(255,255,255,.98) 0%, rgba(150,180,255,.05) 16%, rgba(255,255,255,.58) 36%, rgba(120,160,255,.05) 56%, rgba(255,255,255,.5) 76%, rgba(195,218,255,.97) 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude;
    opacity:.96; }
  /* 斜向拋光掃光 */
  .glass::after{ content:''; position:absolute; inset:0; border-radius:30px; z-index:7; pointer-events:none;
    background:linear-gradient(118deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,.12) 7%, transparent 20%, transparent 80%, rgba(255,255,255,.06) 100%);
    mix-blend-mode:screen; }
  /* 頂緣藍金細線 */
  .topline{ position:absolute; top:0; left:14%; right:14%; height:1px; z-index:8; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(var(--blue),.7), rgba(var(--gold),.7), transparent); }

  .ghost{ position:absolute; right:-4%; bottom:-15%; z-index:2; font-family:"Noto Serif TC",serif; font-weight:700;
    font-size:min(42vw,300px); line-height:.8; color:rgba(225,235,255,.035); user-select:none; pointer-events:none; letter-spacing:-.02em; }
  .grain{ position:absolute; left:0; top:0; width:34%; height:100%; z-index:3; opacity:.05; pointer-events:none;
    font-family:"JetBrains Mono",monospace; font-size:11px; line-height:2; color:rgb(var(--blue)); white-space:pre; overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 50%,transparent 100%); mask-image:linear-gradient(90deg,#000 0%,#000 50%,transparent 100%); }
  .codebar{ position:absolute; top:0; left:0; right:0; z-index:5; padding:13px 26px; border-bottom:1px solid rgba(225,235,255,.05); opacity:.7; }
  .codebar .cpath{ font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:rgba(225,235,255,.42); }
  .content{ position:relative; z-index:5; width:100%; height:100%; padding:46px 40px 40px; display:flex; flex-direction:column; }
  .klab{ font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.26em; color:rgba(var(--gold),.82); }
  .knum{ position:absolute; top:30px; right:20px; font-family:"Italiana",serif; font-size:52px; color:rgba(var(--gold),.14); line-height:1; }
  .ztitle{ font-family:"Noto Serif TC",serif; font-weight:700; font-size:clamp(1.9rem,3.4vw,2.6rem); color:rgba(225,235,255,.97); margin:14px 0 6px; line-height:1.12; letter-spacing:.02em; }
  .zen{ font-family:"Italiana",serif; font-size:1.05rem; color:rgba(210,222,245,.5); letter-spacing:.04em; }
  .zsub{ margin-top:11px; font-size:.86rem; line-height:1.6; color:rgba(225,235,255,.55); max-width:92%; }
  .svc{ list-style:none; margin-top:auto; }
  .svc li{ display:flex; align-items:baseline; gap:12px; padding:11px 2px; border-top:1px solid rgba(225,235,255,.12); }
  .svc li .sn{ font-family:"Noto Serif TC",serif; font-size:1rem; color:rgba(225,235,255,.95); }
  .svc li .sd{ margin-left:auto; font-size:.76rem; color:rgba(225,235,255,.56); white-space:nowrap; }

  /* 拉軸 */
  .panel{ position:fixed; right:0; top:0; bottom:0; width:230px; z-index:40; overflow-y:auto;
    background:rgba(6,10,20,.9); backdrop-filter:blur(8px); border-left:1px solid rgba(225,235,255,.1);
    padding:16px 16px 40px; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:rgba(225,235,255,.8); }
  .panel h4{ font-size:11px; letter-spacing:.16em; margin-bottom:14px; color:rgba(0,200,255,.95); font-weight:500; }
  .row{ margin:12px 0; } .row label{ display:flex; justify-content:space-between; margin-bottom:4px; }
  .row b{ color:rgba(0,200,255,.95); font-weight:500; } .row input{ width:100%; accent-color:var(--cyan); }
  .dump{ margin-top:14px; padding:10px; border-radius:6px; background:rgba(0,0,0,.45); border:1px solid rgba(225,235,255,.1);
    font-size:9px; line-height:1.55; color:rgba(170,225,255,.85); white-space:pre-wrap; }
</style>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="badge">CSS 極限倒角玻璃版</div>

  <div class="stage">
    <div class="glass" id="card">
      <span class="topline"></span>
      <div class="ghost">網</div>
      <div class="grain"></div>
      <div class="codebar"><span class="cpath">WEB ARCHITECTURE</span></div>
      <div class="content">
        <p class="klab">// WEB DEVELOPMENT</p>
        <span class="knum">01</span>
        <h3 class="ztitle">網站架設</h3>
        <p class="zen">Your digital front door.</p>
        <p class="zsub">從一頁式門面到企業電商，依需求量身打造，不套公版。</p>
        <ul class="svc">
          <li><span class="sn">形象 / 一頁式官網</span><span class="sd">乾淨俐落的數位門面</span></li>
          <li><span class="sn">電商 / 會員整合</span><span class="sd">線上販售與會員經營</span></li>
          <li><span class="sn">客製整合站</span><span class="sd">特殊流程、活動、訂閱</span></li>
        </ul>
      </div>
    </div>
  </div>

  <aside class="panel">
    <h4>CSS 倒角玻璃 · 拉軸</h4>
    <div class="rows"></div>
    <div class="dump" id="dump"></div>
  </aside>

<script>
(function(){
  const PARAMS=[
    {k:'bevel',     name:'倒角厚度', min:4,  max:32, step:1, suf:'px'},
    {k:'edge',      name:'切邊高光', min:0,  max:1,  step:0.05},
    {k:'milk',      name:'白霧(越低越精透)', min:0, max:0.3, step:0.005},
    {k:'tiltX',     name:'上下傾(仰角)', min:-24,max:24, step:1, suf:'°'},
    {k:'tiltY',     name:'左右傾',   min:-24,max:24, step:1, suf:'°'},
    {k:'blur',      name:'背景模糊', min:0,  max:30, step:1, suf:'px'},
  ];
  const state={ bevel:14, edge:1, milk:0.06, tiltX:6, tiltY:-6, blur:3 };
  const R=document.documentElement, card=document.getElementById('card');
  function apply(){ for(const p of PARAMS) R.style.setProperty('--'+p.k, state[p.k]);
    document.getElementById('dump').textContent=PARAMS.map(p=>'--'+p.k+': '+state[p.k]+(p.suf||'')+';').join('\n'); }
  const wrap=document.querySelector('.panel .rows');
  for(const p of PARAMS){ const row=document.createElement('div'); row.className='row';
    row.innerHTML='<label><span>'+p.name+'</span><b id="v_'+p.k+'">'+state[p.k]+(p.suf||'')+'</b></label>'+
      '<input type="range" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+state[p.k]+'" data-k="'+p.k+'">';
    const inp=row.querySelector('input'); inp.oninput=()=>{ const v=parseFloat(inp.value); state[p.k]=v;
      document.getElementById('v_'+p.k).textContent=v+(p.suf||''); apply(); }; wrap.appendChild(row); }
  apply();

  const GRAIN=['const nest = createStudio()','export default function App(){','return <Section/>','await build(idea)','if(ready) ship()','render(art, code)','while(true){ create() }'].join('\n').repeat(8);
  document.querySelector('.grain').textContent=GRAIN;

  /* 程式碼星雨（打到卡頂緣濺火花）*/
  const cv=document.getElementById('rain'), ctx=cv.getContext('2d');
  const CODE=['const nest = createStudio()','export default function App() {','<section class="services">','router.get(\'/api/orders\', fn)','await db.clients.findMany()','npm run build && deploy','return <Card {...props} />','useEffect(() => render(), [])','if (user.ready) launch()','SELECT * FROM orders;','transform: translateY(-4px)','git commit -m "ship it"'];
  let W,H,dpr; function rs(){ dpr=Math.min(devicePixelRatio,2); W=cv.clientWidth=innerWidth; H=cv.clientHeight=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  rs(); addEventListener('resize',rs);
  const hash=(a,b)=>{ const x=Math.sin(a*127.1+b*311.7)*43758.5453; return x-Math.floor(x); };
  const ND=30, D=[]; for(let i=0;i<ND;i++) D.push({ spd:0.09+hash(i,1)*0.10, ph:hash(i,2)*1.8, sz:12+(hash(i,4)*3|0), ye:hash(i,5)<0.12, cy:hash(i,6)<0.30 });
  function rect(){ const r=document.getElementById('card').getBoundingClientRect(); return {l:r.left,r:r.right,t:r.top}; }
  function draw(t){ ctx.clearRect(0,0,W,H); const rc=rect(); ctx.textBaseline='middle';
    for(let i=0;i<ND;i++){ const d=D[i]; const raw=t*d.spd+d.ph, cyc=Math.floor(raw/1.8), prog=raw%1.8-0.25; if(prog<0) continue;
      const code=CODE[(i*5+cyc)%CODE.length]; ctx.font=d.sz+'px "JetBrains Mono",monospace';
      const w=ctx.measureText(code).width; const x=16+Math.floor(hash(i,cyc*9+5)*(W-32)); const tipY=prog*H;
      const base=d.ye?'255,199,9':(d.cy?'96,134,255':'150,170,220');
      let hitY=Infinity; if(x>=rc.l && x<=rc.r && rc.t<hitY) hitY=rc.t; const hitProg=hitY/H;
      if(prog<=hitProg){ ctx.save(); ctx.translate(x,tipY); ctx.rotate(-Math.PI/2); ctx.textAlign='left';
        const g=ctx.createLinearGradient(0,0,w,0); g.addColorStop(0,'rgba(240,247,255,0.9)'); g.addColorStop(0.1,'rgba('+base+',0.8)'); g.addColorStop(1,'rgba('+base+',0)');
        ctx.fillStyle=g; ctx.fillText(code,0,0); ctx.restore();
      } else if(hitY<Infinity){ const tau=(prog-hitProg)/d.spd;
        if(tau<0.6){ const fade=1-tau/0.6;
          const lg=ctx.createRadialGradient(x,hitY,0,x,hitY,52); lg.addColorStop(0,'rgba(160,180,255,'+(0.5*fade)+')'); lg.addColorStop(0.4,'rgba(23,54,245,'+(0.24*fade)+')'); lg.addColorStop(1,'rgba(23,54,245,0)');
          ctx.fillStyle=lg; ctx.fillRect(x-52,hitY-54,104,56);
          ctx.fillStyle='rgba(210,245,255,'+(0.9*fade)+')'; ctx.fillRect(x-11,hitY-1.5,22,2);
          ctx.textAlign='center'; for(let j=0;j<7;j++){ const vx=(hash(i,cyc*13+j)-0.5)*140, vy=-(42+hash(i,cyc*17+j)*110);
            const px=x+vx*tau, py=hitY+vy*tau+170*tau*tau; if(py>hitY+2) continue;
            ctx.font=(8+(hash(i,j+9)*4|0))+'px "JetBrains Mono",monospace'; ctx.fillStyle=j%2?'rgba(120,148,255,'+(fade*0.85)+')':'rgba(235,240,255,'+(fade*0.85)+')';
            ctx.fillText(code[(j*5+cyc)%code.length],px,py); } } } } }
  const T0=performance.now(); (function loop(){ requestAnimationFrame(loop); draw((performance.now()-T0)/1000); })();
})();
</script>
</body>
</html>
