<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整合舞台試驗 · 黑洞星場 0.169 移植（階段1）｜創巢數位（探索）</title>
<meta name="robots" content="noindex">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#020b1e; overflow-x:hidden; }
  body{ min-height:300vh; }  /* 撐高度，之後服務區水卡會在中段 */
  /* 全頁固定星場 canvas（對應正式站 #starfield-canvas）*/
  #stage-canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; }
  .tag{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:50;
    font-family:monospace; font-size:11px; letter-spacing:.08em; color:rgba(225,235,255,.5); }
  .scrollnote{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:50;
    font-family:monospace; font-size:11px; color:rgba(225,235,255,.35); }
</style>
</head>
<body>
<span class="tag">// 階段1 · 黑洞星場 Three 0.169 移植驗證（核心數值原樣搬自 starfield.js）</span>
<canvas id="stage-canvas"></canvas>
<span class="scrollnote">single 0.169 pipeline · 之後水卡併入同一 scene</span>

<script type="importmap">
{ "imports": { "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   黑洞星場 — 從 assets/js/starfield.js (r128 global) 移植到 0.169 module
   核心數值原樣搬（CLAUDE.md 標核心數值禁改）：COUNT / ORBITAL_BANDS /
   R_MIN / SPIRAL_K / TILT / ROT_BY_TYPE / BASE_PULL / WARMUP_FRAMES 全照原值
   差異僅：global THREE → import；outputColorSpace 對齊 r128 的 linear 輸出
   ============================================================ */

const canvas = document.getElementById('stage-canvas');
const IS_TOUCH_DEVICE = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:false });
// r128 預設 outputEncoding=LinearEncoding（不做 sRGB gamma）；0.169 預設 srgb → 對齊回 linear 求與原版一致
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_TOUCH_DEVICE ? 1.0 : 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.sortObjects = false;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.z = 4;

function makeStarTex(){
  const sz=32, cv=document.createElement('canvas'); cv.width=cv.height=sz;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);
  g.addColorStop(0,'rgba(255,255,255,1.0)'); g.addColorStop(0.12,'rgba(255,255,255,0.85)');
  g.addColorStop(0.45,'rgba(255,255,255,0.12)'); g.addColorStop(1.0,'rgba(255,255,255,0.0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,sz,sz);
  return new THREE.CanvasTexture(cv);
}

const COUNT    = IS_TOUCH_DEVICE ? 2000 : 6500;
const R_MIN    = 0.42;
const SPIRAL_K = 0.42;
const TILT     = Math.PI/12;
const COS_T=Math.cos(TILT), SIN_T=Math.sin(TILT);
const ORBITAL_BANDS = [[0.42,2.0],[1.2,3.0],[1.8,4.0],[2.5,5.5]];

const starData=new Float32Array(COUNT*4), starType=new Uint8Array(COUNT), starBright=new Float32Array(COUNT);
const positions=new Float32Array(COUNT*3), aColors=new Float32Array(COUNT*3), aSizes=new Float32Array(COUNT);

function spawnStar(i){
  const i4=i*4;
  const tr=Math.random();
  const type = tr<0.15?0 : tr<0.30?1 : tr<0.60?2 : 3;
  starType[i]=type;
  const [rMin,rMax]=ORBITAL_BANDS[type];
  const r=Math.sqrt(rMin*rMin + Math.random()*(rMax*rMax-rMin*rMin));
  let theta;
  if(Math.random()<0.95){
    const arm=Math.floor(Math.random()*2)*Math.PI+TILT;
    const spread=(Math.random()-0.5)*0.08;
    theta=arm - Math.log(r+0.1)*SPIRAL_K*3.5 + spread;
  } else theta=Math.random()*Math.PI*2;
  starData[i4]=r; starData[i4+1]=theta; starData[i4+2]=(Math.random()-0.5)*0.22;
  const u=Math.random();
  const sz = u<0.55?0.002+Math.random()*0.003 : u<0.82?0.005+Math.random()*0.007
           : u<0.96?0.013+Math.random()*0.010 : 0.026+Math.random()*0.014;
  starData[i4+3]=sz;
  const bv=Math.random();
  starBright[i]= bv<0.58?0.08+Math.random()*0.20 : bv<0.83?0.32+Math.random()*0.26
              : bv<0.97?0.62+Math.random()*0.23 : 0.88+Math.random()*0.12;
}
for(let i=0;i<COUNT;i++) spawnStar(i);

const geo=new THREE.BufferGeometry();
const posAttr=new THREE.BufferAttribute(positions,3), colAttr=new THREE.BufferAttribute(aColors,3), szAttr=new THREE.BufferAttribute(aSizes,1);
posAttr.setUsage(THREE.DynamicDrawUsage); colAttr.setUsage(THREE.DynamicDrawUsage); szAttr.setUsage(THREE.DynamicDrawUsage);
geo.setAttribute('position',posAttr); geo.setAttribute('aColor',colAttr); geo.setAttribute('aSize',szAttr);

const starMat=new THREE.ShaderMaterial({
  uniforms:{ uTex:{ value:makeStarTex() } },
  vertexShader:`
    attribute float aSize; attribute vec3 aColor; varying vec3 vColor;
    void main(){ vColor=aColor; vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aSize*(320.0/-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`
    uniform sampler2D uTex; varying vec3 vColor;
    void main(){ vec4 t=texture2D(uTex,gl_PointCoord); gl_FragColor=vec4(vColor, t.r*0.93); }`,
  transparent:true, blending:THREE.AdditiveBlending, depthTest:false, depthWrite:false,
});
const starPoints=new THREE.Points(geo,starMat); starPoints.renderOrder=1; scene.add(starPoints);

// 背景星塵
const BG_N=IS_TOUCH_DEVICE?600:1800;
const bgGeo=new THREE.BufferGeometry(); const bgPos=new Float32Array(BG_N*3), bgCol=new Float32Array(BG_N*3);
for(let i=0;i<BG_N;i++){ const i3=i*3; const t2=Math.random()*Math.PI*2; const ph=Math.acos(2*Math.random()-1); const r=4+Math.random()*10;
  bgPos[i3]=r*Math.sin(ph)*Math.cos(t2); bgPos[i3+1]=r*Math.sin(ph)*Math.sin(t2); bgPos[i3+2]=r*Math.cos(ph);
  const rnd=Math.random();
  if(rnd<0.06){ bgCol[i3]=1.0; bgCol[i3+1]=0.88; bgCol[i3+2]=0.5; }
  else if(rnd<0.16){ bgCol[i3]=0.5; bgCol[i3+1]=0.65; bgCol[i3+2]=1.0; }
  else { const b=0.55+Math.random()*0.45; bgCol[i3]=b; bgCol[i3+1]=b; bgCol[i3+2]=b; } }
bgGeo.setAttribute('position',new THREE.BufferAttribute(bgPos,3)); bgGeo.setAttribute('color',new THREE.BufferAttribute(bgCol,3));
const bgStars=new THREE.Points(bgGeo,new THREE.PointsMaterial({ size:0.45, map:makeStarTex(), vertexColors:true,
  transparent:true, opacity:0.60, sizeAttenuation:false, blending:THREE.AdditiveBlending, depthTest:false, depthWrite:false }));
bgStars.renderOrder=0; scene.add(bgStars);

// 星際塵埃
const DUST_N=IS_TOUCH_DEVICE?800:2800;
const dustGeo=new THREE.BufferGeometry(); const dustPos=new Float32Array(DUST_N*3), dustCol=new Float32Array(DUST_N*3), dustSize=new Float32Array(DUST_N);
for(let d=0;d<DUST_N;d++){ const d3=d*3;
  const rD=Math.sqrt(R_MIN*R_MIN+Math.random()*(5.2*5.2-R_MIN*R_MIN));
  const armD=Math.floor(Math.random()*2)*Math.PI+TILT;
  const sprdD=(Math.random()-0.5)*(Math.random()<0.7?0.55:Math.PI*2);
  const thetaD=armD - Math.log(rD+0.1)*SPIRAL_K*3.5 + sprdD;
  const aD=rD, bD=rD*0.38; const pxD=aD*Math.cos(thetaD), pyD=bD*Math.sin(thetaD);
  dustPos[d3]=pxD*COS_T-pyD*SIN_T; dustPos[d3+1]=pxD*SIN_T+pyD*COS_T; dustPos[d3+2]=(Math.random()-0.5)*0.55;
  const bright=0.03+Math.random()*0.11; const nrD=Math.max(0,Math.min(1,(rD-0.42)/5.08));
  let dr,dg,db;
  if(nrD<0.20){ dr=0.75+nrD*1.25; dg=0.85+nrD*0.75; db=1.00; }
  else if(nrD<0.50){ const f=(nrD-0.20)/0.30; dr=1.00; dg=1.00-f*0.12; db=1.00-f*0.45; }
  else { const f=(nrD-0.50)/0.50; dr=1.00-f*0.35; dg=0.88-f*0.23; db=0.55+f*0.45; }
  dustCol[d3]=dr*bright; dustCol[d3+1]=dg*bright; dustCol[d3+2]=db*bright;
  dustSize[d]=0.004+Math.random()*0.012; }
dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3)); dustGeo.setAttribute('aColor',new THREE.BufferAttribute(dustCol,3)); dustGeo.setAttribute('aSize',new THREE.BufferAttribute(dustSize,1));
const dustMat=new THREE.ShaderMaterial({
  uniforms:{ uTex:{ value:makeStarTex() } },
  vertexShader:`
    attribute float aSize; attribute vec3 aColor; varying vec3 vColor;
    void main(){ vColor=aColor; vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aSize*(320.0/-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`
    uniform sampler2D uTex; varying vec3 vColor;
    void main(){ vec4 t=texture2D(uTex,gl_PointCoord); gl_FragColor=vec4(vColor, t.r*0.80); }`,
  transparent:true, blending:THREE.AdditiveBlending, depthTest:false, depthWrite:false,
});
const dustPoints=new THREE.Points(dustGeo,dustMat); dustPoints.renderOrder=0; scene.add(dustPoints);

// 動畫
const ROT_BY_TYPE=[0.00060,0.00032,0.00017,0.000075];
const BASE_PULL=0.000010;
const WARMUP_FRAMES=IS_TOUCH_DEVICE?2000:6000;
(function warmup(){
  for(let w=0;w<WARMUP_FRAMES;w++){
    for(let i=0;i<COUNT;i++){ const i4=i*4; let r=starData[i4], theta=starData[i4+1];
      const gravBoost=r<1.0?1+Math.pow(1-r,2)*3.0:1.0;
      theta+=ROT_BY_TYPE[starType[i]]/Math.sqrt(r+0.04)*gravBoost;
      r-=BASE_PULL/(r*r+0.06)*gravBoost;
      if(r<=R_MIN){ spawnStar(i); continue; }
      starData[i4]=r; starData[i4+1]=theta; } }
})();

function animate(){
  requestAnimationFrame(animate);
  const t=Date.now()*0.001;
  for(let i=0;i<COUNT;i++){ const i3=i*3,i4=i*4;
    let r=starData[i4], theta=starData[i4+1]; const zOff=starData[i4+2], bSz=starData[i4+3];
    const gravBoost=r<1.0?1+Math.pow(1-r,2)*3.0:1.0;
    theta+=ROT_BY_TYPE[starType[i]]/Math.sqrt(r+0.04)*gravBoost;
    r-=BASE_PULL/(r*r+0.06)*gravBoost;
    if(r<=R_MIN){ spawnStar(i); const nr=starData[i4],nt=starData[i4+1]; const ea=nr,eb=nr*0.38;
      const px=ea*Math.cos(nt),py=eb*Math.sin(nt);
      positions[i3]=px*COS_T-py*SIN_T; positions[i3+1]=px*SIN_T+py*COS_T; positions[i3+2]=starData[i4+2]; continue; }
    starData[i4]=r; starData[i4+1]=theta;
    const a=r,b=r*0.38; const fa=0.005*Math.sqrt(r);
    const px=a*Math.cos(theta)+Math.sin(t*0.18+i*0.19)*fa;
    const py=b*Math.sin(theta)+Math.cos(t*0.13+i*0.25)*fa;
    positions[i3]=px*COS_T-py*SIN_T; positions[i3+1]=px*SIN_T+py*COS_T; positions[i3+2]=zOff;
    const heatCore=r<1.2?Math.max(0,(1.2-r)/0.78):0;
    const normR=Math.max(0,Math.min(1,(r-0.42)/5.08));
    let cr,cg,cb;
    if(normR<0.20){ cr=0.75+normR*1.25; cg=0.85+normR*0.75; cb=1.00; }
    else if(normR<0.50){ const f=(normR-0.20)/0.30; cr=1.00; cg=1.00-f*0.12; cb=1.00-f*0.45; }
    else { const f=(normR-0.50)/0.50; cr=1.00-f*0.35; cg=0.88-f*0.23; cb=0.55+f*0.45; }
    cr=Math.min(1,cr+heatCore*(1-cr)*0.85); cg=Math.min(1,cg+heatCore*(1-cg)*0.85); cb=Math.min(1,cb+heatCore*(1-cb)*0.55);
    const depthDim=0.88+0.12*((zOff+0.11)/0.22); cr*=depthDim; cg*=depthDim; cb*=depthDim;
    const orbitalBright=normR<0.30?1.0:1.0-(normR-0.30)*0.55;
    const bright=orbitalBright*starBright[i]; cr*=bright; cg*=bright; cb*=bright;
    const twinkle=bSz>0.013?0.72+0.28*Math.sin(t*(1.1+i*0.006)+i*2.3):1.0;
    aColors[i3]=cr*twinkle; aColors[i3+1]=cg*twinkle; aColors[i3+2]=cb*twinkle;
    aSizes[i]=bSz*(0.75+heatCore*2.5);
  }
  posAttr.needsUpdate=true; colAttr.needsUpdate=true; szAttr.needsUpdate=true;
  bgStars.rotation.y+=0.000009; dustPoints.rotation.z+=0.000022;
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
</script>
</body>
</html>
