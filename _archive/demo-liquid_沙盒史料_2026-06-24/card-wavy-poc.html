<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立體玻璃卡 + 水狀外框 POC｜創巢數位</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#05070f; overflow:hidden; font-family:"Microsoft JhengHei","PingFang TC",sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; left:24px; bottom:20px; z-index:10; color:rgba(200,225,255,.55);
    font-size:12px; letter-spacing:.04em; line-height:1.7; pointer-events:none; text-shadow:0 1px 2px #000; }
  .hud b { color:rgba(0,200,255,.9); }
  .panel { position:fixed; right:18px; top:18px; z-index:10; background:rgba(10,16,30,.72);
    border:1px solid rgba(0,200,255,.25); border-radius:12px; padding:14px 16px;
    backdrop-filter:blur(8px); color:#cfe3ff; font-size:12px; width:240px; }
  .panel h4 { font-size:11px; letter-spacing:.16em; color:rgba(0,200,255,.85); margin-bottom:10px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:9px 0; }
  .row label { flex:0 0 auto; opacity:.8; }
  .row input[type=range] { flex:1; accent-color:#00c8ff; }
  .row span { flex:0 0 40px; text-align:right; font-variant-numeric:tabular-nums; opacity:.7; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">拖曳滑鼠：轉動看立體 · 面是平的、<b>只有邊是水狀</b> · POC（不影響正式網站）</div>
<div class="panel">
  <h4>立體玻璃卡 + 水狀外框</h4>
  <div class="row"><label>水波幅度 邊</label><input id="p-amp" type="range" min="0" max="0.5" step="0.01" value="0.16"><span id="v-amp">0.16</span></div>
  <div class="row"><label>水波密度 邊</label><input id="p-frq" type="range" min="3" max="16" step="1" value="7"><span id="v-frq">7</span></div>
  <div class="row"><label>色散 disp</label><input id="p-disp" type="range" min="0" max="8" step="0.1" value="3.2"><span id="v-disp">3.2</span></div>
  <div class="row"><label>厚度</label><input id="p-thick" type="range" min="0.3" max="3" step="0.1" value="0.9"><span id="v-thick">0.9</span></div>
  <div class="row"><label>折射 IOR</label><input id="p-ior" type="range" min="1.05" max="1.6" step="0.01" value="1.22"><span id="v-ior">1.22</span></div>
  <div class="row"><label>霧度</label><input id="p-rough" type="range" min="0" max="0.3" step="0.01" value="0.05"><span id="v-rough">0.05</span></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 9);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// background
function bgTexture(){
  const c=document.createElement('canvas'); c.width=1024; c.height=1024; const g=c.getContext('2d');
  const grd=g.createRadialGradient(512,430,60,512,512,760);
  grd.addColorStop(0,'#13203f'); grd.addColorStop(0.45,'#0a1226'); grd.addColorStop(1,'#05070f');
  g.fillStyle=grd; g.fillRect(0,0,1024,1024);
  for(let i=0;i<480;i++){ const x=Math.random()*1024,y=Math.random()*1024,r=Math.random()*1.4+0.2;
    g.globalAlpha=Math.random()*0.7+0.15; g.fillStyle=Math.random()>0.85?'#bfe6ff':'#fff';
    g.beginPath(); g.arc(x,y,r,0,6.28); g.fill(); }
  g.globalAlpha=1; const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
scene.background = bgTexture();

// card content (opaque, so transmission refracts it inside the glass)
function cardTexture(){
  const W=900,H=1180,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,W,H);
  grd.addColorStop(0,'#0c1c38'); grd.addColorStop(0.5,'#0a2440'); grd.addColorStop(1,'#06182e');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  const sh=g.createLinearGradient(0,0,0,H*0.5);
  sh.addColorStop(0,'rgba(120,200,255,0.16)'); sh.addColorStop(1,'rgba(120,200,255,0)');
  g.fillStyle=sh; g.fillRect(0,0,W,H*0.5);
  g.fillStyle='rgba(255,199,9,0.95)'; g.font='600 30px Consolas,monospace'; g.textBaseline='top';
  g.fillRect(90,150,70,2); g.fillText('SOCIAL  SERVICE', 90, 172);
  g.fillStyle='rgba(240,248,255,0.98)'; g.font='500 92px "Microsoft JhengHei",serif'; g.fillText('社群經營', 86, 300);
  g.fillStyle='rgba(210,228,250,0.92)'; g.font='400 33px "Microsoft JhengHei",sans-serif';
  ['你不是缺一個會發文的人，','是缺有人替你想清楚要說什麼。','素材設計、文案發想、帳號定位，','從靈魂出發。'].forEach((l,i)=>g.fillText(l,90,470+i*52));
  g.fillStyle='rgba(0,200,255,0.9)'; g.font='italic 36px Georgia,serif'; g.fillText('Read more',90,1010);
  g.strokeStyle='rgba(0,200,255,0.7)'; g.lineWidth=2; g.beginPath(); g.moveTo(290,1030); g.lineTo(360,1030); g.stroke();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
const cardW=4.0, cardH=cardW*(1180/900);
const textPlane=new THREE.Mesh(new THREE.PlaneGeometry(cardW*0.96,cardH*0.96), new THREE.MeshBasicMaterial({map:cardTexture()}));
textPlane.position.z=-0.32; scene.add(textPlane);

// glass material
const glassMat=new THREE.MeshPhysicalMaterial({
  transmission:1.0, thickness:0.9, ior:1.22, roughness:0.05, metalness:0.0,
  dispersion:3.2, specularIntensity:1.0, clearcoat:0.7, clearcoatRoughness:0.18,
  attenuationColor:new THREE.Color(0xeaf7ff), attenuationDistance:40.0,
  envMapIntensity:1.25, transparent:true
});

// ---- 水狀外框：圓角矩形 → 邊緣沿法線用 noise 推成不規則水邊 → 擠出厚度（面平、邊水狀）----
const GLASS_DEPTH = 0.5;
let glass=null;

function roundedRectShape(w,h,r){
  const s=new THREE.Shape(); const x=-w/2,y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.absarc(x+w-r,y+r,r,-Math.PI/2,0,false);
  s.lineTo(x+w,y+h-r); s.absarc(x+w-r,y+h-r,r,0,Math.PI/2,false);
  s.lineTo(x+r,y+h); s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI,false);
  s.lineTo(x,y+r); s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5,false);
  return s;
}
// 周期性有機 noise（整數諧波 → 起點終點無縫）
function edgeNoise(th, K){
  return (Math.sin(th*K) + 0.55*Math.sin(th*K*2 + 1.7) + 0.35*Math.sin(th*K*3 + 0.6)) / 1.9;
}
function buildGlass(amp, K){
  const base=roundedRectShape(cardW,cardH,0.5);
  const pts=base.getPoints(260);
  const n=pts.length;
  const out=[];
  for(let i=0;i<n;i++){
    const p=pts[i], pn=pts[(i+1)%n], pp=pts[(i-1+n)%n];
    let tx=pn.x-pp.x, ty=pn.y-pp.y; const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
    let nx=ty, ny=-tx;                       // 邊的法線
    if (nx*p.x+ny*p.y < 0){ nx=-nx; ny=-ny; } // 保證朝外
    const d = edgeNoise(i/n*Math.PI*2, K) * amp;
    out.push(new THREE.Vector2(p.x+nx*d, p.y+ny*d));
  }
  const shape=new THREE.Shape(out);
  const geo=new THREE.ExtrudeGeometry(shape,{
    depth:GLASS_DEPTH, bevelEnabled:true, bevelThickness:0.1, bevelSize:0.1, bevelSegments:5, steps:1, curveSegments:8
  });
  geo.center();
  if(!glass){ glass=new THREE.Mesh(geo,glassMat); scene.add(glass); }
  else { glass.geometry.dispose(); glass.geometry=geo; }
}
buildGlass(0.16, 7);

const key=new THREE.DirectionalLight(0xcfeaff,2.2); key.position.set(4,6,5); scene.add(key);
const rim=new THREE.DirectionalLight(0x2a6cff,1.4); rim.position.set(-5,-2,3); scene.add(rim);

const target={x:0,y:0};
addEventListener('pointermove',e=>{ target.x=(e.clientX/innerWidth-0.5)*0.6; target.y=(e.clientY/innerHeight-0.5)*0.4; });

const $=id=>document.getElementById(id);
let amp=0.16, K=7;
const bind=(id,vid,fn,rebuild)=>{ const el=$(id),v=$(vid);
  el.addEventListener('input',()=>{ v.textContent=(+el.value).toFixed(el.step.includes('.')?2:0); fn(+el.value); if(rebuild) buildGlass(amp,K); }); };
bind('p-amp','v-amp', x=>amp=x, true);
bind('p-frq','v-frq', x=>K=x|0, true);
bind('p-disp','v-disp', x=>glassMat.dispersion=x);
bind('p-thick','v-thick', x=>glassMat.thickness=x);
bind('p-ior','v-ior', x=>glassMat.ior=x);
bind('p-rough','v-rough', x=>glassMat.roughness=x);

function tick(){
  requestAnimationFrame(tick);
  glass.rotation.y += (target.x - glass.rotation.y)*0.06;
  glass.rotation.x += (target.y - glass.rotation.x)*0.06;
  textPlane.rotation.copy(glass.rotation);
  renderer.render(scene,camera);
}
tick();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
