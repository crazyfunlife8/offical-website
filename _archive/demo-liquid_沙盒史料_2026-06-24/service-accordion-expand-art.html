<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>手風琴展開態·白色系背景三版比較｜創巢數位</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Italiana&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/chiron-fonts/chiron-sung-hk@1.024/WOFF2_TTF/css/vf.css">
<style>
:root{
  --cyan:0,200,255; --blue:23,54,245; --yellow:245,166,35; --stellar:225,235,255;
  --ink:5,12,26;
  /* 展開白底用：深色字 + 沉穩青藍小點綴（不死冷的深teal）+ 暖黃保留品牌 */
  --dk:26,32,44; --dk2:54,62,76; --teal:14,108,128;
  --f-cjk:"Chiron Sung HK","Noto Serif TC",serif;
  --f-en:"Italiana",serif;
  --f-mono:"JetBrains Mono",monospace;
  --f-body:"Noto Sans TC",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#03060d;font-family:var(--f-body);color:rgba(var(--stellar),.9);min-height:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(56px,9vh,96px) clamp(10px,2vw,28px) clamp(20px,4vh,40px);gap:18px;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(70% 50% at 50% -10%, rgba(var(--blue),.10), transparent 60%),
    radial-gradient(50% 40% at 85% 110%, rgba(var(--cyan),.06), transparent 60%);}

/* ─── 版本切換工具列 ─── */
.toolbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:center;
  gap:8px;padding:12px;background:linear-gradient(180deg,rgba(3,6,13,.92),rgba(3,6,13,0));
  backdrop-filter:blur(6px);}
.toolbar .tb-note{position:absolute;left:14px;top:14px;font-family:var(--f-mono);font-size:10.5px;
  letter-spacing:.16em;color:rgba(var(--yellow),.8);}
.tb{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;cursor:pointer;
  padding:7px 14px;border-radius:999px;color:rgba(var(--stellar),.7);
  border:1px solid rgba(var(--stellar),.18);background:rgba(var(--stellar),.04);
  transition:all .25s var(--ease);}
.tb small{display:block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-top:2px;}
.tb:hover{border-color:rgba(var(--cyan),.5);color:rgba(var(--stellar),.95);}
.tb.on{border-color:rgba(var(--cyan),.7);color:#04121e;background:rgba(var(--cyan),.85);
  box-shadow:0 0 18px rgba(var(--cyan),.35);}
.tb.on small{opacity:.85;}

.acc{position:relative;z-index:1;
  display:flex; gap:12px;
  width:min(1240px,100%,124vh); aspect-ratio:1.55/1;
}
.panel{
  position:relative; flex:1 1 0; min-width:0;
  border-radius:16px; overflow:hidden; cursor:pointer;
  border:1px solid rgba(var(--stellar),.14);
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(var(--blue),.18), transparent 60%),
    linear-gradient(180deg, rgba(12,22,46,.55), rgba(5,12,26,.78));
  box-shadow:-1px -1px 0 rgba(255,255,255,.72), 1px 1px 0 rgba(255,255,255,.22),
             0 0 14px rgba(255,255,255,.58), 0 0 34px 1px rgba(240,247,255,.24),
             0 10px 22px rgba(0,0,0,.34);
  transition:flex .62s var(--ease), transform .62s var(--ease), border-color .5s var(--ease), background .5s var(--ease), box-shadow .5s var(--ease);
}
.panel:not(.open):hover{ border-color:rgba(var(--cyan),.40);
  box-shadow:-1px -1px 0 rgba(255,255,255,.9), 1px 1px 0 rgba(255,255,255,.28),
             0 0 22px rgba(255,255,255,.78), 0 0 46px 2px rgba(238,246,255,.34),
             0 10px 24px rgba(0,0,0,.34); }
.panel.open{
  flex:4 1 0; cursor:default;
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.5);
  /* 白卡浮起：暖白光暈，像被打光的展品 */
  box-shadow:0 0 0 1px rgba(255,255,255,.6), 0 18px 44px rgba(0,0,0,.45), 0 0 60px rgba(240,247,255,.12);
}
/* 開啟卡左緣：細暖金光，取代原本的冷青neon（白底配青neon太刺） */
.panel.open::before{
  content:''; position:absolute; left:0; top:14%; bottom:14%; width:2px; z-index:5;
  background:linear-gradient(180deg,transparent,rgba(var(--yellow),.85),transparent);
  box-shadow:0 0 12px rgba(var(--yellow),.4);
}

/* 月面碑刻背景（收合態）＝完全沿用定案，不動 */
.bgimg{ position:absolute; inset:0; background-size:cover; background-position:center;
  box-shadow:inset 0 3px 7px rgba(0,0,0,.30), inset 0 -3px 6px rgba(255,255,255,.42),
             inset 3px 0 7px rgba(0,0,0,.16), inset -3px 0 6px rgba(255,255,255,.22);
  transition:opacity .5s var(--ease), filter .55s var(--ease); }
.bgimg::after{ content:''; position:absolute; inset:13px; border-radius:9px;
  border:1px solid rgba(18,24,34,.20);
  box-shadow:0 1px 0 rgba(255,255,255,.48), 0 -1px 0 rgba(0,0,0,.10),
             inset 0 1px 1px rgba(255,255,255,.38), inset 0 -1px 1px rgba(0,0,0,.18),
             inset 1px 0 0 rgba(255,255,255,.18), inset -1px 0 0 rgba(0,0,0,.10); }
/* ★ 關鍵的「跳」：展開時深黑月面石板淡出 → 換成白色系藝術空間 */
.panel.open .bgimg{ opacity:0; }
.acc:has(.panel.open) .panel:not(.open) .bgimg{ filter:brightness(.84) contrast(.95) saturate(.88); }
.acc:has(.panel.open) .panel:not(.open){
  box-shadow:-1px -1px 0 rgba(255,255,255,.4), 0 0 10px rgba(255,255,255,.34),
             0 0 22px rgba(240,247,255,.14), 0 8px 20px rgba(0,0,0,.32); }

/* ─── 收合脊柱：碑刻服務名（沿用定案） ─── */
.spine{ position:absolute; inset:0; z-index:3; padding:26px 24px;
  opacity:1; transition:opacity .35s var(--ease); }
.panel.open .spine{ opacity:0; pointer-events:none; }
.spine .num{ position:absolute; top:18px; right:20px; font-family:var(--f-en);
  font-size:3.1rem; line-height:.75; color:rgba(58,64,78,.26);
  text-shadow:0 1.5px 0 rgba(255,255,255,.55), 0 -1px 1px rgba(0,0,0,.22); }
.spine__cols{ position:relative; display:flex; flex-direction:row; align-items:flex-start; gap:10px; }
.spine .v{ writing-mode:vertical-rl; font-family:var(--f-cjk); font-weight:600;
  font-size:2.1rem; letter-spacing:.18em; line-height:1; color:rgba(48,54,67,.94);
  -webkit-text-stroke:.25px rgba(18,24,34,.15);
  text-shadow:0 2px 0 rgba(255,255,255,.7), 0 -1.5px 1px rgba(0,0,0,.40),
              1px 0 0 rgba(255,255,255,.14), -1px 0 0 rgba(0,0,0,.10),
              0 4px 5px rgba(0,0,0,.12); }
.spine .ven{ writing-mode:vertical-rl; font-family:var(--f-mono); font-size:10px; letter-spacing:.34em;
  text-transform:uppercase; color:rgba(62,68,82,.52);
  text-shadow:0 1px 0 rgba(255,255,255,.5), 0 -1px 0 rgba(0,0,0,.14);
  padding-left:8px; border-left:1px solid rgba(22,28,40,.16); }

/* ─── 展開內容容器（白底） ─── */
.body{
  position:absolute; inset:0; z-index:2; padding:clamp(22px,3vh,40px) clamp(24px,3vw,48px);
  opacity:0; visibility:hidden; transition:opacity .45s var(--ease) .12s, visibility 0s .6s;
  display:grid; grid-template-rows:auto 1fr; overflow:hidden;
}
.panel.open .body{ opacity:1; visibility:visible; transition:opacity .55s var(--ease) .2s; }

/* 生成的白色系背景圖（隨工具列切換） */
.bgart{ position:absolute; inset:0; z-index:-2; background:#f3f1ec center/cover no-repeat; }
[data-art="a"] .bgart{ background-image:url('../_imgtest/ai-particle-a-sq.png'); }
[data-art="b"] .bgart{ background-image:url('../_imgtest/ai-particle-b-sq.png'); }
[data-art="c"] .bgart{ background-image:url('../_imgtest/ai-shatter-a.png'); }
[data-art="d"] .bgart{ background-image:url('../_imgtest/ai-shatter-b.png'); }
[data-art="e"] .bgart{ background-image:url('../_imgtest/ai-particle-c-sq.png'); }
[data-art="f"] .bgart{ background-image:url('../_imgtest/ai-particle-d-sq.png'); }
/* 左重右輕的「提亮」柔遮罩：保住左側深色文字的對比，右側讓藝術元素透出 */
.body::before{ content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(100deg, rgba(248,247,243,.72) 0%, rgba(248,247,243,.44) 38%, rgba(248,247,243,.08) 64%, rgba(248,247,243,0) 100%); }

/* ─── 展開內文：深色字（白底版） ─── */
.head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; position:relative; }
.kicker{ font-family:var(--f-mono); font-size:11px; letter-spacing:.26em; text-transform:uppercase;
  color:rgba(var(--dk2),.85); padding-top:6px; border-top:1px solid rgba(var(--yellow),.7);
  display:inline-block; align-self:flex-start; }
.bignum{ font-family:var(--f-en); font-size:clamp(2.6rem,5vw,4.2rem); line-height:.8;
  color:rgba(var(--dk),.10); }
.title{ font-family:var(--f-cjk); font-weight:600; font-size:clamp(2rem,3.4vw,2.9rem);
  color:rgba(var(--dk),.97); letter-spacing:.04em; margin-top:clamp(10px,2vh,22px);
  text-shadow:0 1px 0 rgba(255,255,255,.6); }
.en{ font-family:var(--f-en); font-size:clamp(1rem,1.6vw,1.35rem); color:rgba(var(--teal),.85);
  letter-spacing:.03em; margin-top:4px; }
.lead{ font-size:clamp(.86rem,1.05vw,.98rem); line-height:1.85; color:rgba(var(--dk2),.86);
  max-width:34em; margin-top:clamp(12px,1.8vh,20px); }
.grid{ display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(24px,3vw,48px);
  align-content:start; margin-top:clamp(14px,2vh,22px); }
@media(max-width:760px){ .grid{ grid-template-columns:1fr; gap:18px; } }
.meta{ margin-top:16px; }
.meta + .meta{ margin-top:14px; }
.meta .ml{ font-family:var(--f-mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:rgba(var(--dk2),.5); margin-bottom:8px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ font-size:.8rem; padding:5px 12px; border-radius:999px; color:rgba(var(--dk),.82);
  border:1px solid rgba(var(--teal),.38); background:rgba(var(--teal),.06); }
.acts{ font-size:.84rem; line-height:1.6; color:rgba(var(--dk2),.78); }
.acts b{ color:rgba(var(--dk),.92); font-weight:600; }
.plans{ display:flex; flex-direction:column; gap:10px; }
.plan{ position:relative; border:1px solid rgba(30,40,55,.14); border-radius:12px;
  padding:13px 16px; background:rgba(255,255,255,.58); backdrop-filter:blur(4px);
  box-shadow:0 4px 16px rgba(40,46,60,.08);
  display:grid; grid-template-columns:1fr auto; gap:4px 14px; align-items:baseline;
  transition:border-color .3s var(--ease), background .3s var(--ease), box-shadow .3s var(--ease); }
.plan:hover{ border-color:rgba(var(--teal),.45); background:rgba(255,255,255,.74);
  box-shadow:0 6px 20px rgba(40,46,60,.12); }
.plan.feat{ border-color:rgba(200,150,40,.6);
  background:linear-gradient(0deg,rgba(245,200,80,.16),rgba(245,200,80,.16)),rgba(255,255,255,.72); }
.plan .pn{ font-family:var(--f-cjk); font-weight:600; font-size:1.02rem; color:rgba(var(--dk),.95); }
.plan .pp{ font-family:var(--f-mono); font-size:1.02rem; color:rgba(var(--dk),.95); text-align:right; }
.plan .pp small{ font-size:.66rem; color:rgba(var(--dk2),.55); letter-spacing:.04em; }
.plan .pd{ grid-column:1/-1; font-size:.76rem; line-height:1.5; color:rgba(var(--dk2),.66); }
.plan .tag{ position:absolute; top:-9px; right:14px; font-family:var(--f-mono); font-size:9px;
  letter-spacing:.18em; padding:2px 8px; border-radius:999px; color:#1a1205;
  background:rgba(var(--yellow),.95); }
.cta{ display:inline-flex; align-items:center; gap:8px; margin-top:18px;
  font-family:var(--f-body); font-size:.9rem; font-weight:600; letter-spacing:.04em;
  color:rgba(var(--dk),.95); text-decoration:none; }
.cta .ar{ font-family:var(--f-mono); transition:transform .3s var(--ease); }
.cta:hover{ color:rgb(var(--teal)); }
.cta:hover .ar{ transform:translateX(5px); }
.priceline{ font-family:var(--f-mono); font-size:.82rem; color:rgba(160,110,30,.95);
  letter-spacing:.04em; margin-top:18px; }

.hint{position:relative;z-index:1;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;
  color:rgba(var(--stellar),.42);text-align:center;}

/* ─── 手機：垂直堆疊 ─── */
@media(max-width:820px){
  body{overflow:auto;align-items:stretch}
  .acc{ flex-direction:column; height:auto; aspect-ratio:auto; gap:10px; }
  .panel{ flex:0 0 auto; min-height:62px; }
  .panel.open{ min-height:auto; }
  .spine{ flex-direction:row; padding:0 20px; height:62px; justify-content:flex-start; gap:16px; }
  .spine .v,.spine .ven{ writing-mode:horizontal-tb; }
  .spine .ven{ border-left:none; padding-left:0; }
  .spine .num{ position:static; font-size:1.1rem; }
  .body{ position:relative; inset:auto; min-height:520px; }
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>
<body data-art="a">
<div class="toolbar">
  <span class="tb-note">AI 形象網紅 · 光粒聚合／碎屏破框 · 非正式</span>
  <button class="tb on" data-set="a">光粒 1<small>静謐</small></button>
  <button class="tb" data-set="b">光粒 2<small>動感</small></button>
  <button class="tb" data-set="e">光粒 3<small>正面破屏</small></button>
  <button class="tb" data-set="f">光粒 4<small>人／資料對半</small></button>
  <button class="tb" data-set="c">碎屏 1<small>Shatter</small></button>
  <button class="tb" data-set="d">碎屏 2<small>Shatter</small></button>
</div>

<div class="acc" id="acc"></div>
<p class="hint">點任一卡片展開 · 收合態維持深黑月面碑刻 · 上方切換展開後的白色系背景（A／B／C）</p>

<script>
const DATA=[
  {
    n:'01', cjk:'社群經營', en:'SOCIAL', echo:'Your brand, always on.',
    lead:'不只是代發文。策略、內容、發布、互動、數據——一條龍的社群系統，把帳號養成會自己長大的品牌資產。',
    social:true,
    platforms:['LINE','Instagram','Threads','Facebook','TikTok'],
    acts:'<b>海巡漲粉</b> · <b>內容製作</b>（圖文／短影音）· <b>互動經營</b> · <b>數據追蹤</b>',
    plans:[
      {n:'基礎行銷', p:'NT$3,800', u:'／月', d:'4 篇圖文｜排版設計＋市場文案，維持品牌曝光'},
      {n:'成長推廣', p:'NT$8,500', u:'／月', d:'8 篇圖文｜月度數據分析＋經營方向建議', feat:true},
      {n:'整合行銷', p:'NT$21,000', u:'／月', d:'12 篇圖文｜完整數據追蹤＋活動企劃＋全面策略'},
    ],
  },
  {
    n:'02', cjk:'部落格代營運', en:'SEO CONTENT', echo:'Traffic that compounds.',
    lead:'用 16 個 AI 代理、逾 60 道客觀把關的內容產線，幫你長期經營 SEO 部落格——讓搜尋流量自己長進來，而不是丟給 ChatGPT 亂發。',
    price:'依規模規劃 · 訂閱式長期經營',
  },
  {
    n:'03', cjk:'廣告投放', en:'PAID ADS', echo:'Spend that performs.',
    lead:'跨 FB／IG／TikTok 代客操盤，含影片與短影音廣告——從素材企劃、出價優化到成效回報，一手包辦。',
    price:'投放金額 10–25% 抽成',
  },
  {
    n:'04', cjk:'AI 形象網紅', en:'AI TALENT', echo:'A face that never tires.',
    lead:'為品牌打造可長期經營的虛擬代言人——情緒穩定、形象可控、無出鏡包袱。我們的目標只有一個：做到沒有 AI 感。',
    price:'詢價制',
  },
];

const acc=document.getElementById('acc');
DATA.forEach((s,i)=>{
  const p=document.createElement('div');
  p.className='panel';
  p.tabIndex=0; p.setAttribute('role','button');
  p.setAttribute('aria-expanded','false');
  p.setAttribute('aria-label', s.cjk);

  let body='';
  if(s.social){
    body=`
      <div class="head"><span class="kicker">數位行銷 ／ ${s.en}</span><span class="bignum">${s.n}</span></div>
      <div>
        <h3 class="title">${s.cjk}</h3>
        <p class="en">${s.echo}</p>
        <div class="grid">
          <div>
            <p class="lead">${s.lead}</p>
            <div class="meta"><div class="ml">經營平台</div><div class="chips">${s.platforms.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>
            <div class="meta"><div class="ml">日常動作</div><div class="acts">${s.acts}</div></div>
            <a class="cta" href="../contact.html" target="_top">想開始經營 <span class="ar">→</span></a>
          </div>
          <div class="plans">
            ${s.plans.map(pl=>`
              <div class="plan${pl.feat?' feat':''}">
                ${pl.feat?'<span class="tag">推薦</span>':''}
                <span class="pn">${pl.n}</span>
                <span class="pp">${pl.p}<small>${pl.u}</small></span>
                <span class="pd">${pl.d}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>`;
  }else{
    body=`
      <div class="head"><span class="kicker">數位行銷 ／ ${s.en}</span><span class="bignum">${s.n}</span></div>
      <div>
        <h3 class="title">${s.cjk}</h3>
        <p class="en">${s.echo}</p>
        <p class="lead">${s.lead}</p>
        <p class="priceline">${s.price}</p>
        <a class="cta" href="../contact.html" target="_top">想了解更多 <span class="ar">→</span></a>
      </div>`;
  }

  const bg = `<div class="bgimg" style="background-image:url('../_imgtest/mural-h.png'); background-size:400% 100%; background-position:${(i/3*100).toFixed(2)}% center;"></div>`;
  p.innerHTML=`${bg}
    <div class="spine"><span class="num">${s.n}</span><div class="spine__cols"><span class="v">${s.cjk}</span><span class="ven">${s.en}</span></div></div>
    <div class="body"><div class="bgart"></div>${body}</div>`;
  acc.appendChild(p);
});

const panels=[...document.querySelectorAll('.panel')];
function open(idx){
  panels.forEach((p,i)=>{ const on=i===idx; p.classList.toggle('open',on); p.setAttribute('aria-expanded',on?'true':'false'); });
}
function toggle(p,i){
  if(p.classList.contains('open')){ p.classList.remove('open'); p.setAttribute('aria-expanded','false'); }
  else { open(i); }
}
panels.forEach((p,i)=>{
  p.addEventListener('click',()=>toggle(p,i));
  p.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(p,i); } });
});

// 版本切換
const tbs=[...document.querySelectorAll('.tb')];
tbs.forEach(b=>b.addEventListener('click',()=>{
  document.body.dataset.art=b.dataset.set;
  tbs.forEach(x=>x.classList.toggle('on',x===b));
  if(!panels.some(p=>p.classList.contains('open'))) open(0);
}));

// 預設展開「AI 形象網紅」這張卡（index 3）
open(3);
</script>
</body>
</html>
