<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空人 ScrollTrigger 偵序列測試</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #e8f0ff;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 簡單星空背景模擬 */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(0, 200, 255, 0.05), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(23, 54, 245, 0.05), transparent 40%),
                #000;
            pointer-events: none;
            z-index: -1;
        }

        /* 載入畫面 */
        .loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
            gap: 1rem;
        }
        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-text {
            font-size: 0.875rem;
            letter-spacing: 0.2em;
            color: rgba(0, 200, 255, 0.85);
            text-transform: uppercase;
        }
        .loader-progress {
            width: 240px;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .loader-bar {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 200, 255, 0.85), transparent);
            width: 0%;
            transition: width 0.2s;
            box-shadow: 0 0 8px rgba(0, 200, 255, 0.5);
        }
        .loader-count {
            font-size: 0.75rem;
            color: rgba(232, 240, 255, 0.45);
            letter-spacing: 0.15em;
        }

        /* 滾動容器 */
        .scroll-container {
            height: 500vh;
            position: relative;
        }

        /* sticky canvas 容器 */
        .canvas-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            max-width: 80vmin;
            max-height: 80vmin;
        }

        /* 資訊面板 */
        .info {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 200, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 8px;
            z-index: 100;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            line-height: 2;
        }
        .info-label {
            color: rgba(255, 199, 9, 0.85);
            text-transform: uppercase;
            font-size: 0.65rem;
        }
        .info-value {
            color: var(--c-stellar, #e8f0ff);
            font-size: 0.875rem;
        }

        /* 提示往下捲 */
        .scroll-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: rgba(232, 240, 255, 0.4);
            text-transform: uppercase;
            animation: pulse 2s infinite;
            z-index: 100;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.85; }
        }

        /* 起始 / 結束區段 */
        .intro,
        .outro {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 2rem;
        }
        .intro h1,
        .outro h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 400;
            color: rgba(232, 240, 255, 0.85);
            letter-spacing: 0.05em;
        }
        .outro p {
            margin-top: 1rem;
            color: rgba(232, 240, 255, 0.5);
            font-size: 0.875rem;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <!-- 載入畫面 -->
    <div class="loader" id="loader">
        <div class="loader-text">PRELOADING FRAMES</div>
        <div class="loader-progress">
            <div class="loader-bar" id="loaderBar"></div>
        </div>
        <div class="loader-count" id="loaderCount">0 / 72</div>
    </div>

    <!-- 資訊面板 -->
    <div class="info">
        <div><span class="info-label">PROGRESS:</span> <span class="info-value" id="progress">0%</span></div>
        <div><span class="info-label">FRAME:</span> <span class="info-value" id="frame">1</span> / 72</div>
        <div><span class="info-label">FPS:</span> <span class="info-value" id="fps">—</span></div>
    </div>

    <div class="scroll-hint" id="scrollHint">↓ SCROLL TO ANIMATE ↓</div>

    <!-- 滾動結構 -->
    <div class="intro">
        <h1>太空人 ScrollTrigger 偵序列測試<br><span style="font-size: 0.7em; opacity: 0.5;">scroll down to start</span></h1>
    </div>

    <div class="scroll-container">
        <div class="canvas-wrapper">
            <canvas id="canvas" width="1440" height="1440"></canvas>
        </div>
    </div>

    <div class="outro">
        <div>
            <h1>END OF SEQUENCE</h1>
            <p>慢速捲動測試卡頓 / 快速捲動測試流暢度</p>
        </div>
    </div>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const TOTAL_FRAMES = 72;
        const FRAME_PATH = (i) => `assets/images/astronaut/clips/beat02-frames-raw/frame_${String(i).padStart(3, '0')}.png`;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const images = [];
        let loadedCount = 0;

        const loaderEl = document.getElementById('loader');
        const loaderBar = document.getElementById('loaderBar');
        const loaderCount = document.getElementById('loaderCount');
        const progressEl = document.getElementById('progress');
        const frameEl = document.getElementById('frame');
        const fpsEl = document.getElementById('fps');

        // 預載全部偵
        for (let i = 1; i <= TOTAL_FRAMES; i++) {
            const img = new Image();
            img.src = FRAME_PATH(i);
            img.onload = () => {
                loadedCount++;
                const pct = (loadedCount / TOTAL_FRAMES) * 100;
                loaderBar.style.width = pct + '%';
                loaderCount.textContent = `${loadedCount} / ${TOTAL_FRAMES}`;
                if (loadedCount === TOTAL_FRAMES) {
                    setTimeout(() => {
                        loaderEl.classList.add('hidden');
                        init();
                    }, 300);
                }
            };
            img.onerror = () => {
                console.error('Failed to load frame', i, img.src);
                loadedCount++;
                if (loadedCount === TOTAL_FRAMES) init();
            };
            images[i - 1] = img;
        }

        // 渲染當前偵到 canvas
        const sequence = { frame: 0 };
        function render() {
            const idx = Math.max(0, Math.min(TOTAL_FRAMES - 1, Math.round(sequence.frame)));
            const img = images[idx];
            if (img && img.complete) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                frameEl.textContent = idx + 1;
            }
        }

        // FPS 監測
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;
        function tick() {
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = frameCount;
                fpsEl.textContent = fps;
                frameCount = 0;
                lastTime = now;
            }
            requestAnimationFrame(tick);
        }
        tick();

        function init() {
            render(); // 初始偵

            gsap.to(sequence, {
                frame: TOTAL_FRAMES - 1,
                ease: 'none',
                scrollTrigger: {
                    trigger: '.scroll-container',
                    start: 'top top',
                    end: 'bottom bottom',
                    scrub: 0.5, // 平滑插值
                    onUpdate: (self) => {
                        progressEl.textContent = (self.progress * 100).toFixed(1) + '%';
                    }
                },
                onUpdate: render
            });
        }
    </script>
</body>
</html>
