<style>

*{box-sizing:border-box}

.gets b{display:block}
.gets span{color:var(--muted);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 18px;font-weight:700;font-size:17px;background:var(--accent);color:var(--on-accent);text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line);font-weight:500;margin-top:10px}

.progress{height:4px;background:var(--sand);border-radius:4px;margin:0 0 22px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.step-no{font-size:14px;color:var(--muted);margin-bottom:6px}
.hint{color:var(--muted);font-size:14px;margin:8px 0 18px}

.nav{display:flex;gap:10px}
.nav .btn{flex:1}
.nav .back{flex:0 0 auto;width:auto;padding-inline:20px;background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-bottom:16px}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}

.dots{display:flex;gap:6px;margin:12px 0 2px}

.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;background:var(--miss-soft);color:var(--miss);margin-bottom:6px}
.item h3{margin-bottom:6px}
.you{font-size:14px;color:var(--muted);margin-bottom:6px}
.you b{color:var(--ink);font-weight:500}
.lbl{font-size:13px;color:var(--muted);margin-top:10px}

.demo{display:block;margin-top:10px}
.cta p{color:var(--muted);font-size:15px;margin:6px 0 14px}
.code{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}

.foot{margin-top:40px;text-align:center;font-size:13px;color:var(--muted)}
.foot a{color:var(--muted)}
.copied{color:var(--accent-ink);font-size:14px;text-align:center;margin-top:8px;min-height:1.4em}

<script>

var BOOKING = {svc:"預約系統", backing:"demo"};

/* 七個情境題：right 是我們認為對的方向；每題答錯就是一個「錢可能沒花對」的地方 */
var QUIZ = [
  {id:"post", short:"發文方向", stage:"reach", q:"發文發了一個月，沒什麼人看。你第一個會做什麼？",
    opts:[{id:"a", t:"發得更勤，一天多發幾則"},{id:"b", t:"花錢下廣告，把貼文推出去"},{id:"c", t:"先看最近有誰在問你這行的問題，照那個題目寫", right:true}],
    title:"錢花在放大一個沒人要看的東西",

  {id:"msgs", short:"回訊息太慢", stage:"catch", q:"客人私訊問「這週還有空嗎」，你手上正在忙。你會怎麼處理？",

    title:"廣告帶來的人，沒地方接",

    diy:"先確定廣告點進來的人會落在哪：LINE 官方帳號或網站。還沒有的話，先別投",
    svc:"", backing:"none"},
  {id:"vendor", short:"找代操怎麼比", stage:"reach", q:"要付錢請小編或代操之前，你最先比的是什麼？",
    opts:[{id:"a", t:"一個月發幾則"},{id:"b", t:"誰的報價比較低"},{id:"c", t:"帳號、客人名單、做出來的東西，不做了在誰手上", right:true}],
    title:"不做了，錢買到的東西帶不走",

var QUESTIONS = {
  "catch":[
    {q:"客人的名單跟預約紀錄是我的還是你們的？不做了能不能整份帶走？"},
    {q:"LINE 官方帳號的推播訊息費是誰付？一個月大概會多少？"},

  face:[

  reach:[

  ]

var EXAMPLE = {answers:{post:"b", msgs:"a", ads:"a", vendor:"c", noshow:"a", metric:"b", site:"c"}, industry:"nails"};

function fresh(){ return {answers:{}, industry:""}; }
function byId(list, id){ for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; } return null; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function app(){ return document.getElementById("app"); }
function top(t){ document.getElementById("topRight").textContent = t || ""; }

function code(){
  if(state._code) return state._code;
  var d = new Date();
  var mm = ("0"+(d.getMonth()+1)).slice(-2), dd = ("0"+d.getDate()).slice(-2);
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = "";
  for(var i=0;i<3;i++) r += chars.charAt(Math.floor(Math.random()*chars.length));
  state._code = "ND"+mm+dd+"-"+r;
  return state._code;
}

function source(){
  try{ var p = new URLSearchParams(location.search); return p.get("utm_source") || p.get("src") || ""; }catch(e){ return ""; }
}

function misses(){
  var list = QUIZ.filter(function(q){ var o = byId(q.opts, state.answers[q.id]); return o && !o.right; });
  list.sort(function(a,b){ return STAGES[a.stage].order - STAGES[b.stage].order; });
  return list;
}
function rights(){ return QUIZ.filter(function(q){ var o = byId(q.opts, state.answers[q.id]); return o && o.right; }); }

function li(n,b,s){ return '<li><span class="n">'+n+'</span><div><b>'+b+'</b><span>'+s+'</span></div></li>'; }

/* ---------- 題目 ---------- */
function optBtn(id,label,pressed){
  return '<button class="opt" data-id="'+esc(id)+'" aria-pressed="'+(pressed?"true":"false")+'">'+esc(label)+'</button>';

function renderStep(){
  top(step+" / "+TOTAL);
  var h = '<div class="progress"><i style="width:'+Math.round(step/TOTAL*100)+'%"></i></div>';
  var ok = false;
  if(step<=QUIZ.length){
    var q = QUIZ[step-1];
    h += '<div class="step-no">第 '+step+' 題</div><h2>'+esc(q.q)+'</h2><p class="hint">選你真的會做的，不是你覺得對的</p><div class="opts">';
    q.opts.forEach(function(o){ h += optBtn(o.id,o.t,state.answers[q.id]===o.id); });
    h += '</div>'; ok = !!state.answers[q.id];
  }else{
    h += '<div class="step-no">最後一題</div><h2>你是做哪一行的</h2><p class="hint">用來挑給你看的示範，挑最接近的就好</p><div class="opts two">';
    INDUSTRIES.forEach(function(o){ h += optBtn(o.id,o.label,state.industry===o.id); });
    h += '</div>'; ok = !!state.industry;
  }
  h += '<div class="nav"><button class="btn back" id="back">上一步</button><button class="btn" id="next"'+(ok?'':' disabled')+'>'+(step===TOTAL?'看結果':'下一題')+'</button></div>';
  app().innerHTML = h;

  Array.prototype.forEach.call(app().querySelectorAll(".opt"), function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-id");
      if(step<=QUIZ.length) state.answers[QUIZ[step-1].id] = id;
      else state.industry = id;
      renderStep();
    };
  });
  document.getElementById("back").onclick = function(){ if(step===1){ renderIntro(); } else { step--; renderStep(); } };
  document.getElementById("next").onclick = function(){ if(step===TOTAL){ renderResult(); } else { step++; renderStep(); } };
  window.scrollTo(0,0);
}

/* ---------- 結果 ---------- */
function verdict(n){
  if(n===0) return "你很清楚錢該花在哪。下面是給你留著用的檢查題";
  if(n<=2) return "大方向是對的，有幾個地方在漏";
  if(n<=4) return "有好幾個地方，錢很可能花了沒換到東西";
  return "錢很可能花在看不到回報的地方，先從最上面那一項改";
}

function renderResult(){
  top("");
  var ind = byId(INDUSTRIES, state.industry) || {label:"",demo:""};
  var miss = misses();
  var n = miss.length;
  var stagesOn = {};
  miss.forEach(function(q){ stagesOn[q.stage] = true; });

  var h = '';
  if(isExample) h += '<div class="example-banner">這是範例：一位一個人顧店的美甲師，假想的答案</div>';

  /* 分數 */
  h += '<section class="card score'+(n===0?' clean':'')+'"><div class="k">七題裡</div>'+
    '<div class="big">'+(n===0 ? '<em>沒有</em>地方漏' : '有 <em>'+n+'</em> 個地方<br>錢可能沒花對')+'</div><p>'+verdict(n)+'</p>'+
    '<div class="dots">'+QUIZ.map(function(q){ var o = byId(q.opts,state.answers[q.id]); return '<span class="'+(o&&o.right?'':'miss')+'"></span>'; }).join("")+'</div>';
  if(n>0){
    h += '<div class="k" style="margin-top:14px">建議照這個順序改</div><ol class="order">'+
      miss.map(function(q){ return '<li><b>'+esc(q.short)+'</b></li>'; }).join("")+
    '</ol><p class="note">先把來問的人留住、讓人查得到你，再花錢帶人進來，錢才不會白花</p>';
  }
  if(state.answers.ads && !byId(byId(QUIZ,"ads").opts,state.answers.ads).right && (stagesOn["catch"] || stagesOn.face)){
    h += '<div class="warn">來問的客人還會漏掉、或客人還查不到你，這時候下廣告，帶進來的人多半會流掉。先改前面的，再考慮投</div>';
  }
  h += '</section>';

  /* 整理單 */
  h += '<section class="card"><div class="sheet-head"><span>我的行銷整理單</span><span>'+code()+'</span></div><dl class="rows">'+
    row("行業", ind.label)+
    row("答對", (QUIZ.length-n)+" / "+QUIZ.length)+
    row("在漏的", miss.map(function(q){ return q.short; }).join("、") || "沒有")+
    row("先改", miss[0] ? STAGES[miss[0].stage].label : "")+
  '</dl></section>';

  /* 每個漏的地方 */
  if(n>0){
    h += '<section class="card"><h2 style="margin-bottom:6px">錢可能漏在這裡</h2>';
    var shownSvc = {};
    miss.forEach(function(q){
      var mine = byId(q.opts, state.answers[q.id]);
      var right = q.opts.filter(function(o){ return o.right; })[0];
      h += '<div class="item"><h3>'+esc(q.title)+'</h3>'+
        '<div class="you">你選了<b>「'+esc(mine.t)+'」</b>，比較好的做法是<b>「'+esc(right.t)+'」</b></div>'+
        '<div class="lbl">為什麼錢會白花</div><p>'+esc(q.why)+'</p>'+
        '<div class="lbl">今天自己就能改的</div><p>'+esc(q.diy)+'</p>';
      if(q.backing!=="none" && shownSvc[q.svc]){
        h += '<div class="lbl">這一項跟上面是同一件事：'+esc(q.svc)+'</div>';
      }else if(q.backing!=="none"){
        shownSvc[q.svc] = true;
        h += '<div class="lbl">'+(q.backing==='case'?'我們做過的：':(q.backing==='demo'?'看示範：':'我們的做法：'))+esc(q.svc)+'</div>';
        if(q.backing==="case"){
          q.cases.forEach(function(k){
            h += '<div class="case">'+esc(k.text)+'<span class="src">'+esc(k.src)+'</span></div>';
            if(k.honest) h += '<div class="case">'+esc(k.honest)+'</div>';
          });
        }else if(q.backing==="feature"){
          h += '<div class="case">'+esc(q.feature)+'<span class="src">'+esc(q.fact)+'</span></div>';
        }else if(q.backing==="demo"){
          h += '<div class="case">客人從 LINE 點進去自己挑時段，被約走的直接選不到，你的手機同時收到新單。'+
            (ind.demo ? '這頁往下有'+esc(ind.label)+'的示範可以點（示範頁，不是真的店）' : '我們做了十種產業的示範，LINE 跟我說你是哪一行，我傳最接近的給你')+'</div>';
        }
        
      }
      h += '</div>';
    });
    h += '<a class="btn" style="margin-top:14px" href="'+lineHref()+'" target="_blank" rel="noopener">這幾個地方想聊聊，用 LINE 傳給吉米</a>';
    h += '</section>';
  }

  var r = rights();
  if(r.length){
    h += '<section class="card"><h2>這幾題你是對的</h2><ul class="rights">'+
      r.map(function(q){ var o = byId(q.opts,state.answers[q.id]); return '<li>'+esc(o.t)+'</li>'; }).join("")+'</ul></section>';
  }

  /* 示範 */
  if(ind.demo){
    h += '<section class="card"><h2>你那一行的預約示範</h2><p class="note">'+esc(ind.label)+'的版本，用客人的角度點一次，看你那邊會收到什麼</p>'+
      '<a class="btn ghost demo" href="'+BASE+'/services/booking-demos/line-'+ind.demo+'.html" target="_blank" rel="noopener">打開'+esc(ind.label)+'的示範</a></section>';
  }

  /* 問題清單 */
  var qs = [], seen = {};
  var src = n ? miss : QUIZ;
  src.forEach(function(q){
    if(seen[q.stage]) return; seen[q.stage] = true;
    QUESTIONS[q.stage].forEach(function(item){
      if(item.only){
        var oq = byId(QUIZ,item.only); var oa = oq && byId(oq.opts,state.answers[oq.id]);
        if(n && !(oa && !oa.right)) return;
        qs.push({q:item.q, why:n ? "你在「"+oq.title+"」這題漏了" : "留著用"});
      }else{
        qs.push({q:item.q, why:n ? "你在「"+STAGES[q.stage].label+"」這一段有漏" : "留著用"});
      }
    });
  });
  QUESTIONS.general.forEach(function(item){ qs.push({q:item.q, why:"每家都可以問"}); });
  h += '<section class="card"><h2>找任何行銷公司前，可以先問這幾題</h2><p class="note" style="margin-bottom:12px">不管找不找我們都用得到，見面時照著問，問完打勾</p><ul class="qs">'+
    qs.map(function(q,i){ return '<li><input type="checkbox" id="q'+i+'"><label for="q'+i+'">'+esc(q.q)+'<small>'+esc(q.why)+'</small></label></li>'; }).join("")+
  '</ul></section>';

  /* 收口 */
  var text = summaryText();
  h += '<section class="card cta"><h2>想知道你的店怎麼改</h2><p>按下去會開 LINE，整理單的重點已經幫你打好了。你看過再送出，吉米看完你的狀況再回你，不用從頭講一遍</p>'+
    '<a class="btn" href="'+lineHref()+'" target="_blank" rel="noopener">用 LINE 把整理單傳給吉米</a>'+
    '<button class="btn ghost" id="copy">複製整理單文字</button><div class="copied" id="copied"></div>'+
    '<p class="code">代碼 '+code()+'　也可以直接截圖上面那張整理單<br>只想先加好友的話，LINE 搜尋 '+LINE_ID+'</p></section>';

  h += '<button class="btn ghost" id="again">重新測一次</button>';
  app().innerHTML = h;

  document.getElementById("copy").onclick = function(){
    var done = function(){ document.getElementById("copied").textContent = "複製好了"; };
    function fallback(){
      var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
      try{ document.execCommand("copy"); done(); }catch(e){}
      document.body.removeChild(t);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, fallback); }
    else fallback();
  };
  document.getElementById("again").onclick = function(){ state = fresh(); isExample = false; renderIntro(); };
  window.scrollTo(0,0);
}

function lineHref(){ return "https://line.me/R/oaMessage/"+LINE_ID+"/?"+encodeURIComponent(summaryText()); }

function row(k,v){ return v ? '<dt>'+k+'</dt><dd>'+esc(v)+'</dd>' : ''; }

function summaryText(){
  var ind = byId(INDUSTRIES, state.industry) || {label:""};
  var miss = misses();
  var lines = [
    "你好，我測了「行銷錢有沒有花對」",
    "代碼："+code(),
    "行業："+ind.label,
    "答對："+(QUIZ.length-miss.length)+" / "+QUIZ.length,
    "在漏的："+(miss.map(function(q){ return q.short; }).join("、") || "沒有"),
    "想先聊："+(miss[0] ? STAGES[miss[0].stage].label : "整體看看")
  ];
  var s = source(); if(s) lines.push("從哪裡來："+s);
  if(isExample) lines.unshift("（這是範例）");
  return lines.join("\n");
}

renderIntro();
})();
</script>
</body>
</html>
