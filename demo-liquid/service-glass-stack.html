function getLightPosition(spec){
  const az=THREE.MathUtils.degToRad(((state[spec.id+'_azimuth']%360)+360)%360);
  const el=THREE.MathUtils.degToRad(state[spec.id+'_elevation']);
  const distance=state[spec.id+'_distance'];
  const horizontal=Math.cos(el)*distance;
  return {
    x:Math.sin(az)*horizontal,
    y:Math.sin(el)*distance,
    z:Math.cos(az)*horizontal
  };
}

const pmremGenerator=new THREE.PMREMGenerator(renderer);
let studioEnvRT=null;
function makeStudioEnvMap(){
  const envCanvas=document.createElement('canvas');
  envCanvas.width=1024;
  envCanvas.height=512;
  const ctx=envCanvas.getContext('2d');
  const base=ctx.createLinearGradient(0,0,0,512);
  base.addColorStop(0,'#071331');
  base.addColorStop(0.45,'#050d2e');
  base.addColorStop(1,'#01030b');
  ctx.fillStyle=base;
  ctx.fillRect(0,0,1024,512);

  ctx.globalCompositeOperation='screen';
  for(const spec of LIGHTS){
    const pos=getLightPosition(spec);
    const size=THREE.MathUtils.clamp(spec.size,0.55,4.2);
    const strength=THREE.MathUtils.clamp(state[spec.id+'_intensity']/180,0,1);
    const x=512+pos.x*82;
    const y=260-pos.y*86+pos.z*-14;
    const w=120+size*92;
    const h=70+size*48;
    const radius=Math.max(w,h)*0.95;
    const cg=ctx.createRadialGradient(x,y,0,x,y,radius);
    cg.addColorStop(0,'rgba(255,255,255,'+(0.018+strength*0.055)+')');
    cg.addColorStop(0.34,'rgba(232,244,255,'+(0.012+strength*0.038)+')');
    cg.addColorStop(0.72,'rgba(120,190,255,'+(strength*0.018)+')');
    cg.addColorStop(1,'rgba(0,200,255,0)');
    ctx.fillStyle=cg;
    ctx.fillRect(x-radius,y-radius,radius*2,radius*2);

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(spec.id==='rim' ? -0.1 : spec.id==='back' ? 0.16 : 0);
    ctx.scale(1, h/w);
    const soft=ctx.createRadialGradient(0,0,0,0,0,w*0.54);
    soft.addColorStop(0,'rgba(255,255,255,'+(0.016+strength*0.050)+')');
    soft.addColorStop(0.30,'rgba(232,244,255,'+(0.011+strength*0.034)+')');
    soft.addColorStop(0.68,'rgba(120,190,255,'+(strength*0.014)+')');
    soft.addColorStop(1,'rgba(0,200,255,0)');
    ctx.fillStyle=soft;
    ctx.beginPath();
    ctx.arc(0,0,w*0.54,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation='source-over';

  const envTex=new THREE.CanvasTexture(envCanvas);
  envTex.mapping=THREE.EquirectangularReflectionMapping;
  envTex.colorSpace=THREE.SRGBColorSpace;
  if(studioEnvRT) studioEnvRT.dispose();
  studioEnvRT=pmremGenerator.fromEquirectangular(envTex);
  envTex.dispose();
  return studioEnvRT.texture;
}

function rebuildGlassGeometry(){
  const rect=htmlCard.getBoundingClientRect();
  if(!rect.width || !rect.height || !viewH) return;
  const cameraDist=Math.abs(camera.position.z-glassGroup.position.z);
  const fovRad=THREE.MathUtils.degToRad(camera.fov);
  const unitsPerPx=(2*cameraDist*Math.tan(fovRad/2))/viewH;
  const w=rect.width*unitsPerPx;
  const h=rect.height*unitsPerPx;
  const r=GLASS_BEVEL_PX*unitsPerPx;
  const d=112*unitsPerPx;
  const edgePad=3*unitsPerPx;
  const nextGlassGeo=smoothRoundedBoxGeometry(w, h, d, GLASS_BEVEL_SEGMENTS, r);
  const nextEdgeGeo=smoothRoundedBoxGeometry(w+edgePad, h+edgePad, d+(2*unitsPerPx), GLASS_BEVEL_SEGMENTS, r+unitsPerPx*1.2);
  const nextFresnelGeo=smoothRoundedBoxGeometry(w+edgePad*0.55, h+edgePad*0.55, d+(unitsPerPx*1.5), GLASS_BEVEL_SEGMENTS, r+unitsPerPx*0.9);
  fresnelMat.uniforms.uHalfSize.value.set((w+edgePad*0.55)*0.5,(h+edgePad*0.55)*0.5);
  rebuildHighlightLayer(w,h,r,d,unitsPerPx);

  glass.geometry.dispose();
  edgeGlow.geometry.dispose();
  fresnelShell.geometry.dispose();
  glass.geometry=nextGlassGeo;
  edgeGlow.geometry=nextEdgeGeo;
  fresnelShell.geometry=nextFresnelGeo;
  glassGeo=nextGlassGeo;
  edgeGeo=nextEdgeGeo;
  fresnelGeo=nextFresnelGeo;
  for(let i=1;i<glassCards.length;i++){
    const card=glassCards[i];
    const layer=i;
    const rearPad=edgePad*(1.3+layer*0.18);
    const rearDepth=d*(0.86-layer*0.06);
    const rearGlassGeo=smoothRoundedBoxGeometry(w, h, rearDepth, GLASS_BEVEL_SEGMENTS, r);
    const rearEdgeGeo=smoothRoundedBoxGeometry(w+rearPad, h+rearPad, rearDepth+(2*unitsPerPx), GLASS_BEVEL_SEGMENTS, r+unitsPerPx*1.4);
    const rearFresnelGeo=smoothRoundedBoxGeometry(w+rearPad*0.6, h+rearPad*0.6, rearDepth+(unitsPerPx*1.5), GLASS_BEVEL_SEGMENTS, r+unitsPerPx);
    card.body.geometry.dispose();
    card.edgeGlow.geometry.dispose();
    card.fresnelShell.geometry.dispose();
    card.depthPool.geometry.dispose();
    card.body.geometry=rearGlassGeo;
    card.edgeGlow.geometry=rearEdgeGeo;
    card.fresnelShell.geometry=rearFresnelGeo;
    card.depthPool.geometry=new THREE.PlaneGeometry(w*0.94,h*0.90,1,1);
    card.depthPool.position.set(0,0,rearDepth/2+unitsPerPx*2.8);
    card.fresnelShell.material.uniforms.uHalfSize.value.set((w+rearPad*0.6)*0.5,(h+rearPad*0.6)*0.5);
  }
}

    const rawLeft=rcPx.left*sx, rawTop=rcPx.top*sy, rawRight=rcPx.right*sx, rawBottom=rcPx.bottom*sy;
    const safeInsetX=Math.max(34*sx,rcPx.width*sx*.075);
    const safeInsetTop=Math.max(34*sy,rcPx.height*sy*.085);
    const safeInsetBottom=Math.max(28*sy,rcPx.height*sy*.065);
    const safeLeft=rawLeft+safeInsetX;
    const safeTop=rawTop+safeInsetTop;
    const safeRight=rawRight-safeInsetX*1.18;
    const safeBottom=rawBottom-safeInsetBottom;
    const safeW=safeRight-safeLeft;
    const safeH=safeBottom-safeTop;
    if(safeW>0 && safeH>0){
      ctx.beginPath();
      if(ctx.roundRect){
        ctx.roundRect(safeLeft,safeTop,safeW,safeH,Math.max(18*sx,22));
      }else{
        ctx.rect(safeLeft,safeTop,safeW,safeH);
      }
      ctx.clip();

      const left=safeLeft, top=safeTop, right=safeRight, bottom=safeBottom;
      const organicCode=[
        'const view = render(glass)',
        'shader.uniforms.ior',
        'await deploy(site)',
        'return <ServiceCard />',
        'route.post("/lead")',
        'cms.render(page)',
        'build: production',
        'db.sync(client)'
      ];
      ctx.font=Math.max(9,10.5*sx)+'px "JetBrains Mono",monospace';
      ctx.textAlign='left';
      ctx.textBaseline='middle';
      for(let i=0;i<24;i++){
        const px=left+safeW*(0.08+hash(i,31)*0.84);
        const py=top+safeH*(0.08+hash(i,47)*0.84);
        const len=0.45+hash(i,59)*0.55;
        const alpha=(0.13+hash(i,71)*0.16)*STAR_RAIN_GLOW;
        const cyan=hash(i,83)>0.58;
        ctx.save();
        ctx.translate(px,py);
        ctx.rotate((-0.14+hash(i,97)*0.28));
        ctx.fillStyle=cyan?'rgba(0,200,255,'+alpha+')':'rgba(232,240,255,'+alpha+')';
        ctx.fillText(organicCode[(i*3)%organicCode.length].slice(0,Math.floor(10+len*16)),0,0);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  ctx.save();
  ctx.scale(sx, sy);
  ctx.textBaseline='middle';
  const rc=cardRect;
  for(let i=0;i<drops.length;i++){
    const d=drops[i];
    const raw=time*d.spd+d.ph;
    const cyc=Math.floor(raw/1.8);
    const prog=raw%1.8-0.25;
    if(prog<0) continue;
    const code=CODE[(i*5+cyc)%CODE.length];
    ctx.font=d.sz+'px "JetBrains Mono",monospace';
    const w=ctx.measureText(code).width;
    const x=16+Math.floor(hash(i,cyc*9+5)*(viewW-32));
    const tipY=prog*viewH;
    const inside=x>=rc.left && x<=rc.right && tipY>=rc.top && tipY<=rc.bottom;
    const base=d.ye?'232,240,255':(d.cy || inside?'0,200,255':'150,170,220');
    const topEdgeFade=inside ? smoothstep(0, 54, tipY-rc.top) : 1;
    ctx.save();
    ctx.translate(x,tipY);
    ctx.rotate(-Math.PI/2);
    ctx.textAlign='left';
    const g=ctx.createLinearGradient(0,0,w,0);
    const hotAlpha=Math.min(1,(inside?0.98:0.92)+0.08*STAR_RAIN_GLOW)*topEdgeFade;
    const trailAlpha=Math.min(1,(inside?0.95:0.86)+0.12*STAR_RAIN_GLOW)*topEdgeFade;
    g.addColorStop(0,'rgba(232,240,255,'+hotAlpha+')');
    g.addColorStop(0.1,'rgba('+base+','+trailAlpha+')');
    g.addColorStop(1,'rgba('+base+',0)');
    ctx.fillStyle=g;
    ctx.fillText(code,0,0);
    ctx.restore();
  }
  ctx.restore();
  starTexture.needsUpdate=true;
}

function applyGlassCardMaterial(card, idx, frontWeight, visible, rearDepth){
  const layer=Math.max(0, idx);
  const layerFade=Math.max(0, layer-1);
  const rearFaceTrim=THREE.MathUtils.clamp(STACK.rearDim, 0, 0.18);
  const rearTransmission=THREE.MathUtils.clamp(STACK.rearTransmission - layerFade*0.06, 0.08, 0.32);
  const rearFaceEnv=THREE.MathUtils.clamp(0.60 - layerFade*0.16 - rearFaceTrim*0.18, 0.38, 0.64);
  const rearRimEnv=THREE.MathUtils.clamp(1.30 - Math.max(0, layer-1)*0.32, 0.85, 1.30);
  const rearRimBase=THREE.MathUtils.clamp(0.19 - Math.max(0, layer-1)*0.05, 0.11, 0.19);
  const rearFresnelBase=THREE.MathUtils.clamp(0.82 - Math.max(0, layer-1)*0.18, 0.55, 0.82);
  const w=THREE.MathUtils.clamp(frontWeight, 0, 1);
  const rearFaceOpacity=THREE.MathUtils.clamp(0.82 - layerFade*0.10 - rearFaceTrim*0.10, 0.68, 0.86);
  const rearRoughness=THREE.MathUtils.clamp(0.34 + layerFade*0.10, 0.34, 0.52);
  const rearGlow=THREE.MathUtils.clamp(0.07 - layerFade*0.025 - rearFaceTrim*0.04, 0.02, 0.08);

  card.body.material.transmission=THREE.MathUtils.lerp(rearTransmission, state.transmission, w);
  card.body.material.thickness=THREE.MathUtils.lerp(1.42-layerFade*0.12, state.thickness, w);
  card.body.material.ior=THREE.MathUtils.lerp(1.12, state.ior, w);
  card.body.material.roughness=THREE.MathUtils.lerp(rearRoughness, state.roughness, w);
  card.body.material.clearcoat=THREE.MathUtils.lerp(0.74, 0.72, w);
  card.body.material.clearcoatRoughness=THREE.MathUtils.lerp(0.18+layerFade*0.06, 0.08, w);
  card.body.material.envMapIntensity=THREE.MathUtils.lerp(rearFaceEnv, state.envMapIntensity, w);
  card.body.material.opacity=visible*THREE.MathUtils.lerp(rearFaceOpacity, 1, w);
  card.body.material.emissive.set(layerFade>0 ? 0x102a5a : 0x173b78);
  card.body.material.emissiveIntensity=visible*THREE.MathUtils.lerp(rearGlow, 0, w);
  card.body.material.attenuationDistance=THREE.MathUtils.lerp(2.6-layerFade*0.5, 6.5, w);
  card.body.material.needsUpdate=true;

  card.edgeGlow.material.transmission=THREE.MathUtils.lerp(0.18, 0.66, w);
  card.edgeGlow.material.thickness=THREE.MathUtils.lerp(1.18, 1.25, w);
  card.edgeGlow.material.ior=THREE.MathUtils.lerp(1.36, 1.62, w);
  card.edgeGlow.material.roughness=THREE.MathUtils.lerp(0.004, 0.006, w);
  card.edgeGlow.material.clearcoat=1;
  card.edgeGlow.material.clearcoatRoughness=THREE.MathUtils.lerp(0.006, 0.012, w);
  card.edgeGlow.material.envMapIntensity=visible*THREE.MathUtils.lerp(rearRimEnv, state.envMapIntensity*1.45, w);
  card.edgeGlow.material.opacity=visible*THREE.MathUtils.lerp(rearRimBase, 0.14, w);
  card.edgeGlow.material.needsUpdate=true;

  card.fresnelShell.material.uniforms.uPower.value=THREE.MathUtils.lerp(1.45, state.fresnelPower, w);
  card.fresnelShell.material.uniforms.uStrength.value=visible*THREE.MathUtils.lerp(rearFresnelBase, 0.95, w);
  card.fresnelShell.material.uniforms.uCornerBoost.value=THREE.MathUtils.lerp(4.8, 2.4, w);

  if(card.depthPool){
    card.depthPool.material.uniforms.uOpacity.value=visible*THREE.MathUtils.lerp(0.018+layerFade*0.010, 0.055, w);
  }else{
    depthPoolMat.uniforms.uOpacity.value=visible*THREE.MathUtils.lerp(0.018, 0.055, w);
  }
}

function applyState(){
  root.style.setProperty('--tiltX', state.tiltX);
  root.style.setProperty('--tiltY', state.tiltY);
  glassMat.thickness=state.thickness;
  glassMat.ior=state.ior;
  glassMat.roughness=state.roughness;
  glassMat.dispersion=state.dispersion;
  glassMat.transmission=state.transmission;
  glassMat.envMapIntensity=state.envMapIntensity;
  edgeMat.envMapIntensity=state.envMapIntensity*1.45;
  edgeMat.opacity=0.14;
  edgeMat.roughness=0.006;
  edgeMat.clearcoat=1;
  edgeMat.clearcoatRoughness=0.012;
  edgeMat.dispersion=0.62;
  for(const spec of LIGHTS){
    const kit=studioLights[spec.id];
    const pos=getLightPosition(spec);
    const size=Math.max(0.55,spec.size);
    const intensity=state[spec.id+'_intensity'];
    kit.light.position.set(pos.x,pos.y,pos.z);
    kit.light.width=size;
    kit.light.height=size;
    kit.light.intensity=intensity;
    aimAtCard(kit.light);
  }
  bloomPass.strength=state.bloomStrength;
  bloomPass.radius=0.18;
  bloomPass.threshold=0.92;
  fresnelMat.uniforms.uPower.value=state.fresnelPower;
  fresnelMat.uniforms.uStrength.value=0.95;
  fresnelMat.uniforms.uCornerBoost.value=2.4;
  glassMat.needsUpdate=true;
  edgeMat.needsUpdate=true;
  glassGroup.rotation.x=THREE.MathUtils.degToRad(-state.tiltX);
  glassGroup.rotation.y=THREE.MathUtils.degToRad(state.tiltY);
  if(GLASS_BEVEL_PX!==state.bevelPx){ GLASS_BEVEL_PX=state.bevelPx; rebuildGlassGeometry(); }
  dump.textContent=PARAMS.map(p=>p.k+': '+state[p.k]+(p.suf||'')).join('\n')+
    '\n\n'+LIGHTS.map(spec=>spec.name+': azimuth '+state[spec.id+'_azimuth']+'deg, elevation '+state[spec.id+'_elevation']+'deg, distance '+state[spec.id+'_distance']+', intensity '+state[spec.id+'_intensity']).join('\n')+
    '\n\nstack: x '+STACK.xOffset+', y '+STACK.backDrop+', z '+STACK.zSpacing+', scale '+STACK.backScale+', dim '+STACK.rearDim+', rear transmission '+STACK.rearTransmission+', transition '+STACK.transitionStart+'-'+STACK.transitionEnd+
    '\n\nmaterial: 3x MeshPhysicalMaterial slabs\ntexture: CanvasTexture -> rear plane\npost: UnrealBloomPass\nthree: 0.160.0';
  requestSceneRender();
}

/* ===== ???券莎??餌??箏?銝剖亢??雿?銝撐 DOM ?⊿?脣??脤 ===== */
const STACK={ xOffset:0.82, zSpacing:0.88, backDrop:0.46, backScale:0.12, rearDim:0.04, rearTransmission:0.24, transitionStart:0.55, transitionEnd:0.85, fadeEnd:0.90 };
const scrollTrack=document.getElementById('scrollTrack');
scrollTrack.style.height=(100 + (CARDS.length-1)*90)+'vh';   /* 瘥?銝撘菜???+90vh ?脣?銵? */

function layoutStack(){
  const trackH=scrollTrack.offsetHeight;
  const travel=Math.max(1, trackH - window.innerHeight);
  const top=scrollTrack.getBoundingClientRect().top;
  const progress=QA_MODE ? 0 : Math.min(1, Math.max(0, -top/travel));
  const N=CARDS.length;
  const activeFloat=progress*(N-1);
  const segment=Math.min(N-2, Math.max(0, Math.floor(activeFloat)));
  const phase=activeFloat>=N-1 ? 1 : activeFloat-segment;
  const move=smoothstep(STACK.transitionStart, STACK.transitionEnd, phase);
  const fadeOut=1-smoothstep(STACK.transitionStart, STACK.fadeEnd, phase);
  const fadeIn=smoothstep(STACK.transitionStart, STACK.fadeEnd, phase);

  for(let idx=0; idx<cardEls.length; idx++){
    const el=cardEls[idx];
    let textWeight=0;
    let textY=24;
    if(idx===segment) textWeight=fadeOut;
    if(idx===segment) textY=-18*(1-fadeOut);
    if(idx===segment+1){
      textWeight=Math.max(textWeight, fadeIn);
      textY=22*(1-fadeIn);
    }
    if(activeFloat>=N-1 && idx===N-1){ textWeight=1; textY=0; }
    if(QA_MODE && idx===0){ textWeight=1; textY=0; }
    el.style.transform='perspective(1700px) translateY('+textY.toFixed(1)+'px) scale(1) rotateX(calc(var(--tiltX)*1deg)) rotateY(calc(var(--tiltY)*1deg))';
    el.style.opacity=textWeight.toFixed(3);
    el.style.filter='none';
    el.style.zIndex=String(220+Math.round(textWeight*10));
    el.classList.toggle('is-front', textWeight>0.5);
  }

  for(let idx=0; idx<glassCards.length; idx++){
    const card=glassCards[idx];
    const rel=idx-activeFloat;
    let x=0, y=0, z=0, scale=1, frontWeight=0, visible=1;
    if(idx===segment){
      frontWeight=fadeOut;
      x=-STACK.xOffset*0.28*move;
      y=0.30*move;
      z=0.16*move;
      scale=1+0.014*move;
    }else if(idx===segment+1){
      frontWeight=fadeIn;
      x=STACK.xOffset*(1-move);
      y=-STACK.backDrop*(1-move);
      z=-STACK.zSpacing*(1-move);
      scale=1-STACK.backScale*(1-move);
    }else if(rel>0){
      const r=Math.min(rel,2.2);
      x=STACK.xOffset*r;
      y=-STACK.backDrop*r;
      z=-STACK.zSpacing*r;
      scale=1-STACK.backScale*r;
    }else{
      const gone=Math.min(-rel,1.4);
      x=-STACK.xOffset*(0.45+gone*0.20);
      y=0.46+0.42*gone;
      z=0.20+0.10*gone;
      scale=1.02+0.015*gone;
      visible=Math.max(0, 1-gone*1.3);
    }
    if(activeFloat>=N-1 && idx===N-1){
      x=0; y=0; z=0; scale=1; frontWeight=1; visible=1;
    }
    const rearDepth=Math.max(0, Math.min(1, rel));
    const rearVisible=rel>=0 ? 1-rearDepth*0.10 : visible;
    visible=QA_MODE ? 1 : Math.max(frontWeight, rearVisible);
    if(QA_MODE && idx===0) frontWeight=1;
    card.group.position.set(x,y,z);
    card.group.scale.setScalar(Math.max(0.72,scale));
    card.group.rotation.x=THREE.MathUtils.degToRad(-state.tiltX);
    card.group.rotation.y=THREE.MathUtils.degToRad(state.tiltY);
    card.group.visible=visible>0.01;
    applyGlassCardMaterial(card, idx, frontWeight, visible, rearDepth);
  }
  requestSceneRender();
}
let stackTick=false;
window.addEventListener('scroll', ()=>{
  if(!stackTick){ stackTick=true; requestAnimationFrame(()=>{ layoutStack(); stackTick=false; }); }
}, {passive:true});
window.addEventListener('resize', layoutStack);

/* ?????遘嚗?函????蹂?敺? */
const STACK_CTRL=[
  {k:'zSpacing', name:'stack Z gap', min:0.24, max:1.2, step:0.01},
  {k:'backDrop', name:'stack Y offset', min:0.05, max:0.9, step:0.01},
  {k:'backScale', name:'rear scale step', min:0, max:0.18, step:0.005},
  {k:'rearDim', name:'rear body glow trim', min:0, max:0.18, step:0.005},
  {k:'rearTransmission', name:'rear frost transmission', min:0.08, max:0.32, step:0.005},
  {k:'transitionStart', name:'transition start', min:0.35, max:0.7, step:0.01},
  {k:'transitionEnd', name:'transition end', min:0.7, max:0.95, step:0.01},
  {k:'fadeEnd', name:'text fade end', min:0.8, max:1, step:0.01}
];
const stackTitle=document.createElement('h4');
stackTitle.textContent='????';
stackTitle.style.marginTop='20px';
wrap.appendChild(stackTitle);
STACK_CTRL.splice(1,0,{k:'xOffset', name:'stack X offset', min:-1.8, max:1.8, step:0.01});
for(const p of STACK_CTRL){
  const row=document.createElement('div');
  row.className='row';
  row.innerHTML='<label><span>'+p.name+'</span><b id="sv_'+p.k+'">'+STACK[p.k]+(p.suf||'')+'</b></label>'+
    '<input type="range" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+STACK[p.k]+'">';
  const inp=row.querySelector('input');
  inp.oninput=()=>{
    const v=parseFloat(inp.value);
    STACK[p.k]=v;
    if(STACK.transitionEnd<=STACK.transitionStart) STACK.transitionEnd=STACK.transitionStart+0.01;
    if(STACK.fadeEnd<STACK.transitionEnd) STACK.fadeEnd=STACK.transitionEnd;
    document.getElementById('sv_'+p.k).textContent=v+(p.suf||'');
    applyState();
    layoutStack();
  };
  wrap.appendChild(row);
}

resize();
applyState();
layoutStack();

const t0=performance.now();
function loop(now){
  rafId=requestAnimationFrame(loop);
  if(!QA_MODE && document.hidden){
    cancelAnimationFrame(rafId);
    rafId=0;
    return;
  }
  const elapsed=now-lastFrameTime;
  const forceQaFrame=QA_MODE && qaFramesRemaining>0;
  if(elapsed<TARGET_FRAME_MS && !needsRender && !forceQaFrame) return;
  lastFrameTime=now-(elapsed%TARGET_FRAME_MS);
  cardRect=htmlCard.getBoundingClientRect();
  const t=QA_MODE ? 0.75 : (performance.now()-t0)/1000;
  drawStarRain(t);
  composer.render();
  needsRender=false;
  if(forceQaFrame){
    qaFramesRemaining--;
    needsRender=qaFramesRemaining>0;
  }
}
document.addEventListener('visibilitychange',()=>{
  if(!QA_MODE && document.hidden){
    if(rafId){
      cancelAnimationFrame(rafId);
      rafId=0;
    }
  }else{
    lastFrameTime=0;
    requestSceneRender();
  }
});
requestSceneRender();
