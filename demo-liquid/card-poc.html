<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>液態水玻璃卡 POC｜創巢數位</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#05070f; overflow:hidden; font-family:"Microsoft JhengHei","PingFang TC",sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; left:24px; bottom:20px; z-index:10; color:rgba(200,225,255,.55);
    font-size:12px; letter-spacing:.04em; line-height:1.7; pointer-events:none; text-shadow:0 1px 2px #000; }
  .hud b { color:rgba(0,200,255,.9); }
  .panel { position:fixed; right:18px; top:18px; z-index:10; background:rgba(10,16,30,.7);
    border:1px solid rgba(0,200,255,.25); border-radius:12px; padding:14px 16px; backdrop-filter:blur(8px);
    color:#cfe3ff; font-size:12px; width:230px; }
  .panel h4 { font-size:11px; letter-spacing:.18em; color:rgba(0,200,255,.85); margin-bottom:10px; text-transform:uppercase; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:9px 0; }
  .row label { flex:0 0 auto; opacity:.8; }
  .row input[type=range] { flex:1; accent-color:#00c8ff; }
  .row span { flex:0 0 38px; text-align:right; font-variant-numeric:tabular-nums; opacity:.7; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">拖曳滑鼠：轉動水卡看立體折射　·　<b>POC</b> 單卡概念驗證（不影響正式網站）</div>
<div class="panel">
  <h4>Liquid Glass 參數</h4>
  <div class="row"><label>色散 dispersion</label><input id="p-disp" type="range" min="0" max="8" step="0.1" value="3.2"><span id="v-disp">3.2</span></div>
  <div class="row"><label>厚度 thickness</label><input id="p-thick" type="range" min="0.3" max="6" step="0.1" value="0.9"><span id="v-thick">0.9</span></div>
  <div class="row"><label>折射 IOR</label><input id="p-ior" type="range" min="1.05" max="1.6" step="0.01" value="1.22"><span id="v-ior">1.22</span></div>
  <div class="row"><label>霧度 rough</label><input id="p-rough" type="range" min="0" max="0.4" step="0.01" value="0.06"><span id="v-rough">0.06</span></div>
  <div class="row"><label>圓潤 round</label><input id="p-round" type="range" min="0.05" max="0.5" step="0.01" value="0.28"><span id="v-round">0.28</span></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 9);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function makeBackgroundTexture(){
  const c=document.createElement('canvas'); c.width=1024; c.height=1024; const g=c.getContext('2d');
  const grd=g.createRadialGradient(512,430,60,512,512,760);
  grd.addColorStop(0,'#13203f'); grd.addColorStop(0.45,'#0a1226'); grd.addColorStop(1,'#05070f');
  g.fillStyle=grd; g.fillRect(0,0,1024,1024);
  g.save(); g.translate(512,512); g.rotate(-0.32); g.globalAlpha=0.10;
  const band=g.createLinearGradient(0,-120,0,120);
  band.addColorStop(0,'rgba(0,200,255,0)'); band.addColorStop(0.5,'rgba(0,200,255,1)'); band.addColorStop(1,'rgba(0,200,255,0)');
  g.fillStyle=band; g.fillRect(-700,-120,1400,240); g.restore();
  for(let i=0;i<520;i++){ const x=Math.random()*1024,y=Math.random()*1024,r=Math.random()*1.4+0.2;
    g.globalAlpha=Math.random()*0.7+0.15; g.fillStyle=Math.random()>0.85?'#bfe6ff':'#fff';
    g.beginPath(); g.arc(x,y,r,0,6.28); g.fill(); }
  g.globalAlpha=1; const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
scene.background = makeBackgroundTexture();

// 卡片內容（不透明 → 會被玻璃折射、文字在水裡可見）
function makeCardTexture(){
  const W=900,H=1180,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,W,H);
  grd.addColorStop(0,'#0c1c38'); grd.addColorStop(0.5,'#0a2440'); grd.addColorStop(1,'#06182e');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  const sh=g.createLinearGradient(0,0,0,H*0.5);
  sh.addColorStop(0,'rgba(120,200,255,0.16)'); sh.addColorStop(1,'rgba(120,200,255,0)');
  g.fillStyle=sh; g.fillRect(0,0,W,H*0.5);
  g.fillStyle='rgba(255,199,9,0.95)'; g.font='600 30px Consolas,monospace'; g.textBaseline='top';
  g.fillRect(90,150,70,2); g.fillText('SOCIAL  SERVICE', 90, 172);
  g.fillStyle='rgba(240,248,255,0.98)'; g.font='500 92px "Microsoft JhengHei",serif'; g.fillText('社群經營', 86, 300);
  g.fillStyle='rgba(210,228,250,0.92)'; g.font='400 33px "Microsoft JhengHei",sans-serif';
  ['你不是缺一個會發文的人，','是缺有人替你想清楚要說什麼。','素材設計、文案發想、帳號定位，','從靈魂出發。'].forEach((l,i)=>g.fillText(l,90,470+i*52));
  g.fillStyle='rgba(0,200,255,0.9)'; g.font='italic 36px Georgia,serif'; g.fillText('Read more',90,1010);
  g.strokeStyle='rgba(0,200,255,0.7)'; g.lineWidth=2; g.beginPath(); g.moveTo(290,1030); g.lineTo(360,1030); g.stroke();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
const cardW=4.0, cardH=cardW*(1180/900);
const textPlane=new THREE.Mesh(new THREE.PlaneGeometry(cardW*0.98,cardH*0.98), new THREE.MeshBasicMaterial({map:makeCardTexture()}));
textPlane.position.z=-0.3; scene.add(textPlane);

// ---- 乾淨的立體玻璃卡（規矩圓角矩形）----
const GLASS_DEPTH = 0.55;
let glass, glassMat;
function buildGlass(round){
  const geo=new RoundedBoxGeometry(cardW, cardH, GLASS_DEPTH, 8, round);
  if(!glass){ glass=new THREE.Mesh(geo, glassMat); scene.add(glass); }
  else { glass.geometry.dispose(); glass.geometry=geo; }
}
glassMat=new THREE.MeshPhysicalMaterial({
  transmission:1.0, thickness:0.9, ior:1.22, roughness:0.06, metalness:0.0,
  dispersion:3.2, specularIntensity:1.0, clearcoat:0.7, clearcoatRoughness:0.18,
  attenuationColor:new THREE.Color(0xeaf7ff), attenuationDistance:40.0,
  envMapIntensity:1.25, transparent:true
});
buildGlass(0.28);

const key=new THREE.DirectionalLight(0xcfeaff,2.2); key.position.set(4,6,5); scene.add(key);
const rim=new THREE.DirectionalLight(0x2a6cff,1.4); rim.position.set(-5,-2,3); scene.add(rim);

const target={x:0,y:0};
addEventListener('pointermove', e=>{ target.x=(e.clientX/innerWidth-0.5)*0.6; target.y=(e.clientY/innerHeight-0.5)*0.4; });

const $=id=>document.getElementById(id);
const bind=(id,vid,fn)=>{ const el=$(id),v=$(vid); el.addEventListener('input',()=>{ v.textContent=(+el.value).toFixed(2); fn(+el.value); }); };
bind('p-disp','v-disp', x=>glassMat.dispersion=x);
bind('p-thick','v-thick', x=>glassMat.thickness=x);
bind('p-ior','v-ior', x=>glassMat.ior=x);
bind('p-rough','v-rough', x=>glassMat.roughness=x);
bind('p-round','v-round', x=>buildGlass(x));

function tick(){
  requestAnimationFrame(tick);
  glass.rotation.y += (target.x - glass.rotation.y)*0.06;
  glass.rotation.x += (target.y - glass.rotation.x)*0.06;
  textPlane.rotation.copy(glass.rotation);
  renderer.render(scene, camera);
}
tick();
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
