<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服務玻璃球畫廊 POC｜創巢數位</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --cyan:0,200,255; --blue:23,54,245; --yellow:255,199,9; --stellar:225,235,255; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; font-family:"Noto Sans TC",sans-serif; background:#05070f; }
  body::before{ content:''; position:fixed; inset:0; z-index:-2; background:radial-gradient(circle at 50% 42%, #14213f 0%, #0a1226 48%, #05070f 100%); }
  body::after{ content:''; position:fixed; inset:0; z-index:-1; opacity:.5; pointer-events:none;
    background-image:radial-gradient(1.4px 1.4px at 18% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 72% 35%,#bfe6ff,transparent),
      radial-gradient(1px 1px at 42% 72%,#fff,transparent),radial-gradient(1.3px 1.3px at 86% 60%,#fff,transparent),radial-gradient(1px 1px at 30% 88%,#bfe6ff,transparent); }
  #c{ position:fixed; inset:0; cursor:grab; } #c:active{ cursor:grabbing; }
  .head{ position:fixed; top:48px; left:0; right:0; text-align:center; z-index:5; pointer-events:none; }
  .head .ey{ font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.28em; color:rgba(var(--yellow),.9); }
  .head h1{ font-family:"Noto Serif TC",serif; font-weight:600; font-size:clamp(1.6rem,3vw,2.3rem); color:rgba(var(--stellar),.98); margin-top:10px; }
  .caption{ position:fixed; left:0; right:0; bottom:120px; text-align:center; z-index:5; pointer-events:none; }
  .caption .t{ font-family:"Noto Serif TC",serif; font-weight:600; font-size:clamp(1.8rem,4vw,2.8rem); color:rgba(var(--stellar),.98);
    text-shadow:0 2px 20px rgba(0,0,0,.6); transition:opacity .2s; }
  .caption .e{ font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.2em; color:rgba(var(--cyan),.8); margin-top:8px; }
  .arrow{ position:fixed; top:50%; transform:translateY(-50%); z-index:6; width:54px; height:54px; border-radius:50%;
    background:rgba(10,18,34,.55); border:1px solid rgba(var(--cyan),.35); color:rgba(var(--cyan),.9); font-size:24px; cursor:pointer;
    backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; transition:.3s; }
  .arrow:hover{ background:rgba(var(--cyan),.18); transform:translateY(-50%) scale(1.08); }
  .prev{ left:5%; } .next{ right:5%; }
  .dots{ position:fixed; bottom:56px; left:0; right:0; display:flex; justify-content:center; gap:12px; z-index:6; }
  .dot{ width:8px; height:8px; border-radius:50%; background:rgba(var(--stellar),.25); cursor:pointer; transition:.3s; }
  .dot.on{ background:rgba(var(--cyan),.95); transform:scale(1.4); }
  .hint{ position:fixed; left:24px; bottom:22px; z-index:6; font-family:"JetBrains Mono",monospace; font-size:12px; color:rgba(var(--stellar),.45); }
  .hint b{ color:rgba(var(--cyan),.85); }
  body::before,body::after{display:none!important;} html,body{background:transparent!important;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="head"><div class="ey">OUR SERVICES</div><h1>我們能做的，比你想的更多</h1></div>
<div class="caption"><div class="t" id="capT">社群經營</div><div class="e" id="capE">SOCIAL</div></div>
<div class="arrow prev" onclick="step(1)">‹</div>
<div class="arrow next" onclick="step(-1)">›</div>
<div class="dots" id="dots"></div>
<div class="hint">拖曳旋轉玻璃球環 · 箭頭/圓點切換 · <b>每球內嵌服務靈魂色</b></div>

<script type="importmap">
{ "imports": { "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const SERVICES=[
  {t:'社群經營',e:'SOCIAL',map:'neptunemap.jpg',accent:'#4f8cff'},
  {t:'AI 虛擬網紅',e:'AI TALENT',map:'jupitermap.jpg',accent:'#ffb066'},
  {t:'網站架設',e:'WEBSITE',map:'earthmap1k.jpg',accent:'#5fd0ff'},
  {t:'客製系統',e:'SYSTEM',map:'venusmap.jpg',accent:'#ffd27a'},
  {t:'跳動E投放',e:'PLATFORM',map:'saturnmap.jpg',accent:'#ffd98a',ring:'saturnringcolor.jpg'},
  {t:'產業顧問',e:'CONSULT',map:'marsmap1k.jpg',accent:'#ff7a5a'},
];
const N=SERVICES.length, STEP=Math.PI*2/N, R=4.2, RX=2.9, RZ=4.8;  // 橢圓：RX 左右窄、RZ 前後深

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x05070f, 6.5, 18);  // 深空霧：遠方行星沒入黑暗、強化縱深
const camera=new THREE.PerspectiveCamera(48,1,0.1,100); camera.position.set(0,0,9.2);  // 廣角＋退後 → 透視更誇張
const pmrem=new THREE.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

// 真實行星貼圖（threex.planets via jsDelivr CDN，有 CORS）
const loader=new THREE.TextureLoader();
const PB='https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/';
function texOf(n){ const t=loader.load(PB+n); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }

const tilt=new THREE.Group(); tilt.rotation.x=0.22; scene.add(tilt);  // 中軸向前微傾
const ring=new THREE.Group(); tilt.add(ring);
const balls=SERVICES.map((s,i)=>{
  const g=new THREE.Group();
  const planet=new THREE.Mesh(new THREE.SphereGeometry(0.92,64,64),
    new THREE.MeshStandardMaterial({ map:texOf(s.map), roughness:.92, metalness:0 }));
  planet.rotation.z=0.18;                                   // 自轉軸微傾
  g.add(planet);                                            // children[0] = 行星
  // 大氣層光暈
  const atm=new THREE.Mesh(new THREE.SphereGeometry(1.03,48,48),
    new THREE.MeshBasicMaterial({ color:new THREE.Color(s.accent), transparent:true, opacity:.16, blending:THREE.AdditiveBlending, side:THREE.BackSide }));
  g.add(atm);                                               // children[1] = 大氣
  if(s.ring){ const rg=new THREE.RingGeometry(1.25,2.15,90); const p=rg.attributes.position, v=new THREE.Vector3();
    for(let k=0;k<p.count;k++){ v.fromBufferAttribute(p,k); rg.attributes.uv.setXY(k,(v.length()-1.25)/(2.15-1.25),0.5); }
    const rm=new THREE.Mesh(rg, new THREE.MeshBasicMaterial({ map:texOf(s.ring), transparent:true, opacity:.92, side:THREE.DoubleSide }));
    rm.rotation.x=-1.15; rm.rotation.y=0.2; g.add(rm); }
  const ang=i*STEP; g.position.set(Math.sin(ang)*R,0,Math.cos(ang)*R);
  ring.add(g); return g;
});

const key=new THREE.DirectionalLight(0xffffff,2.0); key.position.set(4,6,6); scene.add(key);
const rim=new THREE.DirectionalLight(0x2a6cff,1.3); rim.position.set(-6,-2,3); scene.add(rim);

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
resize(); addEventListener('resize',resize);

// dots
const dotsWrap=document.getElementById('dots');
const dots=SERVICES.map((s,i)=>{ const d=document.createElement('div'); d.className='dot'; d.onclick=()=>goto(i); dotsWrap.appendChild(d); return d; });
const capT=document.getElementById('capT'), capE=document.getElementById('capE');

let rotation=0,target=0,dragging=false,startX=0,startRot=0,autoOn=true,idle;
function frontIndex(){ return ((Math.round(-target/STEP)%N)+N)%N; }
function goto(i){ target=-i*STEP; pause(); } function step(d){ target+=d*STEP; pause(); }
window.step=step;
function pause(){ autoOn=false; clearTimeout(idle); idle=setTimeout(()=>autoOn=true,3500); }
canvas.addEventListener('pointerdown',e=>{ dragging=true; startX=e.clientX; startRot=target; pause(); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(dragging) target=startRot+(e.clientX-startX)*0.006; });
canvas.addEventListener('pointerup',()=>{ dragging=false; target=Math.round(target/STEP)*STEP; });

let lastFront=-1, t=0;
function tick(){ requestAnimationFrame(tick); t+=0.01;
  if(autoOn&&!dragging) target-=0.0016;
  rotation+=(target-rotation)*0.1;
  // 橢圓軌道：每幀重算位置（左右窄 RX、前後深 RZ）
  balls.forEach((b,i)=>{ const a=i*STEP+rotation;
    b.position.set(Math.sin(a)*RX, 0, Math.cos(a)*RZ);
    const f=(Math.cos(a)*0.5+0.5);
    const sc=(0.62+0.62*f)*0.64; b.scale.setScalar(sc + Math.sin(t*1.2+i)*0.01);  // 前後縮放差 + 再小 20%
    b.children[0].rotation.y += 0.004;                       // 行星自轉
    b.children[1].material.opacity = 0.1 + 0.24*f; });       // 前方大氣層較亮
  const fi=frontIndex(); if(fi!==lastFront){ lastFront=fi; capT.textContent=SERVICES[fi].t; capE.textContent=SERVICES[fi].e;
    dots.forEach((d,i)=>d.classList.toggle('on',i===fi)); }
  renderer.render(scene,camera);
}
tick();
</script>
</body>
</html>
