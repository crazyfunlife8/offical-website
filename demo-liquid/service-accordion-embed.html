<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服務手風琴｜創巢數位</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --cyan:0,200,255; --blue:23,54,245; --yellow:255,199,9; --stellar:225,235,255; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:transparent; font-family:"Noto Sans TC",sans-serif; color:rgba(var(--stellar),.92); overflow:hidden; }
  .wrap{ padding:30px 20px; }
  .head{ text-align:center; margin-bottom:30px; }
  .head .ey{ font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:.22em; color:rgba(var(--yellow),.9); }
  .head h2{ font-family:"Noto Serif TC",serif; font-weight:600; font-size:clamp(1.4rem,2.6vw,2rem); color:rgba(var(--stellar),.98); margin-top:8px; }
  .accord{ display:flex; gap:10px; width:min(1100px,96vw); height:400px; margin:0 auto; }
  .strip{ position:relative; flex:1; border-radius:14px; overflow:hidden; cursor:pointer;
    transition:flex .55s cubic-bezier(.16,1,.3,1); border:1px solid rgba(var(--cyan),.3); }
  .strip:hover{ flex:4.2; }
  .strip img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:grayscale(1) brightness(.46) contrast(1.1); transition:filter .5s; }
  .strip:hover img{ filter:grayscale(.25) brightness(.72); }
  .strip::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 38%, rgba(5,12,26,.92)), linear-gradient(120deg, rgba(var(--blue),.32), transparent 60%); }
  .strip .cap{ position:absolute; left:20px; bottom:22px; z-index:2; writing-mode:vertical-rl; font-family:"Noto Serif TC",serif; font-weight:600; font-size:1.25rem; color:#fff; transition:.4s; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  .strip:hover .cap{ writing-mode:horizontal-tb; }
  .strip .lab{ position:absolute; left:22px; top:20px; z-index:2; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.16em; color:rgba(var(--yellow),.92); opacity:0; transition:.4s; }
  .strip:hover .lab{ opacity:1; }
  .strip .desc{ position:absolute; left:22px; right:22px; bottom:60px; z-index:2; font-size:.85rem; line-height:1.7; color:rgba(var(--stellar),.85); opacity:0; transition:opacity .4s .15s; max-width:380px; }
  .strip:hover .desc{ opacity:1; }
  @media(max-width:760px){ .accord{ height:auto; flex-direction:column; } .strip{ height:90px; } .strip:hover{ flex:1; height:240px; } .strip .cap{ writing-mode:horizontal-tb; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="ey">EXPLORE</div><h2>或者，換個方式逛服務</h2></div>
  <div class="accord" id="accord"></div>
</div>
<script>
const SERVICES=[
  {t:'社群經營',e:'SOCIAL',d:'素材設計、文案發想、帳號定位，從靈魂出發。'},
  {t:'網站架設',e:'WEBSITE',d:'從一頁式起步站到企業電商，先解決你想說什麼。'},
  {t:'AI 虛擬網紅',e:'AI TALENT',d:'為品牌打造一個只屬於你的虛擬代言人。'},
  {t:'客製系統',e:'SYSTEM',d:'說得出來就寫得出來，沒說全的我們替你想到。'},
  {t:'跳動E投放',e:'PLATFORM',d:'台灣個人戶也能投 TikTok，最快 24 小時開通。'},
];
const ac=document.getElementById('accord');
SERVICES.forEach((s,i)=>{ const d=document.createElement('div'); d.className='strip';
  d.innerHTML=`<img src="https://picsum.photos/seed/svcacc${i}/600/800" alt=""><div class="lab">${s.e}</div><div class="desc">${s.d}</div><div class="cap">${s.t}</div>`;
  ac.appendChild(d); });
</script>
</body>
</html>
