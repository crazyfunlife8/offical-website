<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數位行銷手風琴｜創巢數位</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Italiana&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/chiron-fonts/chiron-sung-hk@1.024/WOFF2_TTF/css/vf.css">
<style>
:root{
  --cyan:0,200,255; --blue:23,54,245; --yellow:245,166,35; --stellar:225,235,255;
  --ink:5,12,26;
  --f-cjk:"Chiron Sung HK","Noto Serif TC",serif;
  --f-en:"Italiana",serif;
  --f-mono:"JetBrains Mono",monospace;
  --f-body:"Noto Sans TC",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;font-family:var(--f-body);color:rgba(var(--stellar),.9);overflow:hidden;height:100%}
body{display:flex;align-items:center;justify-content:center;padding:clamp(14px,2.5vh,28px) clamp(10px,2vw,28px)}

.acc{
  display:flex; gap:12px;
  /* 鎖 2:1：每格＝圖的 1/4（0.5:1），background-size:400% 100% 才不會壓縮圖 */
  width:min(1280px,100%,158vh); aspect-ratio:2/1;
}
.panel{
  position:relative; flex:1 1 0; min-width:0;
  border-radius:16px; overflow:hidden; cursor:pointer;
  border:1px solid rgba(var(--stellar),.14);
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(var(--blue),.18), transparent 60%),
    linear-gradient(180deg, rgba(12,22,46,.55), rgba(5,12,26,.78));
  /* 發光體：左上斜掠硬光 + 右下柔光 + 外羽化（像月岩被冷光掃過，不是均勻光圈） */
  box-shadow:-1px -1px 0 rgba(255,255,255,.72), 1px 1px 0 rgba(255,255,255,.22),
             0 0 14px rgba(255,255,255,.58), 0 0 34px 1px rgba(240,247,255,.24),
             0 10px 22px rgba(0,0,0,.34);
  transition:flex .62s var(--ease), transform .62s var(--ease), border-color .5s var(--ease), background .5s var(--ease), box-shadow .5s var(--ease);
}
.panel:not(.open):hover{ border-color:rgba(var(--cyan),.40);
  box-shadow:-1px -1px 0 rgba(255,255,255,.9), 1px 1px 0 rgba(255,255,255,.28),
             0 0 22px rgba(255,255,255,.78), 0 0 46px 2px rgba(238,246,255,.34),
             0 10px 24px rgba(0,0,0,.34); }
.panel.open{
  flex:4 1 0; cursor:default;
  transform:translateY(-3px);
  border-color:rgba(var(--cyan),.30);
  background:
    radial-gradient(90% 70% at 12% 0%, rgba(var(--blue),.26), transparent 55%),
    linear-gradient(180deg, rgba(14,26,54,.72), rgba(5,12,26,.86));
}
/* 開啟卡左緣冷光 */
.panel.open::before{
  content:''; position:absolute; left:0; top:14%; bottom:14%; width:2px; z-index:3;
  background:linear-gradient(180deg,transparent,rgba(var(--cyan),.9),transparent);
  box-shadow:0 0 14px rgba(var(--cyan),.5);
}

/* 背景影像（活潑社群視覺）＋遮罩：僅開啟時淡入 */
/* 影像永遠顯示（收合等寬也看得到）；收合用底部漸層保標籤可讀 */
.bgimg{ position:absolute; inset:0; background-size:cover; background-position:center;
  /* 凹刻浮雕：上/左內陰影 + 下/右內高光 → 卡片像從月面切出來的一塊石板 */
  box-shadow:inset 0 3px 7px rgba(0,0,0,.30), inset 0 -3px 6px rgba(255,255,255,.42),
             inset 3px 0 7px rgba(0,0,0,.16), inset -3px 0 6px rgba(255,255,255,.22); }
/* 碑刻邊框：刻進石面的一圈凹槽線（cartouche） */
.bgimg::after{ content:''; position:absolute; inset:13px; border-radius:9px;
  border:1px solid rgba(18,24,34,.20);
  box-shadow:0 1px 0 rgba(255,255,255,.48), 0 -1px 0 rgba(0,0,0,.10),
             inset 0 1px 1px rgba(255,255,255,.38), inset 0 -1px 1px rgba(0,0,0,.18),
             inset 1px 0 0 rgba(255,255,255,.18), inset -1px 0 0 rgba(0,0,0,.10); }
.panel.open .bgimg::after{ opacity:0; transition:opacity .4s var(--ease); }
/* 展開：石板被選中、微微浮起＋月面微亮 */
.panel.open .bgimg{ filter:brightness(1.04) contrast(1.03); transform:scale(1.006);
  transition:filter .55s var(--ease), transform .62s var(--ease); }
/* 有卡展開時，其他卡退讓：月面微暗、光暈收弱，主卡像被聚光掃中 */
.acc:has(.panel.open) .panel:not(.open) .bgimg{ filter:brightness(.88) contrast(.96) saturate(.9);
  transition:filter .5s var(--ease); }
.acc:has(.panel.open) .panel:not(.open){
  box-shadow:-1px -1px 0 rgba(255,255,255,.4), 0 0 10px rgba(255,255,255,.34),
             0 0 22px rgba(240,247,255,.14), 0 8px 20px rgba(0,0,0,.32); }
/* 亮月底：遮罩調淡、只留底部一點 vignette（保留卡片邊界感、不壓暗月面）*/
.bgscrim{ position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(7,14,30,.03) 0%, rgba(7,14,30,.08) 58%, rgba(7,14,30,.30) 100%); }

/* ─── 收合脊柱 ─── */
/* ─── 碑刻：服務名是刻進月石的碑文 ─── */
.spine{
  position:absolute; inset:0; z-index:3; padding:26px 24px;
  opacity:1; transition:opacity .35s var(--ease); }
.panel.open .spine{ opacity:0; pointer-events:none; }

/* 大號淡刻編號：低對比凹刻、當藝術背景錨點（右上） */
.spine .num{ position:absolute; top:18px; right:20px; font-family:var(--f-en);
  font-size:3.1rem; line-height:.75; color:rgba(58,64,78,.26);
  text-shadow:0 1.5px 0 rgba(255,255,255,.55), 0 -1px 1px rgba(0,0,0,.22); }

/* 直排碑文：深凹刻、放大、有重量；上暗下亮＝刻進石面 */
.spine__cols{ position:relative; display:flex; flex-direction:row; align-items:flex-start; gap:10px; }
.spine .v{ writing-mode:vertical-rl; font-family:var(--f-cjk); font-weight:600;
  font-size:2.1rem; letter-spacing:.18em; line-height:1; color:rgba(48,54,67,.94);
  -webkit-text-stroke:.25px rgba(18,24,34,.15);
  text-shadow:0 2px 0 rgba(255,255,255,.7), 0 -1.5px 1px rgba(0,0,0,.40),
              1px 0 0 rgba(255,255,255,.14), -1px 0 0 rgba(0,0,0,.10),
              0 4px 5px rgba(0,0,0,.12); }
/* 英文 echo：細凹刻直排，靠一條刻線當欄線 */
.spine .ven{ writing-mode:vertical-rl; font-family:var(--f-mono); font-size:10px; letter-spacing:.34em;
  text-transform:uppercase; color:rgba(62,68,82,.52);
  text-shadow:0 1px 0 rgba(255,255,255,.5), 0 -1px 0 rgba(0,0,0,.14);
  padding-left:8px; border-left:1px solid rgba(22,28,40,.16); }

/* ─── 展開內容 ─── */
.body{
  position:absolute; inset:0; z-index:2; padding:clamp(22px,3vh,40px) clamp(24px,3vw,48px);
  opacity:0; visibility:hidden; transition:opacity .45s var(--ease) .12s, visibility 0s .6s;
  display:grid; grid-template-rows:auto 1fr;
  /* 展開時才出現的強遮罩（左重右輕）讓文字＋方案在圖上可讀 */
  background:linear-gradient(96deg, rgba(7,14,30,.95) 0%, rgba(7,14,30,.88) 42%, rgba(7,14,30,.6) 68%, rgba(7,14,30,.82) 100%);
}
.panel.open .body{ opacity:1; visibility:visible; transition:opacity .55s var(--ease) .18s; }

.head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
.kicker{ font-family:var(--f-mono); font-size:11px; letter-spacing:.26em; text-transform:uppercase;
  color:rgba(var(--cyan),.85); padding-top:6px; border-top:1px solid rgba(var(--yellow),.55);
  display:inline-block; align-self:flex-start; }
.bignum{ font-family:var(--f-en); font-size:clamp(2.6rem,5vw,4.2rem); line-height:.8;
  color:rgba(var(--stellar),.10); }

.title{ font-family:var(--f-cjk); font-weight:500; font-size:clamp(2rem,3.4vw,2.9rem);
  color:rgba(var(--stellar),.98); letter-spacing:.04em; margin-top:clamp(10px,2vh,22px);
  text-shadow:1px 1px 0 #000, 0 0 22px rgba(0,0,0,.5); }
.en{ font-family:var(--f-en); font-size:clamp(1rem,1.6vw,1.35rem); color:rgba(var(--cyan),.6);
  letter-spacing:.03em; margin-top:4px; }
.lead{ font-size:clamp(.86rem,1.05vw,.98rem); line-height:1.85; color:rgba(var(--stellar),.78);
  max-width:34em; margin-top:clamp(12px,1.8vh,20px); }

/* social 雙欄 */
.grid{ display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(24px,3vw,48px);
  align-content:start; margin-top:clamp(14px,2vh,22px); }
@media(max-width:760px){ .grid{ grid-template-columns:1fr; gap:18px; } }

.meta{ margin-top:16px; }
.meta + .meta{ margin-top:14px; }
.meta .ml{ font-family:var(--f-mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:rgba(var(--stellar),.45); margin-bottom:8px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ font-size:.8rem; padding:5px 12px; border-radius:999px; color:rgba(var(--stellar),.85);
  border:1px solid rgba(var(--cyan),.28); background:rgba(var(--cyan),.06); }
.acts{ font-size:.84rem; line-height:1.6; color:rgba(var(--stellar),.7); }
.acts b{ color:rgba(var(--stellar),.9); font-weight:500; }

/* 方案 */
.plans{ display:flex; flex-direction:column; gap:10px; }
.plan{ position:relative; border:1px solid rgba(var(--stellar),.12); border-radius:12px;
  padding:13px 16px; background:rgba(7,14,30,.55); backdrop-filter:blur(3px);
  display:grid; grid-template-columns:1fr auto; gap:4px 14px; align-items:baseline;
  transition:border-color .3s var(--ease), background .3s var(--ease); }
.plan:hover{ border-color:rgba(var(--cyan),.4); background:rgba(var(--cyan),.05); }
.plan.feat{ border-color:rgba(var(--yellow),.5);
  background:linear-gradient(0deg,rgba(var(--yellow),.10),rgba(var(--yellow),.10)),rgba(7,14,30,.6); }
.plan .pn{ font-family:var(--f-cjk); font-weight:500; font-size:1.02rem; color:rgba(var(--stellar),.96); }
.plan .pp{ font-family:var(--f-mono); font-size:1.02rem; color:rgba(var(--stellar),.96); text-align:right; }
.plan .pp small{ font-size:.66rem; color:rgba(var(--stellar),.5); letter-spacing:.04em; }
.plan .pd{ grid-column:1/-1; font-size:.76rem; line-height:1.5; color:rgba(var(--stellar),.6); }
.plan .tag{ position:absolute; top:-9px; right:14px; font-family:var(--f-mono); font-size:9px;
  letter-spacing:.18em; padding:2px 8px; border-radius:999px; color:#1a1205;
  background:rgba(var(--yellow),.92); }

.cta{ display:inline-flex; align-items:center; gap:8px; margin-top:18px;
  font-family:var(--f-body); font-size:.9rem; font-weight:500; letter-spacing:.04em;
  color:rgba(var(--stellar),.95); text-decoration:none; }
.cta .ar{ font-family:var(--f-mono); transition:transform .3s var(--ease); }
.cta:hover{ color:rgb(var(--cyan)); }
.cta:hover .ar{ transform:translateX(5px); }
.priceline{ font-family:var(--f-mono); font-size:.82rem; color:rgba(var(--yellow),.9);
  letter-spacing:.04em; margin-top:18px; }

/* ─── 手機：垂直堆疊 ─── */
@media(max-width:820px){
  body{overflow:auto;align-items:flex-start}
  .acc{ flex-direction:column; height:auto; aspect-ratio:auto; gap:10px; }
  .panel{ flex:0 0 auto; min-height:62px; }
  .panel.open{ min-height:auto; }
  .spine{ flex-direction:row; padding:0 20px; height:62px; justify-content:flex-start; gap:16px; }
  .spine .v,.spine .ven{ writing-mode:horizontal-tb; }
  .spine .ven{ border-left:none; padding-left:0; }
  .spine .num{ position:static; font-size:1.1rem; }
  .body{ position:relative; inset:auto; }
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="acc" id="acc"></div>
<script>
const DATA=[
  {
    n:'01', cjk:'社群經營', en:'SOCIAL', echo:'Your brand, always on.',
    lead:'不只是代發文。策略、內容、發布、互動、數據——一條龍的社群系統，把帳號養成會自己長大的品牌資產。',
    social:true, img:'../_imgtest/social-neopop.png',
    platforms:['LINE','Instagram','Threads','Facebook','TikTok'],
    acts:'<b>海巡漲粉</b> · <b>內容製作</b>（圖文／短影音）· <b>互動經營</b> · <b>數據追蹤</b>',
    plans:[
      {n:'基礎行銷', p:'NT$3,800', u:'／月', d:'4 篇圖文｜排版設計＋市場文案，維持品牌曝光'},
      {n:'成長推廣', p:'NT$8,500', u:'／月', d:'8 篇圖文｜月度數據分析＋經營方向建議', feat:true},
      {n:'整合行銷', p:'NT$21,000', u:'／月', d:'12 篇圖文｜完整數據追蹤＋活動企劃＋全面策略'},
    ],
  },
  {
    n:'02', cjk:'部落格代營運', en:'SEO CONTENT', echo:'Traffic that compounds.',
    lead:'用 16 個 AI 代理、逾 60 道客觀把關的內容產線，幫你長期經營 SEO 部落格——讓搜尋流量自己長進來，而不是丟給 ChatGPT 亂發。',
    price:'依規模規劃 · 訂閱式長期經營',
  },
  {
    n:'03', cjk:'廣告投放', en:'PAID ADS', echo:'Spend that performs.',
    lead:'跨 FB／IG／TikTok 代客操盤，含影片與短影音廣告——從素材企劃、出價優化到成效回報，一手包辦。',
    price:'投放金額 10–25% 抽成',
  },
  {
    n:'04', cjk:'AI 形象網紅', en:'AI TALENT', echo:'A face that never tires.',
    lead:'為品牌打造可長期經營的虛擬代言人——情緒穩定、形象可控、無出鏡包袱。我們的目標只有一個：做到沒有 AI 感。',
    price:'詢價制',
  },
];

const MURAL = new URLSearchParams(location.search).get('mural') || 'mural-h.png';
const acc=document.getElementById('acc');
DATA.forEach((s,i)=>{
  const p=document.createElement('div');
  p.className='panel';
  p.tabIndex=0; p.setAttribute('role','button');
  p.setAttribute('aria-expanded','false');
  p.setAttribute('aria-label', s.cjk);

  let body='';
  if(s.social){
    body=`
      <div class="head"><span class="kicker">數位行銷 ／ ${s.en}</span><span class="bignum">${s.n}</span></div>
      <div>
        <h3 class="title">${s.cjk}</h3>
        <p class="en">${s.echo}</p>
        <div class="grid">
          <div>
            <p class="lead">${s.lead}</p>
            <div class="meta"><div class="ml">經營平台</div><div class="chips">${s.platforms.map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>
            <div class="meta"><div class="ml">日常動作</div><div class="acts">${s.acts}</div></div>
            <a class="cta" href="../contact.html" target="_top">想開始經營 <span class="ar">→</span></a>
          </div>
          <div class="plans">
            ${s.plans.map(pl=>`
              <div class="plan${pl.feat?' feat':''}">
                ${pl.feat?'<span class="tag">推薦</span>':''}
                <span class="pn">${pl.n}</span>
                <span class="pp">${pl.p}<small>${pl.u}</small></span>
                <span class="pd">${pl.d}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>`;
  }else{
    body=`
      <div class="head"><span class="kicker">數位行銷 ／ ${s.en}</span><span class="bignum">${s.n}</span></div>
      <div>
        <h3 class="title">${s.cjk}</h3>
        <p class="en">${s.echo}</p>
        <p class="lead">${s.lead}</p>
        <p class="priceline">${s.price}</p>
        <a class="cta" href="../contact.html" target="_top">想了解更多 <span class="ar">→</span></a>
      </div>`;
  }

  // mural 整幅切四份：每條取對應的四分之一（background-position 依序 0/33/67/100%）
  // 深色刻字後不再需要遮罩；月面以全亮度呈現
  const bg = `<div class="bgimg" style="background-image:url('../_imgtest/${MURAL}'); background-size:400% 100%; background-position:${(i/3*100).toFixed(2)}% center;"></div>`;
  p.innerHTML=`${bg}
    <div class="spine"><span class="num">${s.n}</span><div class="spine__cols"><span class="v">${s.cjk}</span><span class="ven">${s.en}</span></div></div>
    <div class="body">${body}</div>`;
  acc.appendChild(p);
});

const panels=[...document.querySelectorAll('.panel')];
function open(idx){
  panels.forEach((p,i)=>{ const on=i===idx; p.classList.toggle('open',on); p.setAttribute('aria-expanded',on?'true':'false'); });
}
function toggle(p,i){
  if(p.classList.contains('open')){ p.classList.remove('open'); p.setAttribute('aria-expanded','false'); }
  else { open(i); }
}
panels.forEach((p,i)=>{
  p.addEventListener('click',()=>toggle(p,i));
  p.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(p,i); } });
});
</script>
</body>
</html>
