name: Deploy to Cloudflare Pages

# 觸發條件：push 到 main 自動部署；workflow_dispatch 允許在 GitHub UI 手動 retry
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        run: npm install

      # 內部文件不對外部署：在 runner checkout 上移除（repo 保留；.assetsignore 對 pages deploy 無效，故在此 rm）
      - name: Strip internal docs from deploy
        run: rm -f *.md

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # commit-message 必須 ASCII，避免 Cloudflare API 8000111 Invalid commit message
          command: pages deploy . --project-name=nestdigitalai --branch=main --commit-dirty=true --commit-message="GHA auto-deploy ${{ github.sha }}"
