<!doctype html>
<html lang="zh-Hant-TW">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--wine:#681f2a;--wine2:#3c1118;--cream:#f7f0e3;--paper:#fffdf8;--gold:#b58a43;--ink:#2d2421;--muted:#756762;--line:#d7c7b4;--green:#315f4b}
    *{box-sizing:border-box}html{background:#e8dfd1;scroll-behavior:smooth}body{margin:0;font:16px/1.65 "Noto Sans TC",sans-serif;color:var(--ink);background:var(--cream);min-height:100vh;overflow-x:hidden}button,input,textarea{font:inherit}button,a{touch-action:manipulation}.shell{max-width:480px;margin:auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:190px}.modebar{position:sticky;top:0;z-index:30;background:rgba(60,17,24,.97);padding:11px 15px;box-shadow:0 3px 12px #3c111833}.switcher{display:grid;grid-template-columns:1fr 1fr;border:1px solid #b9898f;border-radius:999px;padding:4px}.switcher button{border:0;border-radius:999px;min-height:44px;color:#ead8d3;background:transparent;font-weight:700;cursor:pointer}.switcher button.active{background:var(--cream);color:var(--wine2)}.hero{padding:28px 22px 25px;background:var(--wine);color:#fff;position:relative;overflow:hidden}.hero:after{content:"燉";font:900 124px/.8 "Noto Serif TC";position:absolute;right:-10px;bottom:-20px;color:#ffffff0e}.hero small{color:#e2bd83;letter-spacing:.15em;font-weight:700}.hero h1{font:900 34px/1.2 "Noto Serif TC";margin:5px 0}.hero p{margin:5px 0 0;max-width:270px;color:#f0dede}.info{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:1px solid var(--line)}.info div{padding:13px 18px}.info div+div{border-left:1px solid var(--line)}.info small{display:block;color:var(--muted);font-size:13px}.info strong{font-family:"Noto Serif TC"}.main{padding:24px 19px;min-height:620px}.steps{display:flex;align-items:center;margin-bottom:22px}.steps i{width:9px;height:9px;border-radius:50%;background:#cbbdac}.steps i.on{background:var(--wine);box-shadow:0 0 0 4px #681f2a1c}.steps b{height:1px;flex:1;background:#cbbdac}.stephead{margin-bottom:18px}.stephead small{color:var(--gold);font-weight:700}.stephead h2{font:900 27px/1.3 "Noto Serif TC";margin:3px 0}.stephead p{margin:6px 0 0;color:var(--muted)}.people{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.choice{border:1px solid var(--line);background:var(--paper);border-radius:14px;min-height:65px;font-weight:700;color:var(--ink);cursor:pointer}.choice.selected{background:var(--wine);border-color:var(--wine);color:#fff;box-shadow:0 6px 16px #681f2a2b}.choice small{display:block}.notice{margin-top:14px;padding:13px 14px;border-radius:12px;background:#f0e3d3;border-left:4px solid var(--gold)}.dates{display:grid;grid-template-columns:repeat(7,76px);gap:9px;overflow-x:auto;padding:3px 2px 12px;scrollbar-width:none}.dates::-webkit-scrollbar{display:none}.date{min-height:82px;border:1px solid var(--line);background:#fff;border-radius:40px;text-align:center;cursor:pointer}.date b,.date small{display:block}.date.selected{background:var(--wine);color:#fff;border-color:var(--wine)}.meal-title{font:700 18px "Noto Serif TC";display:flex;align-items:center;gap:10px;margin:20px 0 10px}.meal-title:after{content:"";height:1px;background:var(--line);flex:1}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.time{border:1px solid var(--line);background:#fff;min-height:56px;border-radius:10px;font-weight:700;cursor:pointer}.time.selected{background:var(--green);border-color:var(--green);color:#fff}.time:disabled{background:#e5ded3;color:#988c82;text-decoration:line-through}.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:25px}.actions.single{grid-template-columns:1fr}.btn{border:1px solid var(--wine);border-radius:12px;min-height:51px;background:transparent;color:var(--wine);font-weight:700;padding:10px;cursor:pointer}.btn.primary{background:var(--wine);color:#fff;box-shadow:0 7px 16px #681f2a2b}.btn:disabled{opacity:.42;box-shadow:none}.field{margin-bottom:16px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;min-height:50px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 13px;color:var(--ink)}.field textarea{min-height:92px;resize:vertical}.hint{font-size:14px;color:var(--muted);margin-top:5px}.review{background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 16px;box-shadow:0 10px 30px #3c11180d}.review dl{margin:0}.review div{display:grid;grid-template-columns:90px 1fr;padding:11px 0;border-bottom:1px solid #e5dacd}.review div:last-child{border:0}.review dt{color:var(--muted)}.review dd{margin:0;font-weight:600}.deposit{margin-top:15px;background:#f4e4c8;border-radius:14px;padding:14px}.deposit strong{display:block;color:var(--wine)}.complete{text-align:center;padding-top:5px}.seal{margin:0 auto 18px;width:94px;height:94px;border-radius:50%;border:2px solid var(--wine);box-shadow:inset 0 0 0 6px var(--cream),inset 0 0 0 8px var(--wine);display:grid;place-items:center;color:var(--wine);font:900 26px "Noto Serif TC";transform:rotate(-5deg)}.complete h2{font:900 30px "Noto Serif TC";margin:0}.complete .summary{margin:18px 0;background:#fff;border-top:3px double var(--gold);border-bottom:3px double var(--gold);padding:16px}.complete .summary strong{font:900 23px "Noto Serif TC";display:block}.reminder{text-align:left;border-radius:14px;padding:14px 15px;background:var(--green);color:#fff;margin-bottom:10px}.reminder strong{display:block}.ownerhead{background:var(--wine2);color:#fff;padding:24px 18px;border-bottom:4px solid var(--gold)}.ownerhead small{color:#d7b276}.ownerhead h1{font:900 28px "Noto Serif TC";margin:3px 0}.ownerhead p{margin:0;color:#dfcbd0}.owner{padding:20px 15px}.stats{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-bottom:24px}.stat{background:#fff;border-radius:15px;padding:15px;border:1px solid var(--line)}.stat strong{display:block;font:900 32px "Noto Serif TC";color:var(--wine)}.demo{font-size:12px;color:var(--wine);background:#f0ded4;padding:2px 6px;border-radius:999px;white-space:nowrap}.owner h2{font:900 21px "Noto Serif TC";margin:0 0 12px}.bookings{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:25px}.booking{display:grid;grid-template-columns:66px 1fr;min-height:78px}.booking+.booking{border-top:1px solid var(--line)}.booking time{padding:14px 8px;text-align:center;background:#f4eadd;font-weight:800;color:var(--wine)}.booking div{padding:11px 12px}.booking strong{display:block}.booking small{font-size:13px;color:var(--muted)}.pending{display:grid;gap:9px}.pendingrow{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:9px;padding:11px 12px}.pendingrow strong{display:flex;justify-content:space-between}.footer{position:absolute;bottom:0;left:0;right:0;text-align:center;background:var(--paper);border-top:1px solid var(--line);padding:15px 17px 18px}.footer p{font-size:12px;margin:0 0 9px;color:var(--muted)}.footer .cta{display:flex;align-items:center;justify-content:center;min-height:48px;background:var(--wine);color:#fff;text-decoration:none;border-radius:12px;font-weight:700;padding:9px}.footer .brand{display:inline-block;margin-top:8px;color:var(--wine);font-size:14px;font-weight:700}.hidden{display:none!important}@media(min-width:481px){.shell{box-shadow:0 0 44px #3c11181a}}
  </style>
</head>
<body>
<div class="shell">
  <header class="modebar"><nav class="switcher" aria-label="切換瀏覽身分"><button class="active" data-mode="guest">客人看到的</button><button data-mode="owner">老闆看到的</button></nav></header>
  <section id="guestView"><div class="hero"><small>台式燉飯・慢火鍋物</small><h1>燉鍋小館</h1><p>留一張桌，今晚慢慢吃頓熱的。</p></div><div class="info"><div><small>座位</small><strong>約 30 席</strong></div><div><small>訂位開放</small><strong>未來 7 天</strong></div></div><main class="main" id="guestMain"></main></section>
  <section id="ownerView" class="hidden"><div class="ownerhead"><small>燉鍋小館・訂位工作台</small><h1>今晚桌況</h1><p>人數、備註、待確認名單集中看。</p></div><main class="owner" id="ownerMain"></main></section>
  <footer class="footer"><p>這是創巢數位做的示範頁，店名與內容都是虛構的</p><a class="cta" href="#">想要你店裡也有一個？留 Email 等上線 →</a><a class="brand" href="#">創巢數位</a></footer>
</div>
<script>
(()=>{
 const state={step:1,people:2,date:'',time:'',name:'',phone:'',note:'',paid:false};
 const guestMain=document.querySelector('#guestMain'),ownerMain=document.querySelector('#ownerMain');
 const dates=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i+1);return {key:d.toISOString().slice(0,10),day:new Intl.DateTimeFormat('zh-TW',{weekday:'short'}).format(d),date:new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric'}).format(d)}});
 const lunch=['11:30','12:00','12:30','13:00','13:30'],dinner=['17:30','18:00','18:30','19:00','19:30','20:00','20:30'],full=['12:00','18:30','19:30'];
 function progress(){return `<div class="steps">${[1,2,3,4,5].map((n,i)=>`${i?'<b></b>':''}<i class="${state.step>=n?'on':''}"></i>`).join('')}</div>`}
 function head(n,title,p=''){return `<div class="stephead"><small>步驟 ${n}／5</small><h2>${title}</h2>${p?`<p>${p}</p>`:''}</div>`}
 function actions(back,next,disabled=false,cls=''){return `<div class="actions"><button class="btn" data-back>${back}</button><button class="btn primary ${cls}" data-next ${disabled?'disabled':''}>${next}</button></div>`}
 function render(){let h=progress();
  if(state.step===1)h+=head(1,'這次幾位用餐？','1 到 7 位可直接完成線上訂位。')+`<div class="people">${[1,2,3,4,5,6,7,8].map(n=>`<button class="choice ${state.people===n?'selected':''}" data-people="${n}">${n===8?'8 人':' '+n+' '}<small>${n===8?'以上':'位'}</small></button>`).join('')}</div>${state.people===8?'<div class="notice"><strong>8 人以上請來電</strong><br>我們會協助安排併桌與餐點。</div>':''}<div class="actions single"><button class="btn primary" data-next ${state.people===8?'disabled':''}>選日期</button></div>`;
  if(state.step===2)h+=head(2,'哪一天來？','顯示明天起算的未來 7 天。')+`<div class="dates">${dates.map((d,i)=>`<button class="date ${state.date===d.key?'selected':''}" data-date="${d.key}"><small>${i===0?'明天':d.day}</small><b>${d.date}</b></button>`).join('')}</div>${actions('回選人數','選用餐時段',!state.date)}`;
  if(state.step===3)h+=head(3,'想幾點入座？','灰色時段已滿，請選其他時間。')+meal('午餐',lunch)+meal('晚餐',dinner)+actions('回選日期','填訂位資料',!state.time);
  if(state.step===4)h+=head(4,'留個訂位資料')+`<div class="field"><label for="name">訂位稱呼</label><input id="name" value="${esc(state.name)}" autocomplete="name" placeholder="例如：林先生"></div><div class="field"><label for="phone">手機號碼</label><input id="phone" value="${esc(state.phone)}" inputmode="tel" autocomplete="tel" maxlength="10" placeholder="例如：0912345678"><div class="hint">用於訂位確認與前一天提醒。</div></div><div class="field"><label for="note">備註（可不填）</label><textarea id="note" placeholder="例如：需要 1 張兒童椅、甲殼類過敏">${esc(state.note)}</textarea></div>${actions('回選時段','確認訂位',!(state.name.trim()&&/^09\d{8}$/.test(state.phone)))}`;
  if(state.step===5){const d=dates.find(x=>x.key===state.date);h+=head(5,'確認訂位內容')+`<div class="review"><dl><div><dt>日期</dt><dd>${d.day} ${d.date}</dd></div><div><dt>時間</dt><dd>${state.time}</dd></div><div><dt>人數</dt><dd>${state.people} 位</dd></div><div><dt>訂位人</dt><dd>${esc(state.name)}・${esc(state.phone)}</dd></div><div><dt>備註</dt><dd>${esc(state.note)||'無'}</dd></div></dl></div>${state.people>=6?'<div class="deposit"><strong>6 位以上需付訂金 $500</strong>訂金會保留座位，當日可折抵餐費。</div>':''}${actions('回上一步',state.people>=6?'付訂金（示範，不會扣款）':'確認訂位')}`}
  if(state.step===6){const d=dates.find(x=>x.key===state.date);h=`<div class="complete"><div class="seal">已留席</div><h2>訂位完成</h2><p>期待為你端上熱騰騰的一餐。</p><div class="summary"><strong>${d.day} ${d.date}・${state.time}</strong>${state.people} 位・${esc(state.name)}</div><div class="reminder"><strong>座位保留 10 分鐘</strong>若會晚到，請提早與店家聯絡。</div><div class="reminder"><strong>前一天會傳 LINE 提醒你</strong>不能來可以直接在提醒裡取消。</div><div class="actions single"><button class="btn" data-reset>再示範一次</button></div></div>`}
  guestMain.innerHTML=h;bind();
 }
 function meal(title,list){return `<div class="meal-title">${title}</div><div class="times">${list.map(t=>`<button class="time ${state.time===t?'selected':''}" data-time="${t}" ${full.includes(t)?'disabled':''}>${t}${full.includes(t)?'<small> 已滿</small>':''}</button>`).join('')}</div>`}
 function bind(){document.querySelectorAll('[data-people]').forEach(b=>b.onclick=()=>{state.people=Number(b.dataset.people);render()});document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{state.date=b.dataset.date;render()});document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{state.time=b.dataset.time;render()});const name=document.querySelector('#name'),phone=document.querySelector('#phone'),note=document.querySelector('#note');if(name)name.oninput=()=>{state.name=name.value;toggle()};if(phone)phone.oninput=()=>{phone.value=phone.value.replace(/\D/g,'').slice(0,10);state.phone=phone.value;toggle()};if(note)note.oninput=()=>state.note=note.value;document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{if(state.step===5&&state.people>=6)state.paid=true;state.step++;render();top()});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{state.step--;render();top()});const reset=document.querySelector('[data-reset]');if(reset)reset.onclick=()=>{Object.assign(state,{step:1,people:2,date:'',time:'',name:'',phone:'',note:'',paid:false});render();top()}}
 function toggle(){const b=document.querySelector('[data-next]');if(b)b.disabled=!(state.name.trim()&&/^09\d{8}$/.test(state.phone))}function top(){window.scrollTo({top:0,behavior:'smooth'})}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function renderOwner(){const rows=[['17:30','陳小姐・2 位','靠牆座位'],['18:00','吳先生・4 位','1 張兒童椅'],['18:30','許小姐・3 位','甲殼類過敏'],['19:00','林先生・6 位','慶生，訂金已收'],['20:00','張小姐・2 位','無']];ownerMain.innerHTML=`<div class="stats"><div class="stat"><span class="demo">示範數據</span><strong>46 位</strong>今天預計來客</div><div class="stat"><span class="demo">示範數據</span><strong>12 桌</strong>今晚訂位</div></div><h2>今晚訂位表 <span class="demo">示範數據</span></h2><div class="bookings">${rows.map(r=>`<div class="booking"><time>${r[0]}</time><div><strong>${r[1]}</strong><small>${r[2]}</small></div></div>`).join('')}</div><h2>還沒確認的名單 <span class="demo">示範數據</span></h2><div class="pending"><div class="pendingrow"><strong><span>王小姐・4 位</span><span>待回覆</span></strong><small>18:00・手機末三碼 521</small></div><div class="pendingrow"><strong><span>高先生・7 位</span><span>待訂金</span></strong><small>19:30・訂金 $500</small></div></div>`}
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#guestView').classList.toggle('hidden',b.dataset.mode!=='guest');document.querySelector('#ownerView').classList.toggle('hidden',b.dataset.mode!=='owner');top()});render();renderOwner();
})();
</script>
</body>
</html>
