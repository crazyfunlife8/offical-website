  <style>
    :root{--ink:#211f1a;--paper:#fff8dc;--yellow:#ffd43b;--orange:#f45b26;--green:#165b42;--line:#2b2923;--muted:#706b5e;--white:#fffdf4;--shadow:4px 4px 0 #211f1a}
    *{box-sizing:border-box}html{background:#ede7d0;scroll-behavior:smooth}body{margin:0;color:var(--ink);font:16px/1.55 "Noto Sans TC",sans-serif;background:var(--paper);min-height:100vh;overflow-x:hidden}button,input,textarea{font:inherit}button,a{touch-action:manipulation}.shell{width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:182px}.modebar{position:sticky;top:0;z-index:50;background:rgba(255,248,220,.96);border-bottom:2px solid var(--line);padding:10px 14px;backdrop-filter:blur(10px)}.switcher{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);background:var(--white);padding:3px;gap:3px}.switcher button{min-height:44px;border:0;background:transparent;font-weight:800;color:var(--muted);cursor:pointer}.switcher button.active{background:var(--ink);color:#fff}.masthead{padding:22px 18px 18px;border-bottom:2px solid var(--line);background:linear-gradient(135deg,var(--yellow) 0 72%,#ffc121 72%)}.eyebrow{font-size:14px;font-weight:800;letter-spacing:.08em}.masthead h1{font-size:34px;line-height:1.08;margin:5px 0 7px;font-weight:900}.masthead p{margin:0;font-weight:600}.problem{margin:16px 16px 0;border:2px solid var(--line);padding:12px 14px;background:#fff;box-shadow:var(--shadow);font-size:14px}.problem strong{display:block;color:var(--orange);margin-bottom:3px}.main{padding:18px 16px 26px;min-height:600px}.progress{display:flex;gap:5px;margin-bottom:18px}.progress span{height:7px;background:#d9d1b5;flex:1}.progress span.on{background:var(--orange)}.stephead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:15px}.stephead h2{font-size:25px;line-height:1.2;margin:0;font-weight:900}.stepno{font-size:14px;font-weight:800;color:var(--muted);white-space:nowrap}.date-note{border-left:5px solid var(--green);padding:8px 10px;margin-bottom:14px;background:#e5f2e8;font-weight:700}.products{display:grid;gap:12px}.product{border:2px solid var(--line);background:var(--white);padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;cursor:pointer;min-height:92px}.product.selected{background:#fff0b2;box-shadow:var(--shadow);transform:translate(-2px,-2px)}.product.sold{opacity:.55;background:#e9e5d6;cursor:not-allowed}.product h3{margin:0 0 3px;font-size:19px}.price{font-weight:900;color:var(--orange)}.stock{font-size:14px;font-weight:700;color:var(--green)}.soldtag{background:var(--ink);color:#fff;padding:5px 8px;font-size:14px;font-weight:800}.fake-check{width:28px;height:28px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900}.selected .fake-check{background:var(--ink);color:#fff}.actions{display:grid;grid-template-columns:1fr 1.7fr;gap:10px;margin-top:22px}.actions.single{grid-template-columns:1fr}.btn{border:2px solid var(--line);min-height:50px;padding:10px 14px;background:#fff;font-weight:900;cursor:pointer;color:var(--ink)}.btn.primary{background:var(--orange);color:#fff;box-shadow:var(--shadow)}.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}.qtyrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:2px dashed #b9b09a}.qty{display:flex;align-items:center;border:2px solid var(--line)}.qty button{width:44px;height:44px;border:0;background:#fff;font-size:22px;font-weight:900}.qty strong{width:42px;text-align:center}.options{margin-top:18px}.options h3{font-size:18px;margin:0 0 10px}.checkline{display:flex;align-items:center;gap:10px;min-height:48px;border:2px solid var(--line);padding:8px 12px;margin-bottom:9px;background:#fff;cursor:pointer}.checkline input{width:20px;height:20px;accent-color:var(--orange)}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.timebtn{min-height:56px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer}.timebtn small{display:block;font-size:12px;color:var(--green)}.timebtn.selected{background:var(--green);color:#fff}.timebtn.selected small{color:#d8f3e6}.timebtn:disabled{background:#ddd7c5;color:#827c6c;text-decoration:line-through}.field{margin-bottom:15px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;min-height:50px;border:2px solid var(--line);background:#fff;padding:11px 12px;border-radius:0;color:var(--ink)}.field textarea{min-height:92px;resize:vertical}.hint{font-size:14px;color:var(--muted);margin-top:5px}.review{border:2px solid var(--line);background:#fff;padding:15px;box-shadow:var(--shadow)}.review dl{margin:0}.review div{display:grid;grid-template-columns:92px 1fr;padding:8px 0;border-bottom:1px dashed #aaa28b}.review div:last-child{border:0}.review dt{font-weight:800}.review dd{margin:0}.success{text-align:center}.ticket{border:3px solid var(--line);background:#fff;padding:20px 16px;margin:14px 0 18px;position:relative;box-shadow:7px 7px 0 var(--yellow)}.ticket:before,.ticket:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--paper);top:48%;border:2px solid var(--line)}.ticket:before{left:-12px}.ticket:after{right:-12px}.ticket .number{font-size:52px;font-weight:900;line-height:1;color:var(--orange);margin:8px 0}.ticket .picktime{font-size:22px;font-weight:900}.success h2{font-size:29px;margin:0}.success .say{font-size:20px;font-weight:900;background:var(--green);color:white;padding:13px}.ownerhero{padding:22px 16px;background:var(--ink);color:#fff;border-bottom:6px solid var(--yellow)}.ownerhero h1{font-size:28px;margin:3px 0}.ownerhero p{margin:0;color:#e8dfc5}.owner{padding:18px 14px}.owner h2{font-size:21px;margin:0 0 12px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:22px}.stat{border:2px solid var(--line);background:#fff;padding:12px}.stat strong{font-size:28px;display:block}.demo{display:inline-block;font-size:12px;padding:2px 6px;background:var(--yellow);font-weight:800}.orders{display:grid;gap:10px;margin-bottom:24px}.order{display:grid;grid-template-columns:67px 1fr;border:2px solid var(--line);background:#fff}.ordertime{display:grid;place-items:center;background:var(--yellow);font-size:18px;font-weight:900;border-right:2px solid var(--line)}.orderbody{padding:10px 11px}.orderbody strong{display:block}.orderbody small{font-size:13px;color:var(--muted)}.inventory{display:grid;gap:9px;margin-bottom:25px}.inv{border:2px solid var(--line);padding:11px;background:#fff}.invtop{display:flex;justify-content:space-between;font-weight:800}.bar{height:8px;background:#ddd5bd;margin-top:8px}.bar i{display:block;height:100%;background:var(--green)}.toggles{display:grid;gap:8px}.toggleline{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);padding:10px 12px;background:#fff}.toggle{position:relative;width:58px;height:34px;border:2px solid var(--line);background:#d9d2bd;cursor:pointer}.toggle i{position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border:2px solid var(--line);transition:.18s}.toggle.on{background:var(--orange)}.toggle.on i{left:27px}.footer{position:absolute;bottom:0;left:0;right:0;border-top:2px solid var(--line);padding:15px 16px 18px;background:var(--yellow);text-align:center}.footer p{font-size:12px;margin:0 0 9px}.footer .cta{display:flex;align-items:center;justify-content:center;min-height:48px;background:var(--ink);color:#fff;text-decoration:none;font-weight:900;padding:8px}.footer .brand{display:inline-block;margin-top:8px;color:var(--ink);font-size:14px;font-weight:800}.hidden{display:none!important}@media(min-width:481px){body{border-left:1px solid #d2cab2;border-right:1px solid #d2cab2}.shell{box-shadow:0 0 40px rgba(33,31,26,.12)}}
  </style>
</head>
<body>
<div class="shell">
  <header class="modebar"><nav class="switcher" aria-label="切換瀏覽身分"><button class="active" data-mode="guest">客人看到的</button><button data-mode="owner">老闆看到的</button></nav></header>
  <section id="guestView">
    <div class="masthead"><div class="eyebrow">早餐先留・到店就拿</div><h1>巷口早點</h1><p>明天早上 06:30–10:30 取餐</p></div>
    <div class="problem"><strong>不用再留言「＋1」等回覆</strong>品項、數量、取餐順序一次排好，老闆不漏單，你也不用站著等。</div>
    <main class="main" id="guestMain"></main>
  </section>
  <section id="ownerView" class="hidden">
    <div class="ownerhero"><div class="eyebrow">巷口早點・店內工作台</div><h1>明早出餐不打結</h1><p>預留單依時間排好，客製要求不再散落聊天訊息。</p></div>
    <main class="owner" id="ownerMain"></main>
  </section>
  <footer class="footer"><p>這是創巢數位做的示範頁，店名與內容都是虛構的</p><a class="cta" href="#">想要你店裡也有一個？留 Email 等上線 →</a><a class="brand" href="#">創巢數位</a></footer>
</div>
<script>
(() => {
  const products=[
    {id:'egg',name:'招牌粉漿蛋餅',price:45,stock:18,desc:'外酥裡嫩，九層塔醬油膏'},
    {id:'rice',name:'古早味飯糰',price:50,stock:9,desc:'菜脯、肉鬆、油條、滷蛋'},
    {id:'cake',name:'煎蘿蔔糕',price:40,stock:0,desc:'兩片，附蒜蓉醬油'},
    {id:'soy',name:'非基改豆漿',price:25,stock:14,desc:'冷飲，微糖'}
  ];
  const state={step:1,product:'',qty:1,noScallion:false,sauceAside:false,time:'',name:'',last3:'',number:'A037',sold:{cake:true}};
  const guestMain=document.querySelector('#guestMain'), ownerMain=document.querySelector('#ownerMain');
  const fmtDate=()=>new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'short'}).format(new Date(Date.now()+864e5));
  function times(){const out=[];for(let m=390;m<=630;m+=15){const h=Math.floor(m/60),mm=String(m%60).padStart(2,'0'),label=`${h}:${mm}`;out.push({label,left:([420,465,510,570].includes(m)?0:((m/15)%4===0?2:5))})}return out}
  function prog(){return `<div class="progress">${[1,2,3,4,5].map(n=>`<span class="${state.step>=n?'on':''}"></span>`).join('')}</div>`}
  function selectedProduct(){return products.find(p=>p.id===state.product)}
  function renderGuest(){let h=prog();
    if(state.step===1)h+=`<div class="stephead"><h2>明天早餐想吃什麼？</h2><span class="stepno">步驟 1／5</span></div><div class="date-note">${fmtDate()}・剩餘份數即時顯示</div><div class="products">${products.map(p=>{const sold=state.sold[p.id]||p.stock===0;return `<button class="product ${state.product===p.id?'selected':''} ${sold?'sold':''}" data-product="${p.id}" ${sold?'disabled':''}><span><h3>${p.name}</h3><span class="price">$${p.price}</span>・<span class="stock">${sold?'已售完':`剩 ${p.stock} 份`}</span><br><small>${p.desc}</small></span>${sold?'<span class="soldtag">已售完</span>':`<span class="fake-check">${state.product===p.id?'✓':''}</span>`}</button>`}).join('')}</div><div class="actions single"><button class="btn primary" data-next ${!state.product?'disabled':''}>選好了，調整份數</button></div>`;
    if(state.step===2){const p=selectedProduct();h+=`<div class="stephead"><h2>份數與客製</h2><span class="stepno">步驟 2／5</span></div><div class="review"><strong>${p.name}</strong><span class="price" style="float:right">$${p.price*state.qty}</span><div class="qtyrow"><span>數量</span><span class="qty"><button data-qty="-1" aria-label="減少一份">−</button><strong>${state.qty}</strong><button data-qty="1" aria-label="增加一份">＋</button></span></div><div class="options"><h3>要怎麼做？</h3><label class="checkline"><input type="checkbox" data-option="noScallion" ${state.noScallion?'checked':''}>不要蔥</label><label class="checkline"><input type="checkbox" data-option="sauceAside" ${state.sauceAside?'checked':''}>辣醬另外放</label></div></div>${actions('回去選品項','選取餐時間')}`}
    if(state.step===3)h+=`<div class="stephead"><h2>幾點來拿？</h2><span class="stepno">步驟 3／5</span></div><div class="date-note">每 15 分鐘限量，讓現場不用久等</div><div class="times">${times().map(t=>`<button class="timebtn ${state.time===t.label?'selected':''}" data-time="${t.label}" ${t.left===0?'disabled':''}>${t.label}<small>${t.left===0?'已滿':`還可收 ${t.left} 單`}</small></button>`).join('')}</div>${actions('回上一步','填取餐資料',!state.time)}`;
    if(state.step===4)h+=`<div class="stephead"><h2>取餐資料</h2><span class="stepno">步驟 4／5</span></div><div class="field"><label for="guestName">怎麼稱呼你？</label><input id="guestName" value="${esc(state.name)}" placeholder="例如：陳小姐" autocomplete="name"></div><div class="field"><label for="last3">手機末三碼</label><input id="last3" value="${esc(state.last3)}" maxlength="3" inputmode="numeric" placeholder="例如：168"><div class="hint">到店核對用，不需要留下完整號碼。</div></div>${actions('回上一步','確認預留',!(state.name.trim()&&/^\d{3}$/.test(state.last3)))}`;
    if(state.step===5){const p=selectedProduct(),custom=[state.noScallion?'不要蔥':'',state.sauceAside?'辣醬另外放':''].filter(Boolean).join('、')||'照店家原味';h+=`<div class="stephead"><h2>確認這張預留單</h2><span class="stepno">步驟 5／5</span></div><div class="review"><dl><div><dt>餐點</dt><dd>${p.name} × ${state.qty}</dd></div><div><dt>客製</dt><dd>${custom}</dd></div><div><dt>取餐時間</dt><dd>${fmtDate()} ${state.time}</dd></div><div><dt>取餐人</dt><dd>${esc(state.name)}・手機末三碼 ${state.last3}</dd></div><div><dt>合計</dt><dd><strong>$${p.price*state.qty}</strong>・到店付款</dd></div></dl></div>${actions('回上一步','送出預留單')}`}
    if(state.step===6)h=`<div class="success"><h2>預留完成！</h2><p>餐點會照取餐時間準備</p><div class="ticket"><small>明天取餐編號</small><div class="number">${state.number}</div><div class="picktime">${state.time} 取餐</div></div><div class="say">到店報編號就好</div><p>請在預定時間前後 10 分鐘內取餐，餐點最好吃。</p><div class="actions single"><button class="btn" data-reset>再示範一次</button></div></div>`;
    guestMain.innerHTML=h;bindGuest();
  }
  function actions(back,next,disabled=false){return `<div class="actions"><button class="btn" data-back>${back}</button><button class="btn primary" data-next ${disabled?'disabled':''}>${next}</button></div>`}
  function bindGuest(){document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{state.product=b.dataset.product;state.qty=1;renderGuest()});document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{state.time=b.dataset.time;renderGuest()});document.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{const p=selectedProduct();state.qty=Math.max(1,Math.min(p.stock,state.qty+Number(b.dataset.qty)));renderGuest()});document.querySelectorAll('[data-option]').forEach(i=>i.onchange=()=>{state[i.dataset.option]=i.checked});const name=document.querySelector('#guestName'),last=document.querySelector('#last3');if(name)name.oninput=()=>{state.name=name.value;toggleNext()};if(last)last.oninput=()=>{last.value=last.value.replace(/\D/g,'').slice(0,3);state.last3=last.value;toggleNext()};document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{state.step++;renderGuest();scrollTop()});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{state.step--;renderGuest();scrollTop()});const reset=document.querySelector('[data-reset]');if(reset)reset.onclick=()=>{Object.assign(state,{step:1,product:'',qty:1,noScallion:false,sauceAside:false,time:'',name:'',last3:''});renderGuest();scrollTop()}}
  function toggleNext(){const b=document.querySelector('[data-next]');if(b)b.disabled=!(state.name.trim()&&/^\d{3}$/.test(state.last3))}
  function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function renderOwner(){const demoOrders=[['06:45','A012','飯糰 × 2','不要蔥'],['07:15','A019','粉漿蛋餅 × 1、豆漿 × 1','辣醬另外放'],['07:30','A023','粉漿蛋餅 × 2','照店家原味'],['08:15','A031','飯糰 × 1、蘿蔔糕 × 1','不要蔥']];ownerMain.innerHTML=`<div class="statgrid"><div class="stat"><span class="demo">示範數據</span><strong>27</strong>明天預留份數</div><div class="stat"><span class="demo">示範數據</span><strong>11</strong>張取餐單</div></div><h2>依取餐時間排序的出餐單</h2><div class="orders">${demoOrders.map(o=>`<div class="order"><div class="ordertime">${o[0]}</div><div class="orderbody"><strong>${o[1]}・${o[2]}</strong><small>${o[3]}</small></div></div>`).join('')}</div><h2>品項預留與剩餘 <span class="demo">示範數據</span></h2><div class="inventory">${products.map((p,i)=>{const reserved=[12,7,10,8][i],remain=state.sold[p.id]?0:Math.max(0,p.stock);return `<div class="inv"><div class="invtop"><span>${p.name}</span><span>預留 ${reserved}・剩 ${remain}</span></div><div class="bar"><i style="width:${Math.min(100,reserved/(reserved+remain||1)*100)}%"></i></div></div>`}).join('')}</div><h2>明天完售開關</h2><div class="toggles">${products.map(p=>`<div class="toggleline"><strong>${p.name}</strong><button class="toggle ${state.sold[p.id]?'on':''}" data-sold="${p.id}" aria-label="切換${p.name}完售狀態" aria-pressed="${state.sold[p.id]?'true':'false'}"><i></i></button></div>`).join('')}</div>`;document.querySelectorAll('[data-sold]').forEach(b=>b.onclick=()=>{state.sold[b.dataset.sold]=!state.sold[b.dataset.sold];if(state.sold[state.product])state.product='';renderOwner();renderGuest()})}
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#guestView').classList.toggle('hidden',b.dataset.mode!=='guest');document.querySelector('#ownerView').classList.toggle('hidden',b.dataset.mode!=='owner');if(b.dataset.mode==='owner')renderOwner();scrollTop()});
  renderGuest();renderOwner();
})();
</script>
</body>
</html>
