<!-- NEST-VERSION: 2026-09-15-v1 -->
<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日日茶舖｜預點取餐示範</title><meta name="description" content="日日茶舖手機預點取餐，甜度冰塊不再抄錯。"><meta property="og:title" content="日日茶舖｜預點取餐"><meta property="og:description" content="先點好，到店報號碼直接拿。"><meta name="robots" content="noindex"><meta name="nest-version" content="2026-09-15-v1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--red:#ed3b22;--yellow:#ffd84a;--ink:#171717;--cream:#fff9df}*{box-sizing:border-box}body{margin:0;background:#222;font-family:'Noto Sans TC',sans-serif;color:var(--ink);font-size:16px}.app{max-width:480px;min-height:100vh;margin:auto;background:var(--cream);overflow:hidden}.switch{position:sticky;top:0;z-index:5;display:flex;padding:8px;background:#171717;gap:8px}.switch button{flex:1;min-height:44px;border:2px solid white;background:transparent;color:white;font:800 14px inherit}.switch .on{background:var(--yellow);color:#111;border-color:var(--yellow)}header{padding:24px 18px 18px;background:var(--yellow);border-bottom:5px solid #111}header h1{font-size:clamp(28px,9vw,40px);line-height:1.1;margin:4px 0;text-wrap:balance}header p{margin:8px 0 0;font-weight:600}.ticker{background:var(--red);color:white;padding:9px 18px;font-weight:800}.content{padding:20px 16px 34px}.steps{font-weight:800;font-size:14px;margin-bottom:14px}.card{border:3px solid #111;background:white;box-shadow:5px 5px 0 #111;padding:14px}.grid{display:grid;gap:10px}.drink{min-height:70px;background:white;border:2px solid #111;padding:12px;text-align:left;font:600 16px inherit;display:flex;justify-content:space-between}.drink.on{background:var(--yellow);box-shadow:4px 4px 0 #111}.price{font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:44px;padding:8px 13px;border:2px solid #111;background:white;font:600 14px inherit}.chip.on{background:#111;color:white}.row{margin-bottom:22px}.row h3,h2{margin:0 0 10px}h2{font-size:24px;text-wrap:balance}.nav{display:flex;gap:10px;margin-top:22px}.btn{min-height:50px;border:2px solid #111;padding:10px 14px;font:800 16px inherit;background:white}.next{flex:1;background:var(--red);color:white}.btn:disabled,.drink:disabled{opacity:.45}.qty{display:flex;align-items:center;justify-content:center;gap:20px}.qty button{width:48px;height:48px;border:2px solid #111;background:var(--yellow);font-size:24px}.qty strong{font-size:28px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{min-height:54px;border:2px solid #111;background:white;font:700 14px inherit}.slot.on{background:var(--yellow)}.slot:disabled{background:#ddd;color:#777}.fields{display:grid;gap:12px}.fields input{width:100%;height:48px;border:2px solid #111;padding:10px;font:16px inherit;margin-top:5px}.summary{border:3px solid #111;background:white;padding:15px}.summary p{margin:7px 0}.number{font-size:54px;font-weight:800;letter-spacing:.06em}.success{text-align:center;background:var(--yellow);border:3px solid #111;padding:18px}.footer{background:#171717;color:white;text-align:center;padding:24px 16px 36px;font-size:13px}.footer .cta{display:block;background:var(--yellow);color:#111;min-height:48px;padding:13px;margin:12px 0;text-decoration:none;font-weight:800}.footer a{color:white}.order{background:white;border:2px solid #111;margin-bottom:10px;padding:12px}.order b{font-size:18px}.meter{height:12px;border:2px solid #111;margin-top:6px}.meter i{display:block;height:100%;background:var(--red)}.toggle{width:100%;min-height:54px;border:3px solid #111;background:#fff;font:800 16px inherit}.toggle.stop{background:var(--red);color:white}@media(max-width:374px){header h1{font-size:27px}.content{padding-left:12px;padding-right:12px}}
</style></head><body><main class="app"><nav class="switch"><button class="on" data-v="g">客人看到的</button><button data-v="o">老闆看到的</button></nav><div id="screen"></div><footer class="footer"><div>這是創巢數位做的示範頁，店名與內容都是虛構的</div><a class="cta" href="#">想要你店裡也有一個？留 Email 等上線 →</a><a href="#">創巢數位</a></footer></main><script>
const S={step:0,drink:'',price:0,sugar:'',ice:'',toppings:[],qty:1,time:'',name:'',last3:'',paused:false};const menu=[['日煮紅茶',45],['焙香烏龍',50],['冬瓜青茶',50],['黑糖珍珠鮮奶',65],['柚香翡翠',60],['抹茶鮮奶',70]];const $=s=>document.querySelector(s),screen=$('#screen');
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('on',x===b));b.dataset.v==='o'?owner():render()});
function pickup(){let n=new Date(),tom=n.getHours()>21||(n.getHours()===21&&n.getMinutes()>10),d=new Date(n);if(tom){d.setDate(d.getDate()+1);d.setHours(10,0,0,0)}else{d.setMinutes(d.getMinutes()+20);d.setSeconds(0,0);d.setMinutes(Math.ceil(d.getMinutes()/10)*10)}let arr=[];while(d.getHours()<21||(d.getHours()===21&&d.getMinutes()<=30)){arr.push({label:`${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`,full:(d.getHours()*6+d.getMinutes()/10)%7===0});d=new Date(d.getTime()+600000)}return{arr,tom}}
function head(){let p=pickup();return `<header><small>日日茶舖・預點取餐</small><h1>先點好，少排一下</h1><p>甜度、冰塊、加料一次寫清楚。</p></header><div class="ticker">${S.paused?'目前暫停接單':p.tom?'今天已打烊，預點明天':'今日營業至 21:30・最快 20 分鐘後取餐'}</div>`}
function nav(ok=true,l='下一步'){return `<div class="nav">${S.step?'<button class="btn" onclick="S.step--;render()">上一步</button>':''}<button class="btn next" ${ok?'':'disabled'} onclick="S.step++;render()">${l}</button></div>`}function choose(k,v){S[k]=v;render()}function render(){if(S.paused){screen.innerHTML=head()+`<div class="content"><div class="success"><h2>目前暫停接單</h2><p>現場製作量較大，請稍後再回來看看。</p></div></div>`;return}let b='';if(S.step===0)b=`<h2>今天想喝什麼？</h2><div class="grid">${menu.map(x=>`<button class="drink ${S.drink===x[0]?'on':''}" onclick="S.drink='${x[0]}';S.price=${x[1]};render()"><span>${x[0]}<small style="display:block">現泡茶湯</small></span><span class="price">$${x[1]}</span></button>`).join('')}</div>${nav(!!S.drink)}`;
if(S.step===1)b=`<div class="row"><h2>甜度與冰塊</h2><h3>甜度</h3><div class="chips">${['正常','少糖','半糖','微糖','無糖'].map(x=>`<button class="chip ${S.sugar===x?'on':''}" onclick="choose('sugar','${x}')">${x}</button>`).join('')}</div></div><div class="row"><h3>冰塊</h3><div class="chips">${['正常','少冰','微冰','去冰','熱'].map(x=>`<button class="chip ${S.ice===x?'on':''}" onclick="choose('ice','${x}')">${x}</button>`).join('')}</div></div>${nav(S.sugar&&S.ice)}`;
if(S.step===2)b=`<h2>要加料嗎？</h2><p>可以複選，也可以都不加。</p><div class="chips">${['珍珠','椰果'].map(x=>`<button class="chip ${S.toppings.includes(x)?'on':''}" onclick="S.toppings=S.toppings.includes('${x}')?S.toppings.filter(t=>t!=='${x}'):[...S.toppings,'${x}'];render()">${x} +10</button>`).join('')}</div>${nav(true)}`;
if(S.step===3)b=`<h2>要幾杯？</h2><div class="card qty"><button onclick="S.qty=Math.max(1,S.qty-1);render()">−</button><strong>${S.qty} 杯</strong><button onclick="S.qty=Math.min(10,S.qty+1);render()">＋</button></div>${nav()}`;
if(S.step===4){let p=pickup();b=`<h2>選取餐時間</h2><p>${p.tom?'明天':'今天'}，每個時段限量 12 杯</p><div class="slots">${p.arr.map((x,i)=>`<button class="slot ${S.time===x.label?'on':''}" ${x.full?'disabled':''} onclick="choose('time','${x.label}')">${x.label}${x.full?'<br>已滿':''}</button>`).join('')}</div>${nav(!!S.time)}`}
if(S.step===5)b=`<h2>取餐資料</h2><div class="fields"><label>稱呼<input id="n" value="${S.name}" placeholder="例如：林小姐"></label><label>手機末三碼<input id="p" inputmode="numeric" maxlength="3" value="${S.last3}" placeholder="例如：168"></label></div><div class="nav"><button class="btn" onclick="S.step--;render()">上一步</button><button class="btn next" onclick="S.name=$('#n').value;S.last3=$('#p').value;if(S.name&&/^\\d{3}$/.test(S.last3)){S.step++;render()}else document.querySelector('h2').textContent='請填稱呼與手機末三碼'">送出預點</button></div>`;
if(S.step===6)b=`<div class="success"><div>取餐號碼</div><div class="number">A${(137+S.qty).toString()}</div><h2>${pickup().tom?'明天':'今天'} ${S.time}</h2><p>到店報號碼直接拿</p></div><br>${sum()}`;screen.innerHTML=head()+`<div class="content"><div class="steps">${S.step<6?`第 ${S.step+1} 步／共 6 步`:''}</div>${b}</div>`}
function sum(){return `<div class="summary"><p><b>${S.drink} × ${S.qty}</b></p><p>${S.sugar}・${S.ice}・${S.toppings.join('、')||'不加料'}</p><p>取餐：${S.time}</p><p><b>合計 $${(S.price+S.toppings.length*10)*S.qty}</b></p></div>`}
function owner(){screen.innerHTML=head()+`<div class="content"><button class="toggle ${S.paused?'stop':''}" onclick="S.paused=!S.paused;owner()">${S.paused?'恢復接單':'暫停接單'}・目前${S.paused?'暫停':'接單中'}</button><h2 style="margin-top:24px">各時段已接杯數 <small>示範數據</small></h2>${[['18:10',8],['18:20',12],['18:30',6]].map(x=>`<div class="card" style="margin-bottom:10px"><b>${x[0]}・${x[1]}／12 杯</b><div class="meter"><i style="width:${x[1]/12*100}%"></i></div></div>`).join('')}<h2 style="margin-top:24px">依取餐時間製作</h2>${[['18:10','A132','黑糖珍珠鮮奶 × 2','微糖・少冰・珍珠'],['18:10','A133','柚香翡翠 × 1','無糖・微冰・椰果'],['18:20','A134','日煮紅茶 × 3','半糖・去冰・不加料']].map(x=>`<div class="order"><b>${x[0]}　${x[1]}</b><div>${x[2]}</div><div>${x[3]}</div></div>`).join('')}</div>`}render();
</script></body></html>
