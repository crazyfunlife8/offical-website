<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>青苔指甲｜中壢預約示範</title><meta name="description" content="青苔指甲單人美甲工作室預約示範，線上選服務、時段並確認訂金規則。"><meta property="og:title" content="青苔指甲｜把喜歡留在指尖"><meta property="og:description" content="中壢一人美甲工作室，立即體驗完整預約流程。"><meta name="robots" content="noindex"><meta name="nest-version" content="2026-09-15-v1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#24352d;--moss:#486554;--pale:#edf1e8;--cream:#fbf8f0;--line:#d8ded2;--rust:#a4563b}*{box-sizing:border-box}html{background:#dfe5dd}body{margin:0;color:var(--ink);font:15px/1.65 'Noto Sans TC',sans-serif;background:var(--cream);max-width:480px;min-height:100vh;margin:auto;overflow-x:hidden;padding:76px 0 150px}.switch{position:fixed;z-index:20;top:0;left:50%;transform:translateX(-50%);width:min(480px,100%);padding:12px 18px;background:rgba(251,248,240,.94);backdrop-filter:blur(10px);display:flex;gap:5px;border-bottom:1px solid var(--line)}.switch button{flex:1;height:48px;border:0;background:transparent;border-radius:7px;color:#68736d;font:600 15px inherit}.switch .on{background:var(--ink);color:#fff}.hero{padding:24px 22px 28px;position:relative;border-bottom:1px solid var(--line)}.hero:after{content:'✦';position:absolute;right:25px;top:20px;color:#79917f;font-size:34px}.eyebrow{letter-spacing:.18em;font-size:12px;color:var(--moss);font-weight:700}.hero h1{font:700 34px/1.2 'Noto Serif TC',serif;margin:8px 0}.hero p{margin:4px 0;color:#647069}.section{padding:22px}.progress{display:flex;gap:5px;margin-bottom:22px}.progress i{height:4px;flex:1;background:#dfe4dc;border-radius:2px}.progress i.done{background:var(--moss)}h2{font:700 25px/1.35 'Noto Serif TC',serif;margin:0 0 5px}.hint{color:#6c7771;margin:0 0 18px}.options{display:grid;gap:10px}.option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fffdf8;padding:16px;border-radius:6px;min-height:74px;color:var(--ink);font:inherit}.option strong{font-size:17px;display:block}.option span{color:#69746e}.option.selected{border:2px solid var(--moss);background:var(--pale);padding:15px}.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.date{border:1px solid var(--line);background:#fff;padding:8px 3px;min-height:65px;border-radius:5px;color:var(--ink)}.date b,.date small{display:block}.date.selected{background:var(--moss);color:white}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.time{height:48px;border:1px solid var(--line);background:#fff;border-radius:5px;color:var(--ink)}.time.selected{background:var(--ink);color:#fff}.time:disabled{color:#9d9d99;background:#ecece8;text-decoration:line-through}.fields{display:grid;gap:14px}label{font-weight:600}input[type=text],input[type=tel]{width:100%;height:50px;margin-top:6px;border:1px solid #bfc8bf;border-radius:5px;padding:0 13px;font:16px inherit;background:#fff}.rule{background:#fff;border-left:4px solid var(--rust);padding:16px;margin:16px 0}.check{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);padding:14px;background:#fff}.check input{width:21px;height:21px;accent-color:var(--moss)}.actions{display:flex;gap:10px;margin-top:24px}.actions button,.primary{height:52px;border:0;border-radius:6px;font:700 16px inherit}.back{width:92px;background:#e5e7e1;color:var(--ink)}.next,.primary{flex:1;background:var(--moss);color:white}.next:disabled{opacity:.4}.summary{border:1px solid var(--line);background:white;padding:18px}.summary dl{margin:0;display:grid;grid-template-columns:88px 1fr;gap:9px}.summary dt{color:#788078}.summary dd{margin:0;font-weight:600}.success{text-align:center;padding:8px 0}.seal{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:10px auto 18px;background:var(--moss);color:white;font-size:34px}.notice{background:#e7eee5;padding:15px;margin-top:18px;border-radius:6px}.owner{padding:20px}.owner-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.owner-title h1{font:700 27px 'Noto Serif TC';margin:0}.badge{background:#e2e9df;padding:4px 8px;font-size:12px}.stat{background:var(--ink);color:#fff;padding:20px;margin:16px 0}.stat-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}.stat strong{font-size:29px;display:block}.arrow{font-size:24px;color:#9fb6a6}.listbox{border-top:1px solid var(--line);margin-top:18px}.booking{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:15px 0;border-bottom:1px solid var(--line);align-items:center}.booking time{font-weight:700}.status{font-size:12px;padding:3px 7px;background:#dce9dc;color:#31583c}.status.wait{background:#eee4d2;color:#795a26}.gaps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.gap{background:#edf1e8;padding:10px 5px;text-align:center}.gap b{display:block}.foot{position:fixed;bottom:0;z-index:19;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fffdf8;border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));text-align:center}.foot small{display:block;font-size:11px;line-height:1.3}.foot-row{display:flex;align-items:center;gap:10px;margin-top:7px}.foot a{color:var(--moss)}.foot .cta{flex:1;display:grid;place-items:center;min-height:44px;background:var(--rust);color:white;text-decoration:none;border-radius:5px;font-weight:700;font-size:13px}@media(max-width:360px){.section{padding:18px}.dates{grid-template-columns:repeat(4,1fr)}}

/* 2026-09-15 修正：頁尾跟在內容最後、大標題平均斷行 */
body{padding-bottom:0!important}
footer,.footer{position:static!important;inset:auto!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;width:auto!important;max-width:none!important;box-shadow:none!important;margin-top:28px!important}
h1,h2{text-wrap:balance}
</style></head><body><nav class="switch" aria-label="頁面模式"><button class="on" data-mode="guest">客人看到的</button><button data-mode="owner">老闆看到的</button></nav><main id="app"></main><footer class="foot"><small>這是創巢數位做的示範頁，店名與內容都是虛構的</small><div class="foot-row"><a href="#">創巢數位</a><a class="cta" href="#">想要你店裡也有一個？留 Email 等上線 →</a></div></footer><script>
const services=[{name:'單色凝膠',price:'NT$ 800',mins:90},{name:'造型設計',price:'NT$ 1,200 起',mins:120},{name:'卸甲',price:'NT$ 300',mins:40}];const state={step:0,service:null,date:null,time:null,name:'',phone:'',agreed:false};
const app=document.querySelector('#app');const days=['日','一','二','三','四','五','六'];function dateList(){return Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i+1);return{iso:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,label:i===0?'明天':`${d.getMonth()+1}/${d.getDate()}`,week:`週${days[d.getDay()]}`}})}function hero(){return`<header class="hero"><div class="eyebrow">桃園中壢・一人工作室</div><h1>青苔指甲</h1><p>慢慢挑一款，留一段只給自己的時間。</p></header>`}function progress(){return`<div class="progress">${[0,1,2,3,4,5].map(n=>`<i class="${n<=state.step?'done':''}"></i>`).join('')}</div>`}function act(next=true){return`<div class="actions">${state.step?'<button class="back" onclick="back()">上一步</button>':''}${next?'<button class="next" onclick="next()">繼續</button>':''}</div>`}
function renderGuest(){let c='';if(state.step===0)c=`<h2>今天想做什麼？</h2><p class="hint">費用與預估時間都先寫清楚。</p><div class="options">${services.map((s,i)=>`<button class="option ${state.service===i?'selected':''}" onclick="pickService(${i})"><strong>${s.name}・${s.price}</strong><span>預留 ${s.mins} 分鐘</span></button>`).join('')}</div>${act()}`;if(state.step===1)c=`<h2>選一個方便的時間</h2><p class="hint">灰色時段已經有人預約囉。</p><div class="dates">${dateList().map(d=>`<button class="date ${state.date===d.iso?'selected':''}" onclick="pickDate('${d.iso}')"><small>${d.week}</small><b>${d.label}</b></button>`).join('')}</div><div class="times">${['10:00','13:30','16:00','19:00'].map((t,i)=>`<button class="time ${state.time===t?'selected':''}" ${i===2||((state.date||'').slice(-1)%2===0&&i===0)?'disabled':''} onclick="pickTime('${t}')">${i===2?'已滿':t}</button>`).join('')}</div>${act()}`;if(state.step===2)c=`<h2>怎麼稱呼你？</h2><p class="hint">只用來確認這次預約。</p><div class="fields"><label>稱呼<input type="text" maxlength="20" placeholder="例如：小庭" value="${state.name}" oninput="state.name=this.value"></label><label>手機號碼<input type="tel" inputmode="tel" maxlength="10" placeholder="09xxxxxxxx" value="${state.phone}" oninput="state.phone=this.value"></label></div>${act()}`;if(state.step===3)c=`<h2>改期與取消規則</h2><p class="hint">彼此保留時間，預約前請先讀完。</p><div class="rule"><b>預約前 24 小時</b><br>可免費改期一次。當天取消或未到，訂金恕不退還。</div><label class="check"><input type="checkbox" ${state.agreed?'checked':''} onchange="state.agreed=this.checked;renderGuest()"><span>我知道了，並同意以上規則</span></label>${act()}`;if(state.step===4)c=`<h2>確認預約內容</h2><p class="hint">這是示範，不會真的扣款。</p>${summary()}<div class="actions"><button class="back" onclick="back()">上一步</button><button class="next" onclick="next()">付訂金 NT$ 300<br><small>（示範，不會扣款）</small></button></div>`;if(state.step===5)c=`<div class="success"><div class="seal">✓</div><h2>預約完成</h2><p>你的指尖時間已經留好了。</p></div>${summary()}<div class="notice"><b>不用怕忘記</b><br>前一天晚上 8 點會傳 LINE 提醒你。</div><button class="primary" style="width:100%;margin-top:18px" onclick="resetFlow()">再走一次示範</button>`;app.innerHTML=hero()+`<section class="section">${progress()}${c}</section>`}
function summary(){let s=services[state.service]||services[0],d=dateList().find(x=>x.iso===state.date);return`<div class="summary"><dl><dt>服務</dt><dd>${s.name}</dd><dt>時間</dt><dd>${d?d.label+' '+d.week:''} ${state.time||''}</dd><dt>預估</dt><dd>${s.mins} 分鐘</dd><dt>稱呼</dt><dd>${state.name||'小庭'}</dd><dt>訂金</dt><dd>NT$ 300</dd></dl></div>`}function next(){if(state.step===0&&state.service===null)return;if(state.step===1&&(!state.date||!state.time))return;if(state.step===2&&(!state.name.trim()||!/^09\d{8}$/.test(state.phone)))return;if(state.step===3&&!state.agreed)return;state.step++;renderGuest();scrollTo(0,0)}function back(){state.step--;renderGuest()}function pickService(i){state.service=i;renderGuest()}function pickDate(d){state.date=d;state.time=null;renderGuest()}function pickTime(t){state.time=t;renderGuest()}function resetFlow(){Object.assign(state,{step:0,service:null,date:null,time:null,name:'',phone:'',agreed:false});renderGuest()}
function renderOwner(){app.innerHTML=`<section class="owner"><div class="owner-title"><div><span class="eyebrow">青苔指甲・工作台</span><h1>預約小管家</h1></div><span class="badge">今天</span></div><h2>今天</h2><div class="listbox"><div class="booking"><time>10:00</time><div><b>小芸</b><br><small>單色凝膠・90 分</small></div><span class="status">訂金已付</span></div><div class="booking"><time>14:00</time><div><b>宜庭</b><br><small>造型設計・120 分</small></div><span class="status">訂金已付</span></div><div class="booking"><time>18:30</time><div><b>阿黎</b><br><small>卸甲・40 分</small></div><span class="status wait">待確認</span></div></div><h2 style="margin-top:24px">明天</h2><div class="listbox"><div class="booking"><time>13:30</time><div><b>珊珊</b><br><small>造型設計・120 分</small></div><span class="status">訂金已付</span></div><div class="booking"><time>19:00</time><div><b>王小姐</b><br><small>單色凝膠・90 分</small></div><span class="status wait">待確認</span></div></div><div class="stat"><small>放鳥次數・示範數據</small><div class="stat-grid"><div><strong>4 次</strong>上個月</div><div class="arrow">→</div><div><strong>0 次</strong>這個月</div></div></div><h2>本週空檔</h2><p class="hint">點開就能分享給臨時想約的客人。</p><div class="gaps"><div class="gap"><b>週三</b>16:00</div><div class="gap"><b>週四</b>10:00</div><div class="gap"><b>週五</b>19:00</div><div class="gap"><b>週六</b>13:30</div><div class="gap"><b>週日</b>10:00</div></div></section>`}
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button').forEach(x=>x.classList.remove('on'));b.classList.add('on');b.dataset.mode==='guest'?renderGuest():renderOwner();scrollTo(0,0)});renderGuest();
</script></body></html>
