<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>毛球澡堂｜寵物美容預約示範</title><meta name="description" content="毛球澡堂寵物美容預約示範，選擇毛孩體型、服務、接送與時段。"><meta property="og:title" content="毛球澡堂｜今天也要香噴噴"><meta property="og:description" content="毛孩洗澡美容，線上選時段與接送。"><meta name="robots" content="noindex"><meta name="nest-version" content="2026-09-15-v1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--blue:#196b78;--sky:#dff3f2;--yellow:#ffd56a;--navy:#193b44;--paper:#fffef9;--coral:#e9795d}*{box-sizing:border-box}html{background:#cfe2df}body{margin:0 auto;max-width:480px;min-height:100vh;background:var(--paper);color:var(--navy);font:15px/1.55 'Noto Sans TC',sans-serif;padding:76px 0 152px;overflow-x:hidden}.switch{position:fixed;z-index:10;top:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:76px;padding:12px 16px;display:flex;gap:8px;background:#fffef9f2;border-bottom:3px solid var(--navy)}button{font-family:inherit}.switch button{flex:1;border:2px solid var(--navy);border-radius:12px;background:#fff;height:48px;font-weight:800;color:var(--navy);box-shadow:3px 3px 0 var(--navy)}.switch .on{background:var(--yellow);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}.hero{background:var(--sky);padding:27px 20px 24px;border-bottom:3px solid var(--navy);position:relative}.bubbles{position:absolute;right:20px;top:18px;width:78px;height:58px;background:radial-gradient(circle at 15% 70%,#fff 0 8px,var(--navy) 9px 11px,transparent 12px),radial-gradient(circle at 55% 25%,#fff 0 12px,var(--navy) 13px 15px,transparent 16px),radial-gradient(circle at 85% 75%,#fff 0 7px,var(--navy) 8px 10px,transparent 11px)}.hero small{font-weight:800;color:var(--blue)}.hero h1{font-size:34px;line-height:1.1;margin:6px 0 8px}.hero p{margin:0;max-width:280px}.wrap{padding:22px 18px}.meter{display:flex;align-items:center;gap:8px;margin-bottom:18px}.meter span{width:28px;height:28px;border:2px solid var(--navy);border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--yellow)}.meter i{height:3px;background:var(--navy);flex:1}.meter small{font-weight:700}h2{font-size:24px;line-height:1.3;margin:0 0 5px}.sub{margin:0 0 17px;color:#587079}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{min-height:108px;border:2px solid var(--navy);background:white;border-radius:15px;padding:14px;text-align:left;color:var(--navy);box-shadow:4px 4px 0 var(--navy)}.tile.selected{background:var(--yellow);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--navy)}.tile .icon{font-size:25px}.tile b,.tile span{display:block}.tile b{font-size:17px}.service{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:75px;border:2px solid var(--navy);background:#fff;border-radius:14px;padding:13px;margin-bottom:11px;text-align:left;color:var(--navy)}.service.selected{background:var(--sky);box-shadow:4px 4px 0 var(--navy)}.service b{font-size:18px}.addon{display:flex;align-items:center;gap:11px;padding:15px;background:#fff4d2;border:2px dashed var(--navy);border-radius:13px}.addon input{width:22px;height:22px;accent-color:var(--blue)}.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.date,.time{min-height:57px;border:2px solid var(--navy);background:#fff;border-radius:11px;color:var(--navy)}.date.selected,.time.selected{background:var(--blue);color:white}.date small,.date b{display:block}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.time:disabled{background:#e5e5df;color:#999;border-color:#999}.choice{display:flex;gap:9px}.choice button{height:55px;flex:1;border:2px solid var(--navy);background:white;border-radius:13px;color:var(--navy);font-weight:700}.choice .selected{background:var(--yellow)}select{width:100%;height:52px;border:2px solid var(--navy);border-radius:10px;background:#fff;padding:0 12px;font:16px inherit;color:var(--navy);margin-top:14px}.actions{display:flex;gap:10px;margin-top:23px}.actions button,.wide{height:54px;border:2px solid var(--navy);border-radius:13px;font-weight:800;font-size:16px}.back{width:90px;background:#fff;color:var(--navy)}.next,.wide{flex:1;background:var(--coral);color:white;box-shadow:4px 4px 0 var(--navy)}.summary{border:2px solid var(--navy);border-radius:15px;overflow:hidden}.summary div{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px dashed #9aabad}.summary div:last-child{border:0;background:var(--sky)}.done{text-align:center}.done-icon{font-size:48px}.notice{margin-top:16px;padding:15px;background:var(--yellow);border:2px solid var(--navy);border-radius:15px;font-weight:700;text-align:center}.owner{padding:22px 18px}.owner-top{display:flex;justify-content:space-between;align-items:end}.owner-top h1{margin:0;font-size:29px}.demo{background:var(--yellow);border:2px solid var(--navy);padding:3px 8px;font-size:12px;font-weight:700}.schedule{position:relative;margin-top:20px}.job{display:grid;grid-template-columns:62px 1fr;gap:10px;margin-bottom:11px}.job time{font-weight:800;padding-top:13px}.job div{border:2px solid var(--navy);padding:12px;border-radius:12px;background:#fff}.job.pickup div{background:#fff0c4}.job span{float:right;font-size:12px;background:var(--blue);color:#fff;padding:2px 6px}.pickup-list{background:var(--navy);color:white;border-radius:15px;padding:16px;margin-top:24px}.pickup-list h2{color:var(--yellow)}.pickup-list div{padding:11px 0;border-bottom:1px solid #547079}.pickup-list div:last-child{border:0}.foot{position:fixed;z-index:9;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);padding:8px 13px calc(8px + env(safe-area-inset-bottom));background:#fffef9;border-top:3px solid var(--navy);text-align:center}.foot small{display:block;font-size:11px;line-height:1.3}.foot-row{display:flex;gap:8px;align-items:center;margin-top:7px}.foot a{color:var(--blue)}.foot .cta{flex:1;min-height:44px;background:var(--coral);color:#fff;border:2px solid var(--navy);border-radius:10px;text-decoration:none;display:grid;place-items:center;font-weight:800;font-size:13px}

</style></head><body><nav class="switch"><button class="on" data-mode="guest">客人看到的</button><button data-mode="owner">老闆看到的</button></nav><main id="app"></main><footer class="foot"><small>這是創巢數位做的示範頁，店名與內容都是虛構的</small><div class="foot-row"><a href="#">創巢數位</a><a class="cta" href="#">想要你店裡也有一個？留 Email 等上線 →</a></div></footer><script>
const pets=[{n:'小型犬',p:650,icon:'●',mins:90},{n:'中型犬',p:850,icon:'▲',mins:120},{n:'大型犬',p:1200,icon:'◆',mins:150},{n:'貓',p:1000,icon:'★',mins:120}],state={step:0,pet:null,service:null,nails:false,date:null,time:null,pickup:null,area:'中壢區'};const app=document.querySelector('#app'),weeks=['日','一','二','三','四','五','六'];function dates(){return Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i+1);return{iso:`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`,s:`${d.getMonth()+1}/${d.getDate()}`,w:`週${weeks[d.getDay()]}`}})}function hero(){return`<header class="hero"><div class="bubbles"></div><small>寵物洗澡・造型修剪</small><h1>毛球澡堂</h1><p>一顆毛球進來，香香澎澎回家。</p></header>`}function acts(){return`<div class="actions">${state.step?'<button class="back" onclick="back()">上一步</button>':''}<button class="next" onclick="next()">下一步</button></div>`}function render(){let c='',p=pets[state.pet];if(state.step===0)c=`<h2>你家的毛孩是哪一型？</h2><p class="sub">先選體型，價格才會算得準。</p><div class="grid">${pets.map((x,i)=>`<button class="tile ${state.pet===i?'selected':''}" onclick="state.pet=${i};render()"><span class="icon">${x.icon}</span><b>${x.n}</b><span>洗澡 NT$ ${x.p.toLocaleString()} 起</span></button>`).join('')}</div>${acts()}`;if(state.step===1)c=`<h2>想做哪種整理？</h2><p class="sub">會依現場毛況確認最後費用。</p><button class="service ${state.service==='bath'?'selected':''}" onclick="state.service='bath';render()"><span><b>基礎洗澡</b><small>洗淨・吹整・耳朵清潔</small></span><b>NT$ ${p.p.toLocaleString()}</b></button><button class="service ${state.service==='groom'?'selected':''}" onclick="state.service='groom';render()"><span><b>全套美容</b><small>基礎洗澡＋全身造型修剪</small></span><b>NT$ ${(p.p+600).toLocaleString()}</b></button><label class="addon"><input type="checkbox" ${state.nails?'checked':''} onchange="state.nails=this.checked;render()"><span><b>加購剪指甲 NT$ 150</b><br><small>不含磨甲與特殊保定</small></span></label>${acts()}`;if(state.step===2)c=`<h2>選送來的日期與時間</h2><p class="sub">灰色時段已滿，請挑其他時間。</p><div class="dates">${dates().slice(0,4).map(d=>`<button class="date ${state.date===d.iso?'selected':''}" onclick="state.date='${d.iso}';state.time=null;render()"><small>${d.w}</small><b>${d.s}</b></button>`).join('')}</div><div class="times">${['09:30','12:00','14:30','17:00'].map((t,i)=>`<button class="time ${state.time===t?'selected':''}" ${i===1?'disabled':''} onclick="state.time='${t}';render()">${i===1?'已滿':t}</button>`).join('')}</div>${acts()}`;if(state.step===3)c=`<h2>需要到府接送嗎？</h2><p class="sub">單趟接送加 NT$ 200，限服務範圍內。</p><div class="choice"><button class="${state.pickup===false?'selected':''}" onclick="state.pickup=false;render()">自行送來</button><button class="${state.pickup===true?'selected':''}" onclick="state.pickup=true;render()">需要接送＋200</button></div>${state.pickup===true?`<select onchange="state.area=this.value" aria-label="接送行政區"><option>中壢區</option><option>平鎮區</option><option>桃園區</option><option>八德區</option></select>`:''}${acts()}`;if(state.step===4)c=`<h2>確認預約</h2><p class="sub">本店不收訂金，若行程有變請提早告訴我們。</p>${summary()}<div class="actions"><button class="back" onclick="back()">上一步</button><button class="next" onclick="next()">確認送出預約</button></div>`;if(state.step===5){let mins=p.mins+(state.service==='groom'?60:0)+(state.nails?15:0),[h,m]=state.time.split(':').map(Number),end=h*60+m+mins;c=`<div class="done"><div class="done-icon">✦</div><h2>毛孩的時段留好囉！</h2><p class="sub">預計 ${String(Math.floor(end/60)%24).padStart(2,'0')}:${String(end%60).padStart(2,'0')} 完成，實際依毛況調整。</p></div>${summary()}<div class="notice">洗好會傳照片給你<br><small>接到通知再來接，就不用在附近久等。</small></div><button class="wide" style="width:100%;margin-top:18px" onclick="resetFlow()">再走一次示範</button>`}app.innerHTML=hero()+`<section class="wrap"><div class="meter"><span>${state.step+1}</span><i></i><small>共 6 步</small></div>${c}</section>`}function total(){let p=pets[state.pet],n=p.p+(state.service==='groom'?600:0)+(state.nails?150:0)+(state.pickup?200:0);return n}function summary(){let p=pets[state.pet],d=dates().find(x=>x.iso===state.date);return`<div class="summary"><div><span>毛孩</span><b>${p.n}</b></div><div><span>服務</span><b>${state.service==='bath'?'基礎洗澡':'全套美容'}${state.nails?'＋剪指甲':''}</b></div><div><span>時間</span><b>${d?.s||''} ${state.time||''}</b></div><div><span>接送</span><b>${state.pickup?state.area+'（＋200）':'自行送來'}</b></div><div><span>預估費用</span><b>NT$ ${total().toLocaleString()}</b></div></div>`}function next(){if(state.step===0&&state.pet===null)return;if(state.step===1&&!state.service)return;if(state.step===2&&(!state.date||!state.time))return;if(state.step===3&&state.pickup===null)return;state.step++;render();scrollTo(0,0)}function back(){state.step--;render()}function resetFlow(){Object.assign(state,{step:0,pet:null,service:null,nails:false,date:null,time:null,pickup:null,area:'中壢區'});render()}
function owner(){app.innerHTML=`<section class="owner"><div class="owner-top"><div><small>老闆工作台</small><h1>今日澡堂排程</h1></div><span class="demo">示範數據</span></div><div class="schedule"><div class="job"><time>09:30</time><div><span>自行送來</span><b>皮皮・小型犬</b><br><small>基礎洗澡＋剪指甲・約 11:15 完成</small></div></div><div class="job pickup"><time>11:30</time><div><span>需要接送</span><b>可樂・中型犬</b><br><small>全套美容・平鎮區・約 14:30 完成</small></div></div><div class="job"><time>14:30</time><div><span>自行送來</span><b>咪嚕・貓</b><br><small>基礎洗澡・約 16:30 完成</small></div></div><div class="job pickup"><time>17:00</time><div><span>需要接送</span><b>熊熊・大型犬</b><br><small>全套美容＋剪指甲・八德區・約 21:00 完成</small></div></div></div><section class="pickup-list"><h2>今天的接送清單</h2><div><b>10:50　可樂</b><br><small>平鎮區・車程約 15 分</small></div><div><b>16:15　熊熊</b><br><small>八德區・車程約 25 分</small></div></section></section>`}document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button').forEach(x=>x.classList.remove('on'));b.classList.add('on');b.dataset.mode==='guest'?render():owner();scrollTo(0,0)});render();
</script></body></html>
