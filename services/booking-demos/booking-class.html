<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>週三小班・香氛蠟燭｜報名示範</title><meta name="description" content="週三小班香氛蠟燭課程報名示範，選場次、人數並體驗候補流程。"><meta property="og:title" content="週三小班・香氛蠟燭"><meta property="og:description" content="八人小班，兩小時完成自己的香氣與蠟燭。"><meta name="robots" content="noindex"><meta name="nest-version" content="2026-09-15-v1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--purple:#3e315c;--lav:#b7a6d9;--lime:#d9ed88;--paper:#f8f4ec;--ink:#26212d;--orange:#f0a36c}*{box-sizing:border-box}html{background:#dcd4ca}body{margin:0 auto;max-width:480px;min-height:100vh;background:var(--paper);color:var(--ink);font:15px/1.6 'Noto Sans TC',sans-serif;padding:78px 0 152px;overflow-x:hidden}.switch{position:fixed;z-index:8;top:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:78px;padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;background:var(--purple)}.switch button{height:48px;border:1px solid var(--lav);background:transparent;color:#ded5ee;font:700 15px inherit}.switch .on{background:var(--lime);color:var(--purple);border-color:var(--lime)}.hero{padding:40px 24px 30px;background:var(--purple);color:white;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:var(--orange);right:-55px;top:-45px;mix-blend-mode:screen;opacity:.6}.kicker{color:var(--lime);font-weight:800;letter-spacing:.15em}.hero h1{font:700 37px/1.2 'Noto Serif TC';margin:8px 0 10px;max-width:310px}.hero p{margin:0;color:#ddd4e9}.facts{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:2px solid var(--purple)}.facts div{text-align:center;padding:14px 3px;border-right:1px solid #bdb4ab}.facts div:last-child{border:0}.facts b{display:block;font-size:18px;color:var(--purple)}.wrap{padding:25px 21px}.step{font-size:12px;color:#796e83;font-weight:700;margin-bottom:18px;text-transform:none}h2{font:700 26px 'Noto Serif TC';margin:0 0 7px}.sub{margin:0 0 18px;color:#706979}.intro{font-size:17px}.learn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}.learn div{background:#e8e0f2;padding:13px;min-height:70px}.session{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;border:2px solid var(--purple);background:#fff;padding:15px;margin-bottom:12px;min-height:82px;color:var(--ink)}.session.selected{background:var(--lime);box-shadow:6px 6px 0 var(--purple)}.session b{font-size:17px;display:block}.seats{font-weight:800;color:var(--purple)}.full{background:#eee9e1}.full .seats{color:#9b4c35}.counter{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;border:2px solid var(--purple);max-width:245px;margin:25px auto}.counter button{height:58px;border:0;background:var(--purple);color:#fff;font-size:27px}.counter strong{text-align:center;font-size:22px}.price{display:flex;justify-content:space-between;background:#e9e0f1;padding:16px;margin-top:18px}.price strong{font-size:21px;color:var(--purple)}.actions{display:flex;gap:10px;margin-top:24px}.actions button,.wide{height:54px;border:0;font:800 16px inherit}.back{width:92px;background:#ded7ce}.next,.wide{flex:1;background:var(--orange);color:var(--ink);box-shadow:5px 5px 0 var(--purple)}.summary{border-top:3px solid var(--purple);border-bottom:3px solid var(--purple);padding:12px 0;margin:18px 0}.summary div{display:flex;justify-content:space-between;padding:8px 2px}.done{text-align:center;padding:10px 0}.checkmark{width:72px;height:72px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-size:36px;margin:auto;border:2px solid var(--purple)}.wait-note{background:#e6ddf0;padding:17px;border-left:6px solid var(--purple)}.owner{padding:24px 20px}.owner h1{font:700 30px 'Noto Serif TC';margin:0}.demo{color:#766a81}.owner-session{margin-top:18px;border:2px solid var(--purple)}.owner-session header{display:flex;justify-content:space-between;background:var(--purple);color:white;padding:12px 14px}.owner-session header b{color:var(--lime)}.person{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #d6cec5}.person:last-child{border:0}.waitlist{background:#e8e0f2;padding:16px;margin-top:20px}.waitlist div{padding:8px 0;border-bottom:1px solid #c3b6d1}.send{width:100%;height:52px;border:2px solid var(--purple);background:var(--lime);font:800 16px inherit;margin-top:20px;box-shadow:5px 5px 0 var(--purple)}.sent{background:#dcebb0;padding:13px;margin-top:12px;text-align:center;font-weight:700}.foot{position:fixed;z-index:7;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);padding:8px 13px calc(8px + env(safe-area-inset-bottom));background:#f8f4ec;border-top:2px solid var(--purple);text-align:center}.foot small{font-size:11px;display:block;line-height:1.3}.foot-row{display:flex;gap:8px;align-items:center;margin-top:7px}.foot a{color:var(--purple)}.foot .cta{flex:1;min-height:44px;background:var(--purple);color:#fff;display:grid;place-items:center;text-decoration:none;font-weight:700;font-size:13px}

/* 2026-09-15 修正：頁尾跟在內容最後、大標題平均斷行 */
body{padding-bottom:0!important}
footer,.footer{position:static!important;inset:auto!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;width:auto!important;max-width:none!important;box-shadow:none!important;margin-top:28px!important}
h1,h2{text-wrap:balance}
</style></head><body><nav class="switch"><button class="on" data-mode="guest">客人看到的</button><button data-mode="owner">老闆看到的</button></nav><main id="app"></main><footer class="foot"><small>這是創巢數位做的示範頁，店名與內容都是虛構的</small><div class="foot-row"><a href="#">創巢數位</a><a class="cta" href="#">想要你店裡也有一個？留 Email 等上線 →</a></div></footer><script>
const state={step:0,session:null,count:1},app=document.querySelector('#app');function sessions(){let base=new Date();return [3,7,10].map((add,i)=>{let d=new Date(base);d.setDate(d.getDate()+add);let names=['晚間班','午後班','週末班'];return{date:`${d.getMonth()+1} 月 ${d.getDate()} 日`,day:`週${['日','一','二','三','四','五','六'][d.getDay()]}`,time:i===0?'19:00–21:00':i===1?'14:00–16:00':'10:00–12:00',left:[3,0,6][i],name:names[i]}})}function hero(){return`<header class="hero"><div class="kicker">把星期三留給自己</div><h1>週三小班・香氛蠟燭</h1><p>用兩小時，調一款屬於自己的香氣。</p></header><div class="facts"><div><b>8 人</b>每班上限</div><div><b>2 小時</b>完整實作</div><div><b>NT$ 1,500</b>材料全含</div></div>`}function acts(label='下一步'){return`<div class="actions">${state.step?'<button class="back" onclick="back()">上一步</button>':''}<button class="next" onclick="next()">${label}</button></div>`}function render(){let c='',ss=sessions(),s=ss[state.session];if(state.step===0)c=`<h2>帶一顆自己做的蠟燭回家</h2><p class="intro">從聞香、選材到注蠟，老師會一步一步陪你完成，不需要任何經驗。</p><div class="learn"><div><b>12 款香調</b><br>自由搭配比例</div><div><b>大豆蠟材</b><br>課後帶回成品</div><div><b>工具全備</b><br>人來就可以</div><div><b>小班進行</b><br>每班最多 8 人</div></div>${acts('看看近期場次')}`;if(state.step===1)c=`<h2>選一個場次</h2><p class="sub">額滿的場次仍可登記候補。</p>${ss.map((x,i)=>`<button class="session ${state.session===i?'selected':''} ${x.left===0?'full':''}" onclick="state.session=${i};state.count=1;render()"><span><b>${x.date} ${x.day}・${x.name}</b><small>${x.time}</small></span><span class="seats">${x.left?`剩 ${x.left} 位`:'額滿<br>加入候補'}</span></button>`).join('')}${acts()}`;if(state.step===2)c=`<h2>${s.left?'幾位一起來？':'登記幾位候補？'}</h2><p class="sub">${s.left?'這場最多還能選 '+s.left+' 位。':'有名額釋出時，會依候補順序通知。'}</p><div class="counter"><button onclick="change(-1)" aria-label="減少人數">−</button><strong>${state.count} 位</strong><button onclick="change(1)" aria-label="增加人數">＋</button></div><div class="price"><span>${s.left?'課程費用':'候補登記'}</span><strong>${s.left?'NT$ '+(1500*state.count).toLocaleString():'暫不收費'}</strong></div>${acts(s.left?'前往付款':'登記候補')}`;if(state.step===3)c=`<h2>${s.left?'確認並付款':'確認候補資料'}</h2><p class="sub">${s.left?'這是付款示範，不會真的扣款。':'候補不需付款，名額釋出後才會請你確認。'}</p>${summary()}<div class="actions"><button class="back" onclick="back()">上一步</button><button class="next" onclick="next()">${s.left?'付款 NT$ '+(1500*state.count).toLocaleString()+'<br><small>（示範，不會扣款）</small>':'確認加入候補'}</button></div>`;if(state.step===4)c=`<div class="done"><div class="checkmark">✓</div><h2>${s.left?'報名完成！':'候補登記完成'}</h2><p>${s.left?'材料與座位都替你準備好了。':'有人取消會依順序通知你。'}</p></div>${summary()}${s.left?'<div class="wait-note"><b>上課前一天會傳提醒</b><br>請穿著不怕沾到蠟材的衣服，提早 10 分鐘抵達。</div>':'<div class="wait-note"><b>目前不會扣款</b><br>輪到你時會先詢問是否仍要參加，再保留名額。</div>'}<button class="wide" style="width:100%;margin-top:20px" onclick="resetFlow()">再走一次示範</button>`;app.innerHTML=hero()+`<section class="wrap"><div class="step">報名步驟 ${Math.min(state.step+1,5)}／5</div>${c}</section>`}function summary(){let s=sessions()[state.session];return`<div class="summary"><div><span>場次</span><b>${s.date} ${s.day}</b></div><div><span>時間</span><b>${s.time}</b></div><div><span>人數</span><b>${state.count} 位</b></div><div><span>狀態</span><b>${s.left?'已保留座位':'候補中'}</b></div></div>`}function next(){if(state.step===1&&state.session===null)return;state.step++;render();scrollTo(0,0)}function back(){state.step--;render()}function change(n){let s=sessions()[state.session],max=s.left||4;state.count=Math.max(1,Math.min(max,state.count+n));render()}function resetFlow(){Object.assign(state,{step:0,session:null,count:1});render()}
function owner(){let ss=sessions();app.innerHTML=`<section class="owner"><small class="demo">本月報名 18 人・示範數據</small><h1>小班名冊</h1>${ss.map((s,i)=>`<section class="owner-session"><header><span>${s.date}・${s.name}</span><b>${s.left?'已報 '+(8-s.left)+'／8 人':'已滿 8／8 人'}</b></header>${(i===0?['以安（2 位）','思涵（1 位）','品妍（2 位）']:i===1?['宥琳（2 位）','嘉欣（2 位）','曼文（1 位）','阿沛（3 位）']:['怡君（1 位）','小潔（1 位）']).map(n=>`<div class="person"><span>${n}</span><small>已付款</small></div>`).join('')}</section>`).join('')}<section class="waitlist"><h2>候補名單</h2><div>1　庭瑜・2 位</div><div>2　文琪・1 位</div><div>3　若晴・1 位</div></section><button class="send" onclick="sendRemind()">一鍵傳上課提醒</button><div id="sent"></div></section>`}function sendRemind(){document.querySelector('#sent').innerHTML='<div class="sent">✓ 示範訊息已傳送給已報名學員</div>'}document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button').forEach(x=>x.classList.remove('on'));b.classList.add('on');b.dataset.mode==='guest'?render():owner();scrollTo(0,0)});render();
</script></body></html>
