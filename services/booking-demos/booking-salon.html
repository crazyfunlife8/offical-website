<!-- NEST-VERSION: 2026-09-15-v1 -->
<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>午後髮室｜線上預約示範</title><meta name="description" content="午後髮室線上預約示範，選設計師、服務與時段一次完成。"><meta property="og:title" content="午後髮室｜線上預約"><meta property="og:description" content="不用來回問，直接挑選設計師與可約時段。"><meta name="robots" content="noindex"><meta name="nest-version" content="2026-09-15-v1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet"><style>
:root{--ink:#26312e;--paper:#f3f0e8;--green:#315c4d;--gold:#c79b58;--white:#fff;--muted:#6e7772}*{box-sizing:border-box}html,body{margin:0;background:#dcd8ce;color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:16px}body{min-width:320px}.app{max-width:480px;min-height:100vh;margin:auto;background:var(--paper);overflow:hidden}.switch{position:sticky;top:0;z-index:9;padding:10px 16px;background:rgba(243,240,232,.94);backdrop-filter:blur(10px);display:grid;grid-template-columns:1fr 1fr;gap:4px;border-bottom:1px solid #d7d2c7}.switch button{border:0;min-height:44px;border-radius:4px;background:transparent;color:#66706c;font:700 14px inherit}.switch .on{background:var(--ink);color:white}.hero{padding:30px 24px 22px;background:var(--green);color:white;position:relative}.hero:after{content:'午後';position:absolute;right:-8px;bottom:-26px;font:700 88px 'Noto Serif TC';color:#ffffff0e}.eyebrow{letter-spacing:.18em;font-size:14px;color:#e4cfaa}.hero h1{font:700 clamp(30px,9vw,42px)/1.2 'Noto Serif TC';margin:8px 0;text-wrap:balance}.hero p{margin:0;color:#e5edea}.wrap{padding:22px 18px 30px}.problem{border-left:4px solid var(--gold);padding:12px 14px;background:#fff9;margin-bottom:20px}.progress{display:flex;gap:5px;margin:0 0 22px}.progress i{height:4px;background:#d5d1c8;flex:1}.progress i.done{background:var(--gold)}h2{font:700 24px 'Noto Serif TC';margin:0 0 6px;text-wrap:balance}.hint{color:var(--muted);margin:0 0 18px;font-size:14px}.grid{display:grid;gap:10px}.choice{width:100%;min-height:64px;padding:13px 14px;border:1px solid #cbc7bd;background:#fff;text-align:left;color:var(--ink);font:500 16px inherit;border-radius:3px;display:flex;justify-content:space-between;align-items:center}.choice small{display:block;color:var(--muted);margin-top:3px}.choice.selected{border:2px solid var(--green);background:#edf3f0}.choice:disabled{opacity:.45}.tag{font-size:13px;color:var(--green);background:#e5efea;padding:4px 7px}.actions{display:flex;gap:10px;margin-top:22px}.btn{min-height:48px;border:0;border-radius:3px;padding:11px 18px;font:700 16px inherit}.primary{background:var(--green);color:white;flex:1}.back{background:transparent;border:1px solid #aaa}.fields{display:grid;gap:14px}.fields label{font-weight:700}.fields input,.fields select{width:100%;min-height:48px;border:1px solid #bdb8ad;background:white;border-radius:3px;padding:10px;font:16px inherit;margin-top:6px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{min-height:46px;border:1px solid #bbb;background:#fff;font:700 14px inherit}.slot.on{background:var(--green);color:white}.slot:disabled{text-decoration:line-through;color:#999;background:#e3e0d9}.summary{background:white;border-top:5px solid var(--gold);padding:18px}.summary dl{display:grid;grid-template-columns:80px 1fr;gap:10px;margin:0}.summary dt{color:var(--muted)}.summary dd{margin:0;font-weight:700}.success{text-align:center;padding:8px 0}.seal{width:76px;height:76px;margin:8px auto 18px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-size:36px}.footer{padding:24px 18px 36px;background:#e4e0d7;text-align:center;font-size:13px;color:#656b68}.footer .cta{display:block;min-height:48px;padding:13px;margin:12px 0;background:var(--ink);color:white;text-decoration:none;font-weight:700}.footer a{color:var(--green)}.dash{padding:20px 16px 32px}.dash h2{margin-bottom:16px}.stat{background:var(--gold);color:#231d14;padding:18px;margin-bottom:14px}.stat strong{display:block;font-size:32px}.timeline{display:grid;gap:10px}.staff{background:white;padding:14px;border-left:5px solid var(--green)}.staff h3{margin:0 0 10px}.appt{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:9px 0;border-top:1px solid #eee;font-size:14px}.badge{font-size:12px;padding:2px 6px;background:#efe4ce}.owner-note{padding:12px;background:#dfe9e5;margin-bottom:14px}@media(max-width:374px){.hero h1{font-size:29px}.wrap{padding-left:14px;padding-right:14px}}

/* 2026-09-15 標題斷行 */
h1{text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
</style></head><body><main class="app"><nav class="switch" aria-label="畫面切換"><button class="on" data-view="guest">客人看到的</button><button data-view="owner">老闆看到的</button></nav><div id="screen"></div><footer class="footer"><div>這是創巢數位做的示範頁，店名與內容都是虛構的</div><a class="cta" href="#">想要你店裡也有一個？留 Email 等上線 →</a><a href="#">創巢數位</a></footer></main><script>
const S={step:0,designer:'',service:'',length:'',date:'',time:'',name:'',phone:''};
const designers=[['映安','俐落短髮・自然捲整理'],['子晴','質感染髮・柔霧色系'],['庭宇','長髮層次・韓系燙髮'],['不指定','由我們安排最快時段']];
const services=[['剪髮',600,60,'含洗髮與造型'],['染髮',2800,150,'長髮依現場加價'],['燙髮',3200,180,'長髮依現場加價'],['護髮',1200,60,'深層修護療程']];
const days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i+1);return d});
const fmt=d=>`${d.getMonth()+1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`;
const el=document.querySelector('#screen');
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('on',x===b));b.dataset.view==='owner'?owner():render()});
function shell(body){el.innerHTML=`<section class="hero"><div class="eyebrow">午後髮室・線上預約</div><h1>留一段時間，整理現在的自己</h1><p>不用等回覆，看到的都是可以預約的時間。</p></section><div class="wrap">${S.step===0?'<div class="problem">以前要在 LINE 裡來回問時間，現在直接選，不再撞時段。</div>':''}<div class="progress">${Array.from({length:7},(_,i)=>`<i class="${i<=S.step?'done':''}"></i>`).join('')}</div>${body}</div>`}
function next(){S.step++;render()}function back(){S.step--;render()}function nav(ok=true,label='下一步'){return `<div class="actions">${S.step?'<button class="btn back" onclick="back()">上一步</button>':''}<button class="btn primary" ${ok?'':'disabled'} onclick="next()">${label}</button></div>`}
function render(){let b='';if(S.step===0){b=`<h2>今天想找哪位設計師？</h2><p class="hint">每位設計師的可約時間不同</p><div class="grid">${designers.map(d=>`<button class="choice ${S.designer===d[0]?'selected':''}" onclick="S.designer='${d[0]}';render()"><span><b>${d[0]}</b><small>${d[1]}</small></span><span>›</span></button>`).join('')}</div>${nav(!!S.designer)}`}
else if(S.step===1){b=`<h2>選擇服務項目</h2><p class="hint">本次由 ${S.designer} 為你服務</p><div class="grid">${services.map(x=>`<button class="choice ${S.service===x[0]?'selected':''}" onclick="S.service='${x[0]}';render()"><span><b>${x[0]}・NT$ ${x[1].toLocaleString()}${x[0].match(/染|燙/)?' 起':''}</b><small>約 ${x[2]} 分鐘・${x[3]}</small></span></button>`).join('')}</div>${nav(!!S.service)}`}
else if(S.step===2){b=`<h2>你的髮長</h2><p class="hint">幫助設計師預留更準確的時間</p><div class="grid">${['短髮｜耳下以上','中長髮｜肩膀附近','長髮｜過肩'].map(x=>`<button class="choice ${S.length===x.split('｜')[0]?'selected':''}" onclick="S.length='${x.split('｜')[0]}';render()">${x}</button>`).join('')}</div>${nav(!!S.length)}`}
else if(S.step===3){let base=S.service==='燙髮'?['10:00','14:00']:S.service==='染髮'?['10:30','13:30','17:00']:['10:00','11:30','14:00','15:30','17:00','18:30'];let off=(designers.findIndex(x=>x[0]===S.designer)+days.findIndex(d=>fmt(d)===S.date))%base.length;b=`<h2>挑選日期與時段</h2><div class="grid">${days.map(d=>`<button class="choice ${S.date===fmt(d)?'selected':''}" onclick="S.date='${fmt(d)}';S.time='';render()">${fmt(d)}<span>${d.getDay()===1?'較少時段':'可預約'}</span></button>`).join('')}</div>${S.date?`<p class="hint" style="margin-top:18px">${S.designer}・${S.service}可約時段</p><div class="slots">${base.map((t,i)=>`<button class="slot ${S.time===t?'on':''}" ${i===off?'disabled':''} onclick="S.time='${t}';render()">${t}${i===off?'<br>已滿':''}</button>`).join('')}</div>`:''}${nav(!!S.date&&!!S.time)}`}
else if(S.step===4){b=`<h2>留下聯絡資料</h2><p class="hint">只用於這次預約聯繫</p><div class="fields"><label>怎麼稱呼你？<input value="${S.name}" oninput="S.name=this.value" placeholder="例如：王小姐"></label><label>手機號碼<input inputmode="tel" maxlength="10" value="${S.phone}" oninput="S.phone=this.value" placeholder="09xxxxxxxx"></label></div><div class="actions"><button class="btn back" onclick="back()">上一步</button><button class="btn primary" onclick="S.name=document.querySelectorAll('input')[0].value;S.phone=document.querySelectorAll('input')[1].value;if(S.name&&/^09\\d{8}$/.test(S.phone))next();else document.querySelector('.hint').textContent='請填寫稱呼與正確的 10 碼手機號碼'">下一步</button></div>`}
else if(S.step===5){b=`<h2>確認預約內容</h2><p class="hint">本次預約不收訂金</p>${summary()}${nav(true,'確認預約')}`}
else b=`<div class="success"><div class="seal">✓</div><h2>預約完成</h2><p>前一天會傳 LINE 提醒你</p></div>${summary()}`;shell(b)}
function summary(){let sv=services.find(x=>x[0]===S.service)||[];return `<div class="summary"><dl><dt>設計師</dt><dd>${S.designer}</dd><dt>服務</dt><dd>${S.service}・NT$ ${(sv[1]||0).toLocaleString()}${S.service.match(/染|燙/)?' 起':''}</dd><dt>髮長</dt><dd>${S.length}</dd><dt>時間</dt><dd>${S.date} ${S.time}</dd><dt>預約人</dt><dd>${S.name}</dd></dl></div>`}
function owner(){el.innerHTML=`<section class="hero"><div class="eyebrow">午後髮室・店務總覽</div><h1>今天的椅子，都安排好了</h1><p>9 月 15 日・共 8 組預約</p></section><div class="dash"><div class="owner-note">客人自己選可約時段，三位設計師不再共用聊天室對時間。</div><div class="stat">今天預估營收 <small>示範數據</small><strong>NT$ 21,600</strong>已收訂金 NT$ 0</div><h2>今日設計師時間軸</h2><div class="timeline">${[['映安',['10:00 林小姐・剪髮・舊客','11:30 陳先生・剪髮・新客','15:30 曾小姐・護髮・舊客']],['子晴',['10:30 吳小姐・染髮・新客','14:00 黃小姐・護髮・舊客','17:00 蔡小姐・染髮・舊客']],['庭宇',['10:00 江小姐・燙髮・舊客','15:00 李小姐・剪髮・新客']]].map(s=>`<article class="staff"><h3>${s[0]}</h3>${s[1].map(a=>{let z=a.split(' ');return `<div class="appt"><b>${z[0]}</b><span>${z.slice(1).join(' ')}</span><i class="badge">${a.includes('新客')?'新客':'舊客'}</i></div>`}).join('')}</article>`).join('')}</div></div>`}render();
</script></body></html>
