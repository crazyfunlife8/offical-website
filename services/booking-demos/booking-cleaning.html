<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安居清潔｜到府清潔預約示範</title><meta name="description" content="安居清潔桃園到府服務，即時計算建議時數與費用。"><meta property="og:title" content="安居清潔｜桃園到府清潔"><meta property="og:description" content="輸入坪數、選擇地區與時間，立即取得清潔費用。"><meta name="robots" content="noindex"><meta name="nest-version" content="2026-09-15-v1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--blue:#176b87;--navy:#123444;--aqua:#dff4f4;--orange:#ef873b;--white:#fff;--gray:#edf2f3}*{box-sizing:border-box}body{margin:0;background:#dce7e9;color:var(--navy);font:16px/1.5 'Noto Sans TC',sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;background:white;overflow:hidden}.switch{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr 1fr;background:var(--navy);padding:8px 14px;gap:4px}.switch button{min-height:44px;border:0;background:transparent;color:#b9d2da;font:700 14px inherit;border-radius:8px}.switch .on{background:white;color:var(--navy)}.hero{padding:27px 20px;color:white;background:linear-gradient(135deg,var(--blue),var(--navy));position:relative}.hero h1{font-size:clamp(28px,8vw,38px);line-height:1.18;margin:6px 0;text-wrap:balance}.hero p{margin:0;color:#d7ebef}.city{display:inline-block;background:var(--orange);padding:4px 9px;border-radius:5px;font-weight:700}.content{padding:20px 16px 34px}.problem{background:var(--aqua);padding:13px;border-radius:10px;margin-bottom:18px}.progress{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:12px}h2{font-size:24px;line-height:1.3;margin:0 0 6px;text-wrap:balance}.hint{color:#5f747c;margin:0 0 16px}.grid{display:grid;gap:10px}.choice{min-height:64px;padding:12px 14px;border:1px solid #b9c9cd;background:white;border-radius:10px;text-align:left;color:var(--navy);font:500 16px inherit}.choice.on{border:2px solid var(--blue);background:var(--aqua)}.choice:disabled{opacity:.48}.choice b{display:block}.choice small{color:#637a82}.input{width:100%;min-height:50px;border:2px solid #9db4ba;border-radius:8px;padding:10px;font:16px inherit}.estimate{margin:14px 0;background:var(--navy);color:white;padding:17px;border-radius:10px}.estimate strong{display:block;font-size:28px}.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.area{min-height:48px;border:1px solid #a8bcc1;border-radius:8px;background:white;font:700 14px inherit}.area.on{background:var(--blue);color:white}.warn{margin-top:12px;padding:12px;background:#fff0e5;color:#873d09;border-left:4px solid var(--orange)}.dates{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.date{min-width:105px;min-height:58px;border:1px solid #aac0c5;background:white;border-radius:8px}.date.on{background:var(--navy);color:white}.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.slot{min-height:58px;border:1px solid #aac0c5;background:white;border-radius:8px;font:700 15px inherit}.slot.on{background:var(--blue);color:white}.slot:disabled{background:#eee;color:#999}.checks label{display:flex;align-items:center;gap:12px;min-height:56px;padding:11px;border:1px solid #bdcdd0;border-radius:8px;margin-bottom:10px}.checks input{width:22px;height:22px;accent-color:var(--blue)}.nav{display:flex;gap:9px;margin-top:22px}.btn{min-height:50px;border:1px solid var(--blue);border-radius:8px;background:white;color:var(--blue);padding:10px 16px;font:700 16px inherit}.next{background:var(--orange);border-color:var(--orange);color:white;flex:1}.sum{background:var(--gray);border-radius:10px;padding:15px}.sum dl{display:grid;grid-template-columns:82px 1fr;gap:8px;margin:0}.sum dd{margin:0;font-weight:700}.success{text-align:center}.check{width:72px;height:72px;background:var(--blue);color:white;border-radius:18px;display:grid;place-items:center;font-size:38px;margin:8px auto 16px}.footer{background:var(--navy);color:white;text-align:center;padding:24px 16px 36px;font-size:13px}.footer .cta{display:block;background:var(--orange);color:white;min-height:48px;padding:13px;margin:12px 0;border-radius:8px;text-decoration:none;font-weight:700}.footer a{color:#bfe8ef}.team{background:var(--gray);padding:14px;border-radius:10px;margin-bottom:12px}.shift{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:8px 0;border-top:1px solid #ccd9dc}.quote{border-left:5px solid var(--orange);padding:12px;margin:10px 0;background:#fff7f0}@media(max-width:374px){.hero h1{font-size:27px}.content{padding-left:12px;padding-right:12px}.areas{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><nav class="switch"><button class="on" data-v="g">客人看到的</button><button data-v="o">老闆看到的</button></nav><div id="screen"></div><footer class="footer"><div>這是創巢數位做的示範頁，店名與內容都是虛構的</div><a class="cta" href="#">想要你店裡也有一個？留 Email 等上線 →</a><a href="#">創巢數位</a></footer></main><script>
const S={step:0,service:'',amount:0,hours:0,price:0,area:'',date:'',time:'',needs:[]};const days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i+1);return d});const fmt=d=>`${d.getMonth()+1}/${d.getDate()} ${'日一二三四五六'[d.getDay()]}`;const screen=document.querySelector('#screen');document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('on',x===b));b.dataset.v==='o'?owner():render()});
function head(){return `<section class="hero"><span class="city">服務桃園市</span><h1>家裡交給我們，時間留給自己</h1><p>先看建議時數與費用，再挑方便時段。</p></section>`}function nav(ok=true,l='下一步'){return `<div class="nav">${S.step?'<button class="btn" onclick="S.step--;render()">上一步</button>':''}<button class="btn next" ${ok?'':'disabled'} onclick="S.step++;render()">${l}</button></div>`}function calc(){if(S.service==='冷氣清洗'){S.hours=S.amount*1.5;S.price=S.amount*2000}else{S.hours=S.amount<=15?3:S.amount<=25?4:S.amount<=35?5:6;S.price=S.service==='退租清潔'?S.hours*1000:S.hours/3*2400}}function render(){let b='';if(S.step===0)b=`<div class="problem">不用來回回答坪數，也不用等排班：先取得估價，再選附近人員可到的時間。</div><h2>想預約哪種服務？</h2><div class="grid">${[['居家清潔','日常除塵、廚衛整理'],['退租清潔','空屋細清、交屋前整理'],['冷氣清洗','分離式冷氣室內機']].map(x=>`<button class="choice ${S.service===x[0]?'on':''}" onclick="S.service='${x[0]}';S.amount=0;render()"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div>${nav(!!S.service)}`;
if(S.step===1)b=`<h2>${S.service==='冷氣清洗'?'有幾台冷氣？':'空間大約幾坪？'}</h2><p class="hint">輸入後立即顯示建議時間與費用</p><input class="input" type="number" inputmode="numeric" min="1" max="100" value="${S.amount||''}" placeholder="請輸入${S.service==='冷氣清洗'?'台數':'坪數'}" oninput="S.amount=Number(this.value);calc();document.querySelector('.estimate').innerHTML=est();document.querySelector('.next').disabled=!S.amount"><div class="estimate">${est()}</div>${nav(!!S.amount)}`;
if(S.step===2){let areas=['桃園區','中壢區','平鎮區','八德區','蘆竹區','龜山區','楊梅區','大園區','觀音區','新屋區','龍潭區','大溪區','復興區','新竹市'];b=`<h2>服務地址在哪一區？</h2><p class="hint">目前以桃園市主要生活圈為主</p><div class="areas">${areas.map(x=>`<button class="area ${S.area===x?'on':''}" onclick="S.area='${x}';render()">${x}</button>`).join('')}</div>${S.area==='新竹市'||S.area==='復興區'?'<div class="warn">目前沒有服務這區</div>':''}${nav(S.area&&S.area!=='新竹市'&&S.area!=='復興區')}`}
if(S.step===3)b=`<h2>選日期與時段</h2><p class="hint">只顯示還能派員的班次</p><div class="dates">${days.map(d=>`<button class="date ${S.date===fmt(d)?'on':''}" onclick="S.date='${fmt(d)}';S.time='';render()">${fmt(d)}</button>`).join('')}</div>${S.date?`<div class="slots">${['上午 9–12','下午 14–17'].map((x,i)=>{let full=(days.findIndex(d=>fmt(d)===S.date)+i)%4===1;return `<button class="slot ${S.time===x?'on':''}" ${full?'disabled':''} onclick="S.time='${x}';render()">${x}${full?'<br>已滿':''}</button>`}).join('')}</div>`:''}${nav(S.date&&S.time)}`;
if(S.step===4)b=`<h2>有什麼需要先知道？</h2><p class="hint">可以複選，也可以直接下一步</p><div class="checks">${['家裡有寵物','需要我們帶清潔劑'].map(x=>`<label><input type="checkbox" ${S.needs.includes(x)?'checked':''} onchange="this.checked?S.needs.push('${x}'):S.needs=S.needs.filter(v=>v!=='${x}');render()"><b>${x}</b></label>`).join('')}</div>${nav()}`;
if(S.step===5)b=`<h2>確認預約與訂金</h2><p class="hint">訂金可保留派班名額；這是操作示範。</p>${sum()}${nav(true,'付訂金 500（示範，不會扣款）')}`;
if(S.step===6)b=`<div class="success"><div class="check">✓</div><h2>到府預約完成</h2><p>到府人員：安居 A 組・林師傅、游師傅</p><p>前一天會傳 LINE 提醒你</p></div>${sum()}`;screen.innerHTML=head()+`<div class="content"><div class="progress">${S.step<6?`預約進度 ${S.step+1}／6`:'已完成預約'}</div>${b}</div>`}
function est(){return S.amount?`<span>建議安排 ${S.hours} 小時</span><strong>預估 NT$ ${S.price.toLocaleString()}</strong><small>${S.service==='居家清潔'?'居家清潔每 3 小時 NT$ 2,400 起':S.service==='冷氣清洗'?'分離式冷氣每台 NT$ 2,000':'實際費用依現場髒污狀況確認'}</small>`:'<span>填寫後會在這裡看到估價</span>'}function sum(){return `<div class="sum"><dl><dt>服務</dt><dd>${S.service}・${S.amount} ${S.service==='冷氣清洗'?'台':'坪'}</dd><dt>估價</dt><dd>NT$ ${S.price.toLocaleString()}・約 ${S.hours} 小時</dd><dt>地區</dt><dd>桃園市${S.area}</dd><dt>時間</dt><dd>${S.date}・${S.time}</dd><dt>需求</dt><dd>${S.needs.join('、')||'無'}</dd><dt>訂金</dt><dd>NT$ 500</dd></dl></div>`}
function owner(){screen.innerHTML=head()+`<div class="content"><h2>本週雙組排班</h2><p class="hint">排班與路線為示範數據</p>${[['安居 A 組',['週二上午・桃園區 林宅','週二下午・八德區 陳宅','週三上午・中壢區 吳宅','週三下午・已滿']],['安居 B 組',['週二上午・中壢區 張宅','週二下午・平鎮區 王宅','週三上午・蘆竹區 許宅','週三下午・龜山區 李宅']]].map(t=>`<section class="team"><h3>${t[0]}</h3>${t[1].map(x=>`<div class="shift"><b>${x.split('・')[0]}</b><span>${x.split('・')[1]}</span></div>`).join('')}</section>`).join('')}<h2>今天的順路安排</h2><div class="team"><b>桃園區 09:00</b> → <b>八德區 14:00</b><p>預估車程 18 分鐘，已保留 40 分鐘移動。</p></div><h2>待確認報價單</h2>${[['郭小姐','楊梅區・退租 32 坪','等待照片'],['周先生','大園區・冷氣 4 台','待確認機型'],['謝小姐','龍潭區・居家 28 坪','等待回覆時段']].map(x=>`<div class="quote"><b>${x[0]}・${x[1]}</b><div>${x[2]}</div></div>`).join('')}</div>`}render();
</script></body></html>
