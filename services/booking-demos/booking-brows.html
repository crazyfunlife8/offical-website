<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>晨霧眉睫｜預約示範</title><meta name="description" content="晨霧眉睫個人工作室預約示範，包含施作前問卷、時段與補色期限。"><meta property="og:title" content="晨霧眉睫｜為你留一段細緻時光"><meta property="og:description" content="先做安全問卷，再安心預約專屬時段。"><meta name="robots" content="noindex"><meta name="nest-version" content="2026-09-15-v1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--wine:#613b46;--rose:#b88b91;--blush:#f5e9e6;--paper:#fffaf6;--ink:#342b2d;--gold:#ad8551}*{box-sizing:border-box}html{background:#e5d9d4}body{margin:0 auto;max-width:480px;min-height:100vh;background:var(--paper);color:var(--ink);font:15px/1.65 'Noto Sans TC',sans-serif;padding:76px 0 152px;overflow-x:hidden}.switch{position:fixed;z-index:9;top:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;padding:12px 20px;background:#fffaf6ee;border-bottom:1px solid #eadbd7}.switch button{height:48px;flex:1;border:1px solid var(--wine);background:transparent;color:var(--wine);font:600 15px inherit}.switch button:first-child{border-radius:24px 0 0 24px}.switch button:last-child{border-radius:0 24px 24px 0}.switch .on{background:var(--wine);color:#fff}.hero{padding:36px 25px 30px;text-align:center;background:radial-gradient(circle at 20% 10%,#efd7d4 0 2px,transparent 3px),linear-gradient(160deg,#f8e8e4,#fffaf6 70%);background-size:28px 28px,auto}.mark{width:64px;height:64px;border:1px solid var(--wine);border-radius:50%;margin:auto;display:grid;place-items:center;font:700 25px 'Noto Serif TC';color:var(--wine)}h1{font:700 31px 'Noto Serif TC';letter-spacing:.12em;margin:14px 0 4px}h2{font:700 24px 'Noto Serif TC';margin:0 0 5px}.hero p,.sub{color:#7d686c;margin:0}.wrap{padding:0 22px 24px}.steps{font-size:12px;letter-spacing:.12em;color:var(--rose);border-top:1px solid #eadbd7;padding-top:18px;margin-bottom:20px}.cards{display:grid;gap:13px}.card{width:100%;border:1px solid #decac7;background:#fff;padding:18px;border-radius:22px 5px 22px 5px;text-align:left;color:var(--ink);font:inherit;min-height:86px}.card.selected{box-shadow:inset 0 0 0 2px var(--wine);background:var(--blush)}.card b{font:700 18px 'Noto Serif TC';display:block}.card span{color:#78686a}.qa{margin:18px 0;padding-bottom:18px;border-bottom:1px solid #e7d8d4}.qa p{font-weight:600;margin:0 0 10px}.yn{display:flex;gap:9px}.yn button{flex:1;height:46px;border:1px solid #d7c3c0;border-radius:23px;background:#fff;color:var(--ink);font:inherit}.yn .chosen{background:var(--wine);color:#fff}.blocked{background:#f7dfdc;border:1px solid #d49a96;color:#7e302f;padding:16px;border-radius:12px;margin:18px 0}.dates{display:flex;gap:8px;overflow:hidden;margin-top:18px}.date{flex:1;min-width:0;height:68px;border:1px solid #decac7;border-radius:30px;background:#fff;color:var(--ink)}.date span{display:block}.date.selected{background:var(--wine);color:#fff}.times{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.time{height:50px;border:1px solid #decac7;background:#fff;border-radius:25px}.time.selected{background:var(--blush);border:2px solid var(--wine)}.time:disabled{background:#eee8e6;color:#aaa}.actions{display:flex;gap:10px;margin-top:24px}.actions button,.wide{min-height:52px;border:0;font:700 16px inherit;border-radius:26px}.back{width:95px;background:#eee2df;color:var(--wine)}.next,.wide{flex:1;background:var(--wine);color:#fff}.recap{background:#fff;border:1px solid #e2ceca;border-radius:22px 5px;padding:18px;margin:18px 0}.recap div{display:flex;justify-content:space-between;border-bottom:1px dashed #e2ceca;padding:8px 0}.recap div:last-child{border:0}.done{text-align:center}.done .mark{background:var(--wine);color:white;border:0}.tips{background:var(--blush);padding:17px;border-radius:5px 22px}.tips ul{padding-left:20px;margin:7px 0}.owner{padding:23px}.owner-head{padding:10px 0 22px;border-bottom:1px solid #decac7}.owner-head h1{text-align:left;letter-spacing:0;margin:0}.metric{color:var(--rose);font-size:13px}.owner h2{margin-top:24px}.appt{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid #eadbd7}.appt time{font-weight:700;color:var(--wine)}.appt small{display:block;color:#87777a}.flag{display:inline-block;color:#a02626;background:#f9dddd;padding:2px 7px;margin-top:3px;font-size:12px}.due{display:flex;justify-content:space-between;align-items:center;background:#f3e6e2;padding:14px;margin-top:8px;border-radius:12px}.due b{display:block}.due span{color:var(--wine);font-size:13px}.foot{position:fixed;z-index:8;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:#fffaf6f5;border-top:1px solid #eadbd7;text-align:center}.foot small{font-size:11px;display:block;line-height:1.3}.foot div{display:flex;gap:9px;align-items:center;margin-top:7px}.foot a{color:var(--wine)}.foot .cta{flex:1;min-height:44px;border-radius:22px;background:var(--gold);display:grid;place-items:center;text-decoration:none;color:#fff;font-weight:700;font-size:13px}

body{padding-bottom:0!important}
footer,.footer{position:static!important;inset:auto!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;width:auto!important;max-width:none!important;box-shadow:none!important;margin-top:28px!important}

</style></head><body><nav class="switch"><button class="on" data-mode="guest">客人看到的</button><button data-mode="owner">老闆看到的</button></nav><main id="app"></main><footer class="foot"><small>這是創巢數位做的示範頁，店名與內容都是虛構的</small><div><a href="#">創巢數位</a><a class="cta" href="#">想要你店裡也有一個？留 Email 等上線 →</a></div></footer><script>
const items=[{n:'柔霧眉',p:6800,m:150,note:'含 30 天內補色一次'},{n:'自然款植睫',p:1200,m:120,note:'約 120 根'},{n:'濃密款植睫',p:1600,m:150,note:'約 180 根'}],state={step:0,item:null,answers:[null,null,null],date:null,time:null};const app=document.querySelector('#app'),week=['日','一','二','三','四','五','六'];function dates(){return Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i+2);return{iso:d.toISOString().slice(0,10),short:`${d.getMonth()+1}/${d.getDate()}`,w:`週${week[d.getDay()]}`,obj:d}})}function hero(){return`<header class="hero"><div class="mark">霧</div><h1>晨霧眉睫</h1><p>一人工作室・一次只照顧一位客人</p></header>`}function actions(){return`<div class="actions">${state.step?'<button class="back" onclick="back()">上一步</button>':''}<button class="next" onclick="next()">繼續</button></div>`}function render(){let c='',it=items[state.item];if(state.step===0)c=`<h2>選擇這次的項目</h2><p class="sub">完整價格與時間，預約前就知道。</p><div class="cards" style="margin-top:18px">${items.map((x,i)=>`<button class="card ${state.item===i?'selected':''}" onclick="state.item=${i};render()"><b>${x.n}・NT$ ${x.p.toLocaleString()}</b><span>${x.note}・約 ${x.m} 分鐘</span></button>`).join('')}</div>${actions()}`;if(state.step===1){let qs=['目前是否懷孕？','是否曾對色料或接睫膠過敏？','近一個月是否做過臉部雷射？'];c=`<h2>施作前安全問卷</h2><p class="sub">如實填寫，讓我們先替你確認是否適合。</p>${qs.map((q,i)=>`<div class="qa"><p>${i+1}. ${q}</p><div class="yn"><button class="${state.answers[i]===false?'chosen':''}" onclick="ans(${i},false)">否</button><button class="${state.answers[i]===true?'chosen':''}" onclick="ans(${i},true)">是</button></div></div>`).join('')}${state.answers.includes(true)?'<div class="blocked"><b>需要先私訊討論</b><br>為了安全，會先由老師了解狀況，目前不能直接預約。</div>':''}${actions()}`}if(state.step===2)c=`<h2>選擇專屬時段</h2><p class="sub">${it.n}會預留 ${it.m/60%1?it.m/60:it.m/60} 小時，不與其他客人重疊。</p><div class="dates">${dates().slice(0,4).map(d=>`<button class="date ${state.date===d.iso?'selected':''}" onclick="state.date='${d.iso}';state.time=null;render()"><span>${d.w}</span><b>${d.short}</b></button>`).join('')}</div><div class="times">${(state.item===0?['10:00','14:00']:['10:00','13:00','16:00','19:00']).map((t,i)=>`<button class="time ${state.time===t?'selected':''}" ${i===1?'disabled':''} onclick="state.time='${t}';render()">${i===1?'已滿':t}</button>`).join('')}</div>${actions()}`;if(state.step===3)c=`<h2>最後確認</h2><p class="sub">訂金會保留你的專屬長時段。</p>${recap()}<div class="actions"><button class="back" onclick="back()">上一步</button><button class="next" onclick="next()">付訂金 NT$ 1,000<br><small>（示範，不會扣款）</small></button></div>`;if(state.step===4){let d=dates().find(x=>x.iso===state.date)?.obj||new Date(),due=new Date(d);due.setDate(due.getDate()+30);c=`<div class="done"><div class="mark">✓</div><h2>預約完成</h2><p class="sub">期待陪你完成自然、耐看的樣子。</p></div>${recap()}<div class="tips"><b>術前注意事項</b><ul><li>施作前一週暫停去角質與酸類保養</li><li>當天請勿畫眉或夾睫毛</li><li>前一晚睡飽，避免飲酒</li></ul>${state.item===0?`<b>補色期限：${due.getFullYear()} 年 ${due.getMonth()+1} 月 ${due.getDate()} 日前</b>`:''}</div><button class="wide" style="width:100%;margin-top:18px" onclick="resetFlow()">再走一次示範</button>`}app.innerHTML=hero()+`<section class="wrap"><div class="steps">步驟 ${state.step+1}／5</div>${c}</section>`}function recap(){let it=items[state.item],d=dates().find(x=>x.iso===state.date);return`<div class="recap"><div><span>項目</span><b>${it.n}</b></div><div><span>時間</span><b>${d?.short||''} ${state.time||''}</b></div><div><span>費用</span><b>NT$ ${it.p.toLocaleString()}</b></div><div><span>訂金</span><b>NT$ 1,000</b></div></div>`}function next(){if(state.step===0&&state.item===null)return;if(state.step===1&&(state.answers.includes(null)||state.answers.includes(true)))return;if(state.step===2&&(!state.date||!state.time))return;state.step++;render();scrollTo(0,0)}function back(){state.step--;render()}function ans(i,v){state.answers[i]=v;render()}function resetFlow(){Object.assign(state,{step:0,item:null,answers:[null,null,null],date:null,time:null});render()}
function owner(){app.innerHTML=`<section class="owner"><div class="owner-head"><span class="metric">今日 3 位・示範數據</span><h1>晨霧工作簿</h1><p class="sub">今天的工作排程</p></div><h2>預約名單</h2><div class="appt"><time>10:00</time><div><b>林小姐・柔霧眉</b><small>問卷皆為否・訂金已付</small></div></div><div class="appt"><time>14:00</time><div><b>陳小姐・濃密款植睫</b><span class="flag">問卷：曾對接睫膠過敏</span><small>請先聯絡確認，尚未排入</small></div></div><div class="appt"><time>17:30</time><div><b>雅雯・自然款植睫</b><small>問卷皆為否・訂金已付</small></div></div><h2>補色到期名單</h2><p class="sub">未來 7 天・示範數據</p><div class="due"><div><b>姿妤</b><small>柔霧眉・8/20 施作</small></div><span>9/19 前</span></div><div class="due"><div><b>小葳</b><small>柔霧眉・8/22 施作</small></div><span>9/21 前</span></div><div class="due"><div><b>王小姐</b><small>柔霧眉・8/24 施作</small></div><span>9/23 前</span></div></section>`}document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button').forEach(x=>x.classList.remove('on'));b.classList.add('on');b.dataset.mode==='guest'?render():owner();scrollTo(0,0)});render();
</script></body></html>
