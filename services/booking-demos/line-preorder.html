<title>巷口早點預留示範</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 手機聊天介面的示範，刻意只做一套亮色（聊天介面本來就是亮的）。店家的品牌色由 build.js 從 shops.js 寫進來 */
:root{
  --brand:#FFD43B;--brand-ink:#211F1A;--dark:#165B42;--dark-ink:#FFD43B;--accent:#F45B26;--owner-ground:#FFF8DC;--new-bg:#FFF1B8;
  --ground:#DDE3EA;
  --ink:#1D2430;
  --muted:#6B7686;
  --chat:#B9C9DB;
  --bubble-me:#A9E27E;
  --bubble-shop:#FFFFFF;
  --line:#D5DCE4;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* 本機或官網直接開時沒有發布外殼的 reset，不寫這條提示框會一開場就露出來 */
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #2F6FEB;outline-offset:2px}

/* ── 外框 ───────────────────────────── */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;padding-block:20px 28px;padding-inline:16px;gap:14px}
.demobar{width:100%;max-width:820px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demobar .tag{background:var(--dark);color:var(--dark-ink);font-weight:700;font-size:12px;letter-spacing:.08em;padding:3px 9px;border-radius:4px}
.demobar .note{color:var(--muted);font-size:13px}
.demobar .restart{margin-left:auto;border:1px solid #B3BDC9;background:#fff;border-radius:999px;padding:4px 12px;font-size:13px}
.tabs{display:none}
.phones{display:flex;gap:40px;align-items:flex-start;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.col-label{font-size:13px;font-weight:700;letter-spacing:.06em;color:#3A4453}
.phone{position:relative;width:375px;height:780px;border-radius:46px;background:#0E0F11;padding:11px;box-shadow:0 30px 60px -30px rgba(20,30,50,.55),0 0 0 1px #2A2D33 inset}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;background:var(--chat)}
.status{flex:none;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;background:#fff}
.status .sig{letter-spacing:2px;font-size:11px}
.foot{width:100%;max-width:820px;text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:8px;align-items:center}
.foot .cta{display:inline-block;background:var(--dark);color:#fff;text-decoration:none;font-weight:700;padding:11px 20px;border-radius:10px}
.foot .brand{color:var(--ink)}

/* ── 客人：聊天室 ───────────────────── */
.chat-head{flex:none;height:52px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.chat-head .back{font-size:22px;color:#333;width:20px}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:900;font-size:15px}
.chat-head .who{display:flex;flex-direction:column;line-height:1.2}
.chat-head b{font-size:16px}
.chat-head small{font-size:11px;color:var(--muted)}
.chat-head .icons{margin-left:auto;color:#555;letter-spacing:10px;font-size:16px}
.log{flex:1;overflow-y:auto;padding:14px 12px 18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.day{align-self:center;background:rgba(40,55,75,.28);color:#fff;font-size:11px;padding:2px 10px;border-radius:999px}
.msg{display:flex;gap:7px;align-items:flex-end;max-width:100%}
.msg.shop{align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:32px;height:32px;font-size:13px;align-self:flex-start}
.bubble{max-width:236px;padding:9px 12px;border-radius:18px;font-size:14.5px;line-height:1.55;white-space:pre-line;word-break:break-word}
.shop .bubble{background:var(--bubble-shop);border-top-left-radius:6px}
.me .bubble{background:var(--bubble-me);border-top-right-radius:6px}
.meta{font-size:10px;color:#4E5B6C;white-space:nowrap;line-height:1.3;text-align:right;font-variant-numeric:tabular-nums}
.shop .meta{text-align:left}
.enter{animation:pop .28s ease-out}
@keyframes pop{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 送出後的確認卡片 */
.card{width:236px;background:#fff;border-radius:16px;overflow:hidden;border-top-left-radius:6px}
.card-top{background:var(--brand);color:var(--brand-ink);padding:10px 14px;font-weight:900;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-top span{font-size:11px;font-weight:700;background:var(--dark);color:var(--dark-ink);padding:2px 7px;border-radius:4px;white-space:nowrap}
.card-num{padding:12px 14px 4px;display:flex;align-items:baseline;gap:8px}
.card-num strong{font-size:32px;font-weight:900;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.card-num small{color:var(--muted);font-size:12px}
.card dl{margin:0;padding:4px 14px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.card dt{color:var(--muted);white-space:nowrap}
.card dd{margin:0;font-weight:500}
.card .hint{background:#F6F7F9;font-size:12px;color:#4E5B6C;padding:8px 14px}

/* 圖文選單（1200×810 的比例） */
.menu{flex:none;background:#fff;border-top:1px solid var(--line)}
.rich{position:relative;display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1200/810;gap:2px;background:#fff;max-width:100%}
.tile{border:0;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:14px 16px;text-align:left}
.tile b{font-size:19px;font-weight:900;letter-spacing:.04em}
.tile small{font-size:12px;opacity:.85;line-height:1.35;white-space:pre-line}
.tile.main{grid-row:1/3;background:var(--brand);color:var(--brand-ink)}
.tile.main b{font-size:26px}
.tile.main .pill{font-size:13px;font-weight:700;background:var(--dark);color:var(--dark-ink);align-self:flex-start;padding:3px 9px;border-radius:999px;margin-top:6px}
.tile.side{background:var(--dark);color:#fff}
.tile.side b{color:var(--dark-ink)}
.tile:active{filter:brightness(.93)}
.coach{position:absolute;left:10px;top:-44px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;box-shadow:0 6px 14px -6px rgba(0,0,0,.5);pointer-events:none;animation:bob 1.6s ease-in-out infinite}
.coach:after{content:"";position:absolute;left:28px;bottom:-6px;border:6px solid transparent;border-top-color:var(--accent);border-bottom:0}
@keyframes bob{50%{transform:translateY(-4px)}}
.menubar{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid var(--line);font-size:13px;color:#445}
.menubar .kb{border:1px solid #C7CED7;background:#fff;border-radius:6px;width:30px;height:26px;font-size:13px}
.menubar .toggle{flex:1;border:0;background:none;font-weight:700;color:#334;text-align:center}

/* 聊天室裡開的點單頁（從底部滑上來） */
.sheet{position:absolute;inset:34px 0 0;background:#fff;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:5;border-radius:14px 14px 0 0;box-shadow:0 -10px 30px -12px rgba(0,0,0,.45)}
.sheet.open{transform:none}
.sheet-bar{flex:none;height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line)}
.sheet-bar .x{border:0;background:none;font-size:20px;width:30px;height:30px}
.sheet-bar .t{display:flex;flex-direction:column;line-height:1.2}
.sheet-bar .t b{font-size:14px}
.sheet-bar .t small{font-size:10.5px;color:var(--muted)}
.sheet iframe{flex:1;width:100%;border:0;background:#fff}
.sheet-done{flex:none;padding:10px 12px 14px;border-top:1px solid var(--line);background:#fff}
.sheet-done button{width:100%;border:0;background:var(--dark);color:#fff;font-weight:700;padding:13px;border-radius:12px;font-size:15px}

/* 手機版：老闆那邊有新單時的提示 */
.toast{position:absolute;left:12px;right:12px;bottom:14px;z-index:6;background:var(--dark);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 12px 26px -10px rgba(0,0,0,.6)}
.toast b{color:var(--dark-ink)}
.toast button{margin-left:auto;border:0;background:var(--dark-ink);color:var(--dark);font-weight:900;border-radius:999px;padding:6px 12px;white-space:nowrap}

/* ── 老闆：後台 ───────────────────── */
.owner .screen{background:var(--owner-ground)}
.owner .status{background:var(--owner-ground)}
.o-head{flex:none;padding:10px 18px 14px;display:flex;flex-direction:column;gap:2px;border-bottom:3px solid var(--dark)}
.o-head small{color:#6A6456;font-size:12px;font-weight:700;letter-spacing:.06em}
.o-head h2{margin:0;font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px;text-wrap:balance}
.o-head .live{font-size:11px;font-weight:700;background:#1F8A4C;color:#fff;padding:2px 8px;border-radius:999px;white-space:nowrap}
.o-stats{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 6px}
.o-stat{background:#fff;border:1px solid #E2DCCB;border-radius:12px;padding:10px 12px}
.o-stat small{display:block;font-size:11px;color:#7B7465}
.o-stat strong{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.o-note{flex:none;font-size:12px;color:#6A6456;padding:6px 18px 8px}
.o-list{flex:1;overflow-y:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:8px}
.o-row{background:#fff;border:1px solid #E2DCCB;border-radius:12px;display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:10px;padding:10px 12px}
.o-row time{font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;line-height:1.25}
.o-row time small{display:block;font-size:10px;font-weight:700;color:#8A8372}
.o-row b{display:block;font-size:14px}
.o-row .opt{font-size:12px;color:#6A6456}
.o-row .num{font-weight:900;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.o-row .chip{display:block;margin-top:3px;font-size:10.5px;font-weight:700;background:#F0EBDD;color:#6A6456;padding:1px 7px;border-radius:999px;text-align:center;white-space:nowrap}
.o-row.new{border:2px solid var(--dark);background:var(--new-bg)}
.o-row.new .chip{background:var(--accent);color:#fff}
.flash{animation:flash 1.2s ease-out 2}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(0,0,0,.35)}100%{box-shadow:0 0 0 12px rgba(0,0,0,0)}}
.o-wait{border:1.5px dashed #CFC6AE;border-radius:12px;padding:14px;text-align:center;font-size:13px;color:#7B7465}
.push{position:absolute;left:10px;right:10px;top:40px;z-index:4;background:rgba(28,28,30,.93);color:#fff;border-radius:18px;padding:11px 14px;display:flex;gap:11px;align-items:flex-start;transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.9,.25,1.15);box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
.push.show{transform:none}
.push .avatar{width:34px;height:34px;border-radius:9px}
.push .p-t{display:flex;justify-content:space-between;font-size:12px;color:#C9CCD2}
.push .p-b{font-size:14px;font-weight:700;line-height:1.35}
.push .p-s{font-size:12.5px;color:#DDE0E5}
.push .grow{flex:1;min-width:0}

/* ── 窄螢幕：一次一支手機，上面切換 ─────────── */
@media (max-width:879px){
  .stage{padding-block:10px 20px;gap:10px}
  .tabs{display:flex;width:100%;max-width:430px;background:#fff;border-radius:12px;padding:4px;gap:4px;box-shadow:0 1px 0 #C9D1DB}
  .tabs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:700;font-size:14px;color:#5A6575;position:relative}
  .tabs button[aria-selected="true"]{background:var(--dark);color:#fff}
  .tabs .dot{position:absolute;top:6px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .phones{width:100%;flex-direction:column;align-items:center;gap:0}
  .col{width:100%;max-width:430px}
  .col-label{display:none}
  .demobar{max-width:430px}
}
@media (max-width:519px){
  /* 手機上直接滿版：螢幕本身就是那支手機 */
  .stage{padding-inline:0;padding-block:0 18px}
  .demobar,.tabs{margin-inline:12px;width:calc(100% - 24px)}
  .demobar{padding-top:10px}
  .phone{width:100%;height:calc(100svh - 96px);min-height:560px;border-radius:0;padding:0;background:none;box-shadow:none}
  .screen{border-radius:0}
  .status{display:none}
  .sheet{inset:0}
  .push{top:8px}
  .foot{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

<div class="stage">
  <div class="demobar">
    <span class="tag">示範</span>
    <span class="note">店名與內容都是虛構的，不會真的送出</span>
    <button class="restart" id="restart" type="button">重新開始</button>

              <button class="tile side" id="btnQuery" type="button"><b id="mQ"></b><small id="mQSub"></small></button>

<script>
// ── 小工具（shops.js 會用到） ─────────────────
const pad = n => String(n).padStart(2, '0');
const plus = k => { const d = new Date(); d.setDate(d.getDate() + k); return d; };
const day = k => { const d = plus(k); return `${d.getMonth() + 1}/${d.getDate()}`; };
const wk = k => '週' + '日一二三四五六'[plus(k).getDay()];
const slot = k => { const d = new Date(); d.setSeconds(0, 0); d.setMinutes(Math.ceil((d.getMinutes() + 10) / 10) * 10 + k * 10); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const pick = (o, re) => ((o.pairs || []).find(p => re.test(p[0])) || [, ''])[1];
const money = s => { const m = String(s || '').match(/\$\s*([\d,]+)/); return m ? +m[1].replace(/,/g, '') : 0; };
const int = s => { const m = String(s || '').match(/\d+/); return m ? +m[0] : 0; };

// 10 家店的 LINE 示範設定。build.js 會把這份原封不動塞進每一頁。
// 在頁面裡可以用的小工具（模板裡定義）：
//   day(k)   今天加 k 天，回傳「9/24」
//   wk(k)    今天加 k 天是星期幾，回傳「週三」
//   slot(k)  現在往後第 k 個 10 分鐘整點，回傳「16:30」（只有飲料店用）
//   pick(o, /正規式/)  從完成畫面讀到的摘要裡，找標籤符合的那一格的值
//   money(s) 從「NT$ 2,400・約 3 小時」這種字串取出 2400
//   int(s)   取出第一個整數
//
// 每家店的欄位：
//   file      原始點單頁（創巢/03-素材/demo-預約頁/ 底下），原檔不會被改
//   reporter  'drink'＝日日茶舖專用（讀 S 狀態）；其他都是 'generic'（讀完成畫面的摘要）
//   peek      generic 讀不到品項時，在點單頁裡每 0.25 秒偷看一次，回傳 [[標籤, 值], …]
//   newRow(o) 客人送出後，老闆清單要多的那一列：t 時間、item 品項、opt 補充、n 算進第二格統計的數字
const SHOPS = {
  drink: {
    file: 'booking-drink.html', reporter: 'drink', title: '日日茶舖預點示範',
    shop: '日日茶舖', mark: '茶',
    colors: { brand: '#FFD84D', brandInk: '#171717', dark: '#171717', darkInk: '#FFD84D', accent: '#E8412A', ownerGround: '#F4F1E8', newBg: '#FFFBE6' },

italai.com/services/booking\">想要你店裡也有一個？留 Email 等上線 →\u003c/a>\u003ca class=\"brand\" href=\"https://nestdigitalai.com\">創巢數位\u003c/a>\u003c/footer>\n\u003c/div>\n\u003cscript>\n(() => {\n  const products=[\n    {id:'egg',name:'招牌粉漿蛋餅',price:45,stock:18,desc:'外酥裡嫩，九層塔醬油膏'},\n    {id:'rice',name:'古早味飯糰',price:50,stock:9,desc:'菜脯、肉鬆、油條、滷蛋'},\n    {id:'cake',name:'煎蘿蔔糕',price:40,stock:0,desc:'兩片，附蒜蓉醬油'},\n    {id:'soy',name:'非基改豆漿',price:25,stock:14,desc:'冷飲，微糖'}\n  ];\n  const state={step:1,product:'',qty:1,noScallion:false,sauceAside:false,time:'',name:'',last3:'',number:'A037',sold:{cake:true}};\n  const guestMain=document.querySelector('#guestMain'), ownerMain=document.querySelector('#ownerMain');\n  const fmtDate=()=>new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'short'}).format(new Date(Date.now()+864e5));\n  function times(){const out=[];for(let m=390;m\u003c=630;m+=15){const h=Math.floor(m/60),mm=String(m%60).padStart(2,'0'),label=`${h}:${mm}`;out.push({label,left:([420,465,510,570].includes(m)?0:((m/15)%4===0?2:5))})}return out}\n  function prog(){return `\u003cdiv class=\"progress\">${[1,2,3,4,5].map(n=>`\u003cspan class=\"${state.step>=n?'on':''}\">\u003c/span>`).join('')}\u003c/div>`}\n  function selectedProduct(){return products.find(p=>p.id===state.product)}\n  function renderGuest(){let h=prog();\n    if(state.step===1)h+=`\u003cdiv class=\"stephead\">\u003ch2>明天早餐想吃什麼？\u003c/h2>\u003cspan class=\"stepno\">步驟 1／5\u003c/span>\u003c/div>\u003cdiv class=\"date-note\">${fmtDate()}・剩餘份數即時顯示\u003c/div>\u003cdiv class=\"products\">${products.map(p=>{const sold=state.sold[p.id]||p.stock===0;return `\u003cbutton class=\"product ${state.product===p.id?'selected':''} ${sold?'sold':''}\" data-product=\"${p.id}\" ${sold?'disabled':''}>\u003cspan>\u003ch3>${p.name}\u003c/h3>\u003cspan class=\"price\">$${p.price}\u003c/span>・\u003cspan class=\"stock\">${sold?'已售完':`剩 ${p.stock} 份`}\u003c/span>\u003cbr>\u003csmall>${p.desc}\u003c/small>\u003c/span>${sold?'\u003cspan class=\"soldtag\">已售完\u003c/span>':`\u003cspan class=\"fake-check\">${state.product===p.id?'✓':''}\u003c/span>`}\u003c/button>`}).join('')}\u003c/div>\u003cdiv class=\"actions single\">\u003cbutton class=\"btn primary\" data-next ${!state.product?'disabled':''}>選好了，調整份數\u003c/button>\u003c/div>`;\n    if(state.step===2){const p=selectedProduct();h+=`\u003cdiv class=\"stephead\">\u003ch2>份數與客製\u003c/h2>\u003cspan class=\"stepno\">步驟 2／5\u003c/span>\u003c/div>\u003cdiv class=\"review\">\u003cstrong>${p.name}\u003c/strong>\u003cspan class=\"price\" style=\"float:right\">$${p.price*state.qty}\u003c/span>\u003cdiv class=\"qtyrow\">\u003cspan>數量\u003c/span>\u003cspan class=\"qty\">\u003cbutton data-qty=\"-1\" aria-label=\"減少一份\">−\u003c/button>\u003cstrong>${state.qty}\u003c/strong>\u003cbutton data-qty=\"1\" aria-label=\"增加一份\">＋\u003c/button>\u003c/span>\u003c/div>\u003cdiv class=\"options\">\u003ch3>要怎麼做？\u003c/h3>\u003clabel class=\"checkline\">\u003cinput type=\"checkbox\" data-option=\"noScallion\" ${state.noScallion?'checked':''}>不要蔥\u003c/label>\u003clabel class=\"checkline\">\u003cinput type=\"checkbox\" data-option=\"sauceAside\" ${state.sauceAside?'checked':''}>辣醬另外放\u003c/label>\u003c/div>\u003c/div>${actions('回去選品項','選取餐時間')}`}\n    if(state.step===3)h+=`\u003cdiv class=\"stephead\">\u003ch2>幾點來拿？\u003c/h2>\u003cspan class=\"stepno\">步驟 3／5\u003c/span>\u003c/div>\u003cdiv class=\"date-note\">每 15 分鐘限量，讓現場不用久等\u003c/div>\u003cdiv class=\"times\">${times().map(t=>`\u003cbutton class=\"timebtn ${state.time===t.label?'selected':''}\" data-time=\"${t.label}\" ${t.left===0?'disabled':''}>${t.label}\u003csmall>${t.left===0?'已滿':`還可收 ${t.left} 單`}\u003c/small>\u003c/button>`).join('')}\u003c/div>${actions('回上一步','填取餐資料',!state.time)}`;\n    if(state.step===4)h+=`\u003cdiv class=\"stephead\">\u003ch2>取餐資料\u003c/h2>\u003cspan class=\"stepno\">步驟 4／5\u003c/span>\u003c/div>\u003cdiv class=\"field\">\u003clabel for=\"guestName\">怎麼稱呼你？\u003c/label>\u003 utton>\u003c/div>`}\n  function bindGuest(){document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{state.product=b.dataset.product;state.qty=1;renderGuest()});document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{state.time=b.dataset.time;renderGuest()});document.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{const p=selectedProduct();state.qty=Math.max(1,Math.min(p.stock,state.qty+Number(b.dataset.qty)));renderGuest()});document.querySelectorAll('[data-option]').forEach(i=>i.onchange=()=>{state[i.dataset.option]=i.checked});const name=document.querySelector('#guestName'),last=document.querySelector('#last3');if(name)name.oninput=()=>{state.name=name.value;toggleNext()};if(last)last.oninput=()=>{last.value=last.value.replace(/\\D/g,'').slice(0,3);state.last3=last.value;toggleNext()};document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{state.step++;renderGuest();scrollTop()});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{state.step--;renderGuest();scrollTop()});const reset=document.querySelector('[data-reset]');if(reset)reset.onclick=()=>{Object.assign(state,{step:1,product:'',qty:1,noScallion:false,sauceAside:false,time:'',name:'',last3:''});renderGuest();scrollTop()}}\n  function toggleNext(){const b=document.querySelector('[data-next]');if(b)b.disabled=!(state.name.trim()&&/^\\d{3}$/.test(state.last3))}\n  function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}function esc(v){return String(v).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\n  function renderOwner(){const demoOrders=[['06:45','A012','飯糰 × 2','不要蔥'],['07:15','A019','粉漿蛋餅 × 1、豆漿 × 1','辣醬另外放'],['07:30','A023','粉漿蛋餅 × 2','照店家原味'],['08:15','A031','飯糰 × 1、蘿蔔糕 × 1','不要蔥']];ownerMain.innerHTML=`\u003cdiv class=\"statgrid\">\u003cdiv class=\"stat\">\u003cspan class=\"demo\">示範數據\u003c/span>\u003cstrong>27\u003c/strong>明天預留份數\u003c/div>\u003cdiv class=\"stat\">\u003cspan class=\"demo\">示範數據\u003c/span>\u003cstrong>11\u003c/strong>張取餐單\u003c/div>\u003c/div>\u003ch2>依取餐時間排序的出餐單\u003c/h2>\u003cdiv class=\"orders\">${demoOrders.map(o=>`\u003cdiv class=\"order\">\u003cdiv class=\"ordertime\">${o[0]}\u003c/div>\u003cdiv class=\"orderbody\">\u003cstrong>${o[1]}・${o[2]}\u003c/strong>\u003csmall>${o[3]}\u003c/small>\u003c/div>\u003c/div>`).join('')}\u003c/div>\u003ch2>品項預留與剩餘 \u003cspan class=\"demo\">示範數據\u003c/span>\u003c/h2>\u003cdiv class=\"inventory\">${products.map((p,i)=>{const reserved=[12,7,10,8][i],remain=state.sold[p.id]?0:Math.max(0,p.stock);return `\u003cdiv class=\"inv\">\u003cdiv class=\"invtop\">\u003cspan>${p.name}\u003c/span>\u003cspan>預留 ${reserved}・剩 ${remain}\u003c/span>\u003c/div>\u003cdiv class=\"bar\">\u003ci style=\"width:${Math.min(100,reserved/(reserved+remain||1)*100)}%\">\u003c/i>\u003c/div>\u003c/div>`}).join('')}\u003c/div>\u003ch2>明天完售開關\u003c/h2>\u003cdiv class=\"toggles\">${products.map(p=>`\u003cdiv class=\"toggleline\">\u003cstrong>${p.name}\u003c/strong>\u003cbutton class=\"toggle ${state.sold[p.id]?'on':''}\" data-sold=\"${p.id}\" aria-label=\"切換${p.name}完售狀態\" aria-pressed=\"${state.sold[p.id]?'true':'false'}\">\u003ci>\u003c/i>\u003c/button>\u003c/div>`).join('')}\u003c/div>`;document.querySelectorAll('[data-sold]').forEach(b=>b.onclick=()=>{state.sold[b.dataset.sold]=!state.sold[b.dataset.sold];if(state.sold[state.product])state.product='';renderOwner();renderGuest()})}\n  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#guestView').classList.toggle('hidden',b.dataset.mode!=='guest');document.querySelector('#ownerView').classList.toggle('hidden',b.dataset.mode!=='owner');if(b.dataset.mode==='owner')renderOwner();scrollTop()});\n  renderGuest();renderOwner();\n})();\n\u003c/script>\n\u003cscript>\n(function(){var mem=[],peekMem=[],sent=false,PEEK=() => {\n      const r = document.querySelector('.review strong'), q = document.querySelector('.qty strong');\n      return r && q ? [['餐點', `${r.textContent.trim()} × ${q.textContent.trim()}`]] : null;\n    };\nfunction vis(e){var r=e.getBoundingClientRect();return r.width>0&&r.height>0}\nfunction tx(e){return (e.innerText||e.textContent||'').replace(/\\s+/g,' ').trim()}\nfunction scrape(){var out=[];\n  [].forEach.call(document.querySelectorAll('dl'),function(dl){if(!vis(dl))return;\n    [].forEach.call(dl.querySelectorAll('dt'),function(dt){var dd=dt.nextElementSibling;if(dd&&dd.tagName==='DD')out.push([tx(dt),tx(dd)])})});\n  if(!out.length)[].forEach.call(document.querySelectorAll('.summary>div,.recap>div,.review>div,.sum>div'),function(d){if(!vis(d))return;\n    var a=d.querySelector('span,dt'),b=d.querySelector('b,dd');if(a&&b&&a!==b&&!a.contains(b))out.push([tx(a),tx(b)])});\n  return out.filter(function(p){return p[0]&&p[1]&&p[0].length\u003c=6})}\nsetInterval(function(){try{\n  var p=scrape();if(p.length>=2)mem=p;\n  if(PEEK){var k=PEEK();if(k&&k.length)peekMem=k}\n  var h=[].filter.call(document.querySelectorAll('h2'),vis).map(tx).join(' ');\n  var done=/完成|成功|留好/.test(h);\n  if(done&&!sent){sent=true;\n    var numEl=document.querySelector('.number'),tm=document.querySelector('.picktime'),tk=document.querySelector('.ticket small');\n    var time=tm?((tk&&/明天/.test(tx(tk))?'明天 ':'')+tx(tm).replace(/\\s*取餐/,'')):'';\n    var pairs=(p.length>=2?p:mem).slice();\n    peekMem.forEach(function(x){if(!pairs.some(function(y){return y[0]===x[0]}))pairs.unshift(x)});\n    parent.postMessage({src:'booking-demo',d:{title:h,num:numEl?tx(numEl):'',time:time,pairs:pairs}},'*')}\n  if(!done)sent=false;\n}catch(e){}},250)})();\n\u003c/script>\u003c/body>\n\u003c/html>\n";

const $ = s => document.querySelector(s);
const log = $('#log'), sheet = $('#sheet'), frame = $('#booking');
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const narrow = () => matchMedia('(max-width:879px)').matches;

let order = null, posted = false, runs = 0, rows = [];

// ── 把設定填進畫面 ───────────────────────────
document.querySelectorAll('.mark').forEach(e => e.textContent = C.mark);
document.querySelectorAll('.shop-name').forEach(e => e.textContent = C.shop);
$('#mMain').textContent = C.menu.main; $('#mMainSub').textContent = C.menu.mainSub; $('#mPill').textContent = C.menu.pill;
$('#mQ').textContent = C.menu.q; $('#mQSub').textContent = C.menu.qSub;
$('#mH').textContent = C.menu.h; $('#mHSub').textContent = C.menu.hSub;
$('#sheetTitle').textContent = C.sheet;
$('#pushApp').textContent = C.owner.app.split('・')[0] + ' 通知';
$('#oApp').textContent = C.owner.app; $('#oHead').textContent = C.owner.head;
$('#aLabel').textContent = C.owner.a[0]; $('#aUnit').textContent = C.owner.a[1];
$('#bLabel').textContent = C.owner.b[0]; $('#bUnit').textContent = C.owner.b[1];
$('#oNote').textContent = C.owner.note;

function tickClock() { document.querySelectorAll('.clock').forEach(e => e.textContent = nowHM()); }
tickClock(); setInterval(tickClock, 20000);

// ── 聊天室 ──────────────────────────────────
function scrollDown() { requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; }); }
function add(who, inner, read) {
  const m = document.createElement('div');
  m.className = 'msg ' + who + ' enter';
  const meta = `<span class="meta">${read ? '已讀<br>' : ''}${nowHM()}</span>`;
  m.innerHTML = who === 'shop' ? `<span class="avatar" aria-hidden="true">${esc(C.mark)}</span>${inner}${meta}` : `${inner}${meta}`;
  log.appendChild(m); scrollDown();
}
const say = (who, text, read) => add(who, `<div class="bubble">${esc(text)}</div>`, read);
const shopLater = (text, ms = 650) => setTimeout(() => say('shop', text), ms);
function welcome() {
  log.innerHTML = '<div class="day">今天</div>';
  C.welcome.forEach(t => say('shop', t));
}

// ── 老闆那一頭 ───────────────────────────────
function resetOwner() {
  rows = C.owner.rows().map(r => ({ ...r }));
  $('#push').classList.remove('show');
  $('#ownerDot').hidden = true;
  renderOwner();
}
function renderOwner() {
  if (C.owner.sort) { const key = r => (r.tom ? '1' : '0') + r.t; rows.sort((x, y) => key(x) < key(y) ? -1 : 1); }
  $('#olist').innerHTML = rows.map(r => `
    <div class="o-row${r.isNew ? ' new flash' : ''}">
      <time>${esc(r.t)}${r.tom ? '<small>明天</small>' : ''}</time>
      <div><b>${esc(r.item)}</b><span class="opt">${esc(r.opt || '')}</span></div>
      <div class="num">${esc(r.num)}<span class="chip">${r.isNew ? '新的' : '已排'}</span></div>
    </div>`).join('') + (order ? '' : `<div class="o-wait">${esc(C.owner.wait)}</div>`);
  const b = rows.reduce((s, r) => s + (r.n || 0), 0);
  $('#aVal').textContent = rows.length;
  $('#bVal').textContent = C.owner.money ? b.toLocaleString() : b;
}
function flashPush() { const p = $('#push'); p.classList.remove('show'); void p.offsetWidth; p.classList.add('show'); setTimeout(() => p.classList.remove('show'), 6000); }
function ownerReceive(o) {
  rows.forEach(r => r.isNew = false);
  const r = { ...C.newRow(o), num: o.num, isNew: true };
  if (C.owner.sort) rows.push(r); else rows.unshift(r);
  renderOwner();
  $('#pushTitle').textContent = `新的單 ${o.num}・${r.tom ? '明天 ' : ''}${r.t}`;
  $('#pushBody').textContent = [r.item, r.opt].filter(Boolean).join('・');
  flashPush();
  if (narrow()) $('#ownerDot').hidden = false;
}

// ── 點單頁（聊天室裡開） ─────────────────────
function loadBooking() { frame.srcdoc = BOOKING_HTML; $('#sheetDone').hidden = true; }
function openSheet() { $('#coach').hidden = true; sheet.classList.add('open'); sheet.setAttribute('aria-hidden', 'false'); }
function closeSheet() {
  sheet.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true');
  if (order && !posted) { posted = true; setTimeout(postConfirm, 380); }
}
function postConfirm() {
  const o = order;
  add('shop', `<div class="card">
    <div class="card-top">${esc(C.card.title)} <span>${esc(C.shop)}</span></div>
    <div class="card-num"><strong>${esc(o.num)}</strong><small>${esc(C.card.numLabel)}</small></div>
    <dl>${o.pairs.map(p => `<dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd>`).join('')}</dl>
    <div class="hint">${esc(C.card.hint)}</div>
  </div>`);
  if (narrow()) setTimeout(() => { $('#toast').hidden = false; }, 900);
}
function nextNum() { return C.card.prefix + String(38 + runs).padStart(3, '0'); }

window.addEventListener('message', e => {
  const m = e.data;
  if (!m || order) return;
  if (m.src === 'drink-demo' && m.d.step === 6) {
    // 日日茶舖：直接讀點單頁的狀態
    const d = m.d, tops = d.toppings.length ? d.toppings.join('、') : '不加料';
    const opt = `${d.sugar}・${d.ice}・${tops}`, total = (d.price + d.toppings.length * 10) * d.qty;
    order = {
      num: 'A' + (137 + d.qty), drink: d.drink, qty: d.qty, time: d.time, tom: d.tom, opt,
      pairs: [['品項', `${d.drink} × ${d.qty}`], ['做法', opt], ['取餐', `${d.tom ? '明天' : '今天'} ${d.time}`], ['稱呼', d.name], ['合計', `$${total}・到店付款`]],
    };
  } else if (m.src === 'booking-demo') {
    // 其他九家：讀完成畫面的摘要
    const d = m.d;
    const pairs = d.pairs.filter(p => p[1] && !/^(無|—|-)$/.test(p[1])).slice(0, 6);
    if (d.time && !pairs.some(p => /取|時間/.test(p[0]))) pairs.push(['取餐', d.time]);   // 早點的時間只在票券上
    order = { num: d.num || nextNum(), time: d.time, pairs };
  } else return;
  $('#sheetDone').hidden = false;
  ownerReceive(order);                                    // 客人一送出，老闆那邊同時收到
});

// ── 圖文選單 ─────────────────────────────────
$('#btnMain').onclick = openSheet;
$('#btnHours').onclick = () => { $('#coach').hidden = true; say('me', C.menu.h, true); shopLater(C.hours); };
$('#btnQuery').onclick = () => {
  $('#coach').hidden = true;
  say('me', C.menu.q, true);
  if (order) shopLater(`你的${C.noun}：${order.num}\n` + order.pairs.slice(0, 4).map(p => `${p[0]}：${p[1]}`).join('\n'));
  else shopLater(C.none);
};
function setMenu(open) { $('#rich').hidden = !open; $('#menuToggle').textContent = open ? '選單 ▾' : '選單 ▴'; }
$('#menuToggle').onclick = () => setMenu($('#rich').hidden);
$('#kb').onclick = () => setMenu($('#rich').hidden);
$('#sheetClose').onclick = closeSheet;
$('#backToChat').onclick = closeSheet;

// ── 窄螢幕的分頁 ─────────────────────────────
function showTab(which) {
  const g = which === 'guest';
  $('#tab-guest').setAttribute('aria-selected', g);
  $('#tab-owner').setAttribute('aria-selected', !g);
  $('#col-guest').hidden = !g;
  $('#col-owner').hidden = g;
  if (!g) { $('#ownerDot').hidden = true; $('#toast').hidden = true; if (order) flashPush(); }
}
$('#tab-guest').onclick = () => showTab('guest');
$('#tab-owner').onclick = () => showTab('owner');
$('#toastGo').onclick = () => showTab('owner');
function applyLayout() {
  if (narrow()) showTab($('#tab-owner').getAttribute('aria-selected') === 'true' ? 'owner' : 'guest');
  else { $('#col-guest').hidden = false; $('#col-owner').hidden = false; }
}
matchMedia('(max-width:879px)').addEventListener('change', applyLayout);

// ── 重新開始 ─────────────────────────────────
function start() {
  if (order) runs++;
  order = null; posted = false;
  sheet.classList.remove('open'); $('#toast').hidden = true;
  $('#coach').hidden = false; setMenu(true);
  welcome(); resetOwner(); loadBooking();
  if (narrow()) showTab('guest'); else applyLayout();
}
$('#restart').onclick = start;
start();
</script>
