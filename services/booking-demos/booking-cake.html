<!-- NEST-VERSION: 2026-09-15-v1 -->
<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小麥日常烘焙｜客製蛋糕預訂示範</title><meta name="description" content="小麥日常烘焙客製蛋糕預訂，尺寸、口味、字卡與取貨一次確認。"><meta property="og:title" content="小麥日常烘焙｜蛋糕預訂"><meta property="og:description" content="選好蛋糕細節與取貨時間，安心完成預訂。"><meta name="robots" content="noindex"><meta name="nest-version" content="2026-09-15-v1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet"><style>
:root{--berry:#7b2944;--pink:#f7e5e9;--cream:#fffaf2;--brown:#4b352f;--line:#decac4}*{box-sizing:border-box}body{margin:0;background:#efe6df;color:var(--brown);font:16px/1.55 'Noto Sans TC',sans-serif}.app{max-width:480px;min-height:100vh;margin:auto;background:var(--cream);overflow:hidden}.switch{position:sticky;top:0;z-index:4;padding:9px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#fffaf2eF;border-bottom:1px solid var(--line)}button{font-family:inherit}.switch button{min-height:44px;border:1px solid var(--berry);border-radius:22px;background:white;color:var(--berry);font-weight:700}.switch .on{background:var(--berry);color:white}.hero{text-align:center;padding:30px 24px 25px;background:var(--pink);position:relative}.hero:before,.hero:after{content:'✦';position:absolute;color:#b87588;font-size:26px}.hero:before{left:32px;top:24px}.hero:after{right:30px;bottom:20px}.hero h1{font:700 clamp(27px,8vw,38px)/1.25 'Noto Serif TC';margin:5px auto;text-wrap:balance}.hero p{margin:4px 0}.content{padding:22px 18px 36px}.problem{font-size:14px;padding:12px;background:white;border:1px dashed var(--berry);margin-bottom:18px}.progress{text-align:center;color:var(--berry);font-weight:700;font-size:14px;margin-bottom:16px}h2{font:700 24px/1.3 'Noto Serif TC';margin:0 0 5px;text-wrap:balance}.hint{margin:0 0 18px;color:#7d6862}.grid{display:grid;gap:11px}.choice{min-height:64px;border:1px solid var(--line);border-radius:18px;background:white;padding:13px 16px;text-align:left;color:var(--brown);font-size:16px;display:flex;justify-content:space-between;align-items:center}.choice.on{border:2px solid var(--berry);background:var(--pink)}.choice:disabled{opacity:.5}.choice small{display:block;color:#816d67}.checks label{display:flex;gap:12px;align-items:center;padding:14px;background:white;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;min-height:54px}.checks input{width:22px;height:22px;accent-color:var(--berry)}textarea,input{font:16px inherit}.text{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white}.count{text-align:right;font-size:14px}.nav{display:flex;gap:10px;margin-top:22px}.btn{min-height:48px;border:1px solid var(--berry);border-radius:24px;padding:10px 18px;font-weight:700;background:white;color:var(--berry)}.next{flex:1;background:var(--berry);color:white}.slots{display:flex;gap:8px;flex-wrap:wrap}.slot{min-height:46px;border:1px solid var(--berry);border-radius:23px;background:white;padding:8px 14px}.slot.on{background:var(--berry);color:white}.fields{display:grid;gap:12px}.fields input{width:100%;min-height:48px;margin-top:5px}.sum{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}.sum dl{display:grid;grid-template-columns:82px 1fr;gap:8px;margin:0}.sum dt{color:#8a716b}.sum dd{margin:0;font-weight:700}.success{text-align:center}.cakeicon{width:84px;height:70px;background:var(--berry);border-radius:8px 8px 20px 20px;margin:15px auto;color:white;display:grid;place-items:center;font-size:36px}.footer{text-align:center;background:#4b352f;color:white;padding:25px 18px 36px;font-size:13px}.footer .cta{display:block;background:var(--pink);color:var(--berry);min-height:48px;padding:13px;margin:12px 0;border-radius:24px;text-decoration:none;font-weight:700}.footer a{color:white}.daybar{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.bar{height:10px;background:#eadcda;border-radius:9px}.bar i{display:block;height:100%;background:var(--berry);border-radius:9px}.order{background:white;border-radius:14px;padding:14px;margin:10px 0;border:1px solid var(--line)}.status{display:inline-block;padding:3px 8px;background:var(--pink);color:var(--berry);font-size:13px;border-radius:12px}@media(max-width:374px){.hero h1{font-size:26px}.content{padding-left:14px;padding-right:14px}}
</style></head><body><main class="app"><nav class="switch"><button class="on" data-v="g">客人看到的</button><button data-v="o">老闆看到的</button></nav><div id="screen"></div><footer class="footer"><div>這是創巢數位做的示範頁，店名與內容都是虛構的</div><a class="cta" href="#">想要你店裡也有一個？留 Email 等上線 →</a><a href="#">創巢數位</a></footer></main><script>
const S={step:0,size:'',price:0,flavor:'',decor:[],card:'',date:'',time:'',name:'',phone:''};const sizes=[['6 吋',980,'約 6–8 人'],['8 吋',1380,'約 10–12 人'],['10 吋',1880,'約 14–18 人']];const flavors=['香草草莓鮮奶油','法芙可可脆片','伯爵茶蜜桃','焙茶栗子'];const days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i+3);return d});const fmt=d=>`${d.getMonth()+1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）`;const screen=document.querySelector('#screen');document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('on',x===b));b.dataset.v==='o'?owner():render()});
function head(){return `<section class="hero"><small>小麥日常烘焙・客製蛋糕</small><h1>把想說的話，做成一顆蛋糕</h1><p>尺寸、口味、字卡都幫你記好。</p></section>`}function nav(ok=true,l='下一步'){return `<div class="nav">${S.step?'<button class="btn" onclick="S.step--;render()">上一步</button>':''}<button class="btn next" ${ok?'':'disabled'} onclick="S.step++;render()">${l}</button></div>`}function render(){let b='';if(S.step===0)b=`<div class="problem">不用再從聊天紀錄找尺寸、口味和字卡；這次預訂會完整整理。</div><h2>先選蛋糕尺寸</h2><p class="hint">價格含基本抹面與簡約裝飾</p><div class="grid">${sizes.map(x=>`<button class="choice ${S.size===x[0]?'on':''}" onclick="S.size='${x[0]}';S.price=${x[1]};render()"><span><b>${x[0]}</b><small>${x[2]}</small></span><b>NT$ ${x[1].toLocaleString()}</b></button>`).join('')}</div>${nav(!!S.size)}`;
if(S.step===1)b=`<h2>選一種口味</h2><p class="hint">內餡與蛋糕體已搭配好</p><div class="grid">${flavors.map(x=>`<button class="choice ${S.flavor===x?'on':''}" onclick="S.flavor='${x}';render()">${x}</button>`).join('')}</div>${nav(!!S.flavor)}`;
if(S.step===2)b=`<h2>裝飾與字卡</h2><p class="hint">裝飾可複選</p><div class="checks">${[['字卡',0],['數字蠟燭',30],['鮮花',300]].map(x=>`<label><input type="checkbox" ${S.decor.includes(x[0])?'checked':''} onchange="this.checked?S.decor.push('${x[0]}'):S.decor=S.decor.filter(v=>v!=='${x[0]}');render()"><span><b>${x[0]}</b> ${x[1]?`＋NT$ ${x[1]}`:'免費'}</span></label>`).join('')}</div>${S.decor.includes('字卡')?`<label>字卡內容（限 12 字）<textarea class="text" maxlength="12" rows="2" oninput="S.card=this.value;document.querySelector('.count').textContent='還可輸入 '+(12-this.value.length)+' 字'">${S.card}</textarea><div class="count">還可輸入 ${12-S.card.length} 字</div></label>`:''}${nav(!S.decor.includes('字卡')||!!S.card)}`;
if(S.step===3){b=`<h2>選取貨日期</h2><p class="hint">最早 3 天後，每天限量 8 顆</p><div class="grid">${days.map((d,i)=>`<button class="choice ${S.date===fmt(d)?'on':''}" ${i===2||i===5?'disabled':''} onclick="S.date='${fmt(d)}';S.time='';render()"><b>${fmt(d)}</b><span>${i===2||i===5?'額滿':`${[5,3,6,2,4,8,1][i]}／8 顆`}</span></button>`).join('')}</div>${S.date?`<p class="hint" style="margin-top:18px">選取貨時段</p><div class="slots">${['12:00–14:00','15:00–17:00','18:00–19:30'].map(x=>`<button class="slot ${S.time===x?'on':''}" onclick="S.time='${x}';render()">${x}</button>`).join('')}</div>`:''}${nav(S.date&&S.time)}`}
if(S.step===4)b=`<h2>留下取貨資料</h2><div class="fields"><label>稱呼<input class="text" id="n" value="${S.name}" placeholder="例如：陳小姐"></label><label>手機號碼<input class="text" id="p" inputmode="tel" maxlength="10" value="${S.phone}" placeholder="09xxxxxxxx"></label></div><div class="nav"><button class="btn" onclick="S.step--;render()">上一步</button><button class="btn next" onclick="S.name=document.querySelector('#n').value;S.phone=document.querySelector('#p').value;if(S.name&&/^09\\d{8}$/.test(S.phone)){S.step++;render()}else document.querySelector('h2').textContent='請填稱呼與正確手機號碼'">下一步</button></div>`;
if(S.step===5)b=`<h2>確認訂單與訂金</h2><p class="hint">訂金為總額一半，這是操作示範。</p>${sum()}${nav(true,`付一半訂金 NT$ ${Math.ceil(total()/2).toLocaleString()}（示範，不會扣款）`)}`;
if(S.step===6)b=`<div class="success"><div class="cakeicon">✓</div><h2>蛋糕預訂完成</h2><p>取貨前一天會傳 LINE 提醒你</p></div>${sum()}<p style="text-align:center"><b>取貨時付尾款 NT$ ${Math.floor(total()/2).toLocaleString()}</b></p>`;screen.innerHTML=head()+`<div class="content"><div class="progress">${S.step<6?`預訂進度 ${S.step+1}／6`:'訂單已成立'}</div>${b}</div>`}
function total(){return S.price+(S.decor.includes('數字蠟燭')?30:0)+(S.decor.includes('鮮花')?300:0)}function sum(){return `<div class="sum"><dl><dt>蛋糕</dt><dd>${S.size}・${S.flavor}</dd><dt>裝飾</dt><dd>${S.decor.join('、')||'基本裝飾'}${S.card?`<br>字卡：${S.card}`:''}</dd><dt>取貨</dt><dd>${S.date}<br>${S.time}</dd><dt>總額</dt><dd>NT$ ${total().toLocaleString()}</dd></dl></div>`}
function owner(){screen.innerHTML=head()+`<div class="content"><h2>未來 7 天產能</h2><p class="hint">每日限量 8 顆・示範數據</p>${days.map((d,i)=>{let n=[5,3,8,2,4,8,1][i];return `<div class="daybar"><b>${fmt(d)}</b><div class="bar"><i style="width:${n/8*100}%"></i></div><span>${n}／8</span></div>`}).join('')}<h2 style="margin-top:26px">依取貨日排序</h2>${[['9/18','王小姐','6 吋・伯爵茶蜜桃','生日快樂小米','訂金已收','尾款待收'],['9/19','林先生','8 吋・法芙可可脆片','三週年快樂','訂金已收','尾款待收'],['9/20','許小姐','10 吋・焙茶栗子','今天也要開心','訂金待補','尾款待收']].map(x=>`<article class="order"><b>${x[0]}・${x[1]}</b><div>${x[2]}</div><div>字卡：${x[3]}</div><span class="status">${x[4]}</span> <span class="status">${x[5]}</span></article>`).join('')}</div>`}render();
</script></body></html>
